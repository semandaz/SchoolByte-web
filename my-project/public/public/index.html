<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolByte - Welcome</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Global CSS Variables for Unified Color Palette */
        :root {
            /* Brand Colors */
            --color-brand-primary: #1a2a6c;    /* Dark Blue - Main brand color */
            --color-brand-secondary: #b21f1f; /* Deep Red/Maroon - Secondary brand color, accents */
            --color-brand-gold: #FFD700;       /* Gold - Accent for special elements, highlights */
            --color-brand-orange: #FFA500;    /* Orange - Used in gradients with gold */

            /* Neutral Palette */
            --color-neutral-white: #ffffff;
            --color-neutral-lightest: #f0f4f8; /* Very light gray/blue, good for subtle backgrounds */
            --color-neutral-light: #d1d5db;    /* Light gray for disabled elements, input borders */
            --color-neutral-medium: #9ca3af;    /* Medium gray for placeholders, disabled radio accents */
            --color-neutral-dark: #4b5563;       /* Dark gray for most body text, labels */
            --color-neutral-darkest: #333333;  /* Very dark gray for prominent text */

            /* Semantic Colors */
            --color-error-red: #e74c3c;         /* Standard error color */
            --color-error-red-dark: #c0392b;    /* Darker error red for hover states */
            --color-success-green: #2ecc71;     /* Success color */
            --color-info-blue: #3498db;         /* Info color */

            /* Background Gradients */
            --gradient-background-primary: linear-gradient(135deg, var(--color-brand-primary), var(--color-brand-secondary));
            --gradient-background-secondary: linear-gradient(135deg, var(--color-brand-primary), var(--color-brand-secondary), var(--color-brand-primary));

            /* Text Gradients */
            --gradient-text-gold: linear-gradient(to right, var(--color-brand-gold), var(--color-neutral-white));

            /* Button Gradients */
            --gradient-button-active: linear-gradient(to right, var(--color-brand-gold), var(--color-brand-orange));
            --gradient-button-active-hover: linear-gradient(to right, #FFC800, #FF8C00);

            /* Transparent Overlays */
            --overlay-light: rgba(255, 255, 255, 0.1);
            --overlay-medium: rgba(0, 0, 0, 0.2);
            --overlay-dark: rgba(30, 30, 60, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--gradient-background-secondary);
            min-height: 100vh;
            color: var(--color-neutral-white);
            overflow-x: hidden;
        }

        /* Floating Books Animation */
        .floating-books {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .book {
            position: absolute;
            font-size: 2rem;
            color: var(--color-brand-gold);
            opacity: 0.7;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Main Content */
        .main-content {
            position: relative;
            z-index: 10;
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
        }

        /* Logo */
        .logo {
            font-size: 4rem;
            font-weight: 900;
            background: var(--gradient-text-gold);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
            margin-bottom: 1rem;
            display: inline-block;
        }

        /* Avatar */
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--gradient-background-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-neutral-white);
            font-size: 3rem;
            margin: 0 auto 1.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.05) rotate(5deg);
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--color-neutral-white);
        }

        input[type="text"],
        input[type="radio"] {
            accent-color: var(--color-brand-gold);
        }

        input[type="text"] {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--overlay-light);
            border-radius: 10px;
            font-size: 1rem;
            background-color: var(--overlay-light);
            color: var(--color-neutral-white);
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--color-brand-gold);
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.2);
            outline: none;
        }

        input[type="text"]::placeholder {
            color: var(--color-neutral-light);
        }

        /* Radio Buttons */
        .radio-group {
            margin-top: 1rem;
        }

        .radio-option {
            display: flex;
            align-items: center;
            margin-bottom: 0.8rem;
            cursor: pointer;
        }

        .radio-option input {
            margin-right: 0.8rem;
            width: 1.2rem;
            height: 1.2rem;
        }

        .radio-option span {
            color: var(--color-neutral-white);
        }

        /* Continue Button */
        .continue-btn {
            display: inline-block;
            background: var(--gradient-button-active);
            color: var(--color-neutral-darkest);
            padding: 1rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 1rem;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .continue-btn:hover {
            background: var(--gradient-button-active-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .continue-btn:disabled {
            background: var(--color-neutral-medium);
            color: var(--color-neutral-dark);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Error Message */
        .error-message {
            color: var(--color-brand-gold);
            text-align: center;
            margin-top: 1rem;
            min-height: 1.5rem;
            font-weight: 500;
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.3);
        }

        /* Moving Gradient Background */
        .moving-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--color-brand-primary), var(--color-brand-secondary), var(--color-brand-primary));
            background-size: 400% 400%;
            animation: gradient-shift 15s ease infinite;
            z-index: -1;
        }

        @keyframes gradient-shift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
            
            .book, .moving-gradient {
                display: none !important;
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-content {
                padding: 2rem 1rem;
            }
            
            .logo {
                font-size: 3rem;
            }
            
            .avatar {
                width: 80px;
                height: 80px;
                font-size: 2.5rem;
            }
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedFont = localStorage.getItem('preferredFont');
            if (savedFont) {
                document.body.style.fontFamily = savedFont;
            } else {
                document.body.style.fontFamily = 'Inter, sans-serif';
            }
        });
    </script>
</head>
<body>
    <!-- Moving Gradient Background -->
    <div class="moving-gradient"></div>
    
    <!-- Floating Books -->
    <div class="floating-books" id="floatingBooks"></div>
    
    <!-- Main Content -->
    <div class="main-content">
        <h1 class="logo">SchoolByte</h1>
        
        <div class="avatar">
            <i class="fas fa-user-graduate"></i>
        </div>
        
        <h2 class="text-2xl font-semibold mb-6">Welcome to SchoolByte</h2>
        
        <!-- School Name -->
        <div class="form-group">
            <label for="schoolName">School Name:</label>
            <input type="text" id="schoolName" placeholder="e.g., Mengo Senior School" required>
        </div>
        
        <!-- Role Selection -->
        <div class="form-group">
            <label>Sign in as:</label>
            <div class="radio-group">
                <label class="radio-option">
                    <input type="radio" name="role" value="student" id="roleStudent">
                    <span>Student</span>
                </label>
                <label class="radio-option">
                    <input type="radio" name="role" value="teacher" id="roleTeacher">
                    <span>Teacher</span>
                </label>
                <label class="radio-option">
                    <input type="radio" name="role" value="admin" id="roleAdmin">
                    <span>Admin</span>
                </label>

            </div>
        </div>
        
        <!-- Login/Signup Selection -->
        <div class="form-group">
            <label>Login or Sign up</label>
            <div class="radio-group">
                <label class="radio-option">
                    <input type="radio" name="auth" value="login" id="authLogin">
                    <span>Log In</span>
                </label>
                <label class="radio-option" id="signupLabel">
                    <input type="radio" name="auth" value="signup" id="authSignup">
                    <span>Sign Up</span>
                </label>
            </div>
        </div>
        
        <!-- Error Message -->
        <div id="errorMessage" class="error-message" aria-live="polite"></div>
        
        <!-- Continue Button -->
        <button id="continueBtn" class="continue-btn" disabled>Continue</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Create floating books
            createFloatingBooks();

            // Cache DOM elements
            const elements = {
                schoolNameInput: document.getElementById('schoolName'),
                continueBtn: document.getElementById('continueBtn'),
                roleRadios: document.querySelectorAll('input[name="role"]'),
                authRadios: document.querySelectorAll('input[name="auth"]'),
                authLogin: document.getElementById('authLogin'),
                authSignup: document.getElementById('authSignup'),
                signupLabel: document.getElementById('signupLabel'),
                errorMessage: document.getElementById('errorMessage'),
                roleAdmin: document.getElementById('roleAdmin'), // Added for Admin radio
                authLoginLabel: document.querySelector('label[for="authLogin"]') // Get the label for Login radio
            };

            const REGISTERED_SCHOOL_NAME = "Mengo Senior School";

            // Create floating books animation
            function createFloatingBooks() {
                const container = document.getElementById('floatingBooks');
                const bookCount = 15;
                const bookIcons = ['book', 'book-open', 'bookmark', 'graduation-cap', 'scroll', 'file-alt'];

                // Check for reduced motion preference
                const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (reducedMotion) return;

                for (let i = 0; i < bookCount; i++) {
                    const book = document.createElement('i');
                    book.classList.add('book', 'fas', `fa-${bookIcons[Math.floor(Math.random() * bookIcons.length)]}`);

                    // Random position and animation
                    const posX = Math.random() * 100;
                    const delay = Math.random() * 10;
                    const duration = Math.random() * 15 + 10;
                    const size = Math.random() * 1 + 1;

                    book.style.left = `${posX}%`;
                    book.style.animationDuration = `${duration}s`;
                    book.style.animationDelay = `${delay}s`;
                    book.style.fontSize = `${size}rem`;

                    container.appendChild(book);
                }
            }

            // Update UI based on selections
            function updateUI() {
                const schoolNameValue = elements.schoolNameInput.value.trim();
                const schoolNameFilled = schoolNameValue !== '';
                const isSchoolRegistered = schoolNameValue.toLowerCase() === REGISTERED_SCHOOL_NAME.toLowerCase();
                const selectedRole = document.querySelector('input[name="role"]:checked')?.value;
                let selectedAuth = document.querySelector('input[name="auth"]:checked')?.value;

                // Admin and Teacher sign-up restriction
                if (selectedRole === 'teacher' || selectedRole === 'admin') {
                    elements.authSignup.disabled = true;
                    elements.signupLabel.style.display = 'none'; // Hide signup option
                    elements.authLogin.checked = true; // Automatically select Login
                    selectedAuth = 'login';
                } else {
                    elements.authSignup.disabled = false;
                    elements.signupLabel.style.display = 'flex'; // Show signup option
                }

                // Determine button state
                const allFieldsSelected = schoolNameFilled && selectedRole && selectedAuth;
                const isValidCombination = !(selectedRole === 'teacher' && selectedAuth === 'signup') && !(selectedRole === 'admin' && selectedAuth === 'signup');

                if (allFieldsSelected && isValidCombination && isSchoolRegistered) {
                    elements.continueBtn.disabled = false;
                    elements.errorMessage.textContent = '';
                } else {
                    elements.continueBtn.disabled = true;

                    // Error messages in priority order
                    if (!isSchoolRegistered && schoolNameFilled) {
                        elements.errorMessage.textContent = `${schoolNameValue} has not yet registered for SchoolByte.`;
                    } else if (!schoolNameFilled) {
                        elements.errorMessage.textContent = 'Please enter your school name.';
                    } else if (!selectedRole) {
                        elements.errorMessage.textContent = 'Please select your role (Student/Teacher/Admin).';
                    } else if (selectedRole === 'teacher' && selectedAuth === 'signup') {
                        elements.errorMessage.textContent = 'Teachers can only log in, not sign up.';
                    } else if (selectedRole === 'admin' && selectedAuth === 'signup') {
                        elements.errorMessage.textContent = 'Admins can only log in, not sign up.';
                    } else if (!selectedAuth) {
                        elements.errorMessage.textContent = 'Please select Login or Sign Up.';
                    } else {
                        elements.errorMessage.textContent = '';
                    }
                }
            }

            // Handle continue button click
            function handleContinue() {
                const schoolName = elements.schoolNameInput.value.trim();
                const selectedRole = document.querySelector('input[name="role"]:checked')?.value;
                const selectedAuth = document.querySelector('input[name="auth"]:checked')?.value;

                // Safeguard check (button should be disabled if invalid)
                const isSchoolRegistered = schoolName.toLowerCase() === REGISTERED_SCHOOL_NAME.toLowerCase();
                if (!schoolName || !selectedRole || !selectedAuth || !isSchoolRegistered) {
                    updateUI();
                    return;
                }

                // Redirect based on role and action
                const redirectMap = {
                    student: {
                        login: 'studentlogin.html',
                        signup: 'studentsignup.html'
                    },
                    teacher: {
                        login: 'teacherlogin.html'
                    },
                    admin: {
                        login: 'adminlogin.html'
                    }
                };

                const redirectURL = redirectMap[selectedRole]?.[selectedAuth];
                if (redirectURL) {
                    window.location.href = redirectURL;
                } else {
                    elements.errorMessage.textContent = 'An unexpected redirection error occurred.';
                }
            }

            // Event listeners
            elements.schoolNameInput.addEventListener('input', updateUI);
            elements.roleRadios.forEach(radio => radio.addEventListener('change', updateUI));
            elements.authRadios.forEach(radio => radio.addEventListener('change', updateUI));
            elements.continueBtn.addEventListener('click', handleContinue);

            // Initial UI update
            updateUI();
        });
    </script>
</body>
</html>
