<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolByte - Reset Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Global CSS Variables for Unified Color Palette */
        :root {
            /* Brand Colors */
            --color-brand-primary: #1a2a6c;    /* Dark Blue - Main brand color */
            --color-brand-secondary: #b21f1f; /* Deep Red/Maroon - Secondary brand color, accents */
            --color-brand-gold: #FFD700;       /* Gold - Accent for special elements, highlights */
            --color-brand-orange: #FFA500;    /* Orange - Used in gradients with gold */

            /* Neutral Palette */
            --color-neutral-white: #ffffff;
            --color-neutral-lightest: #f0f4f8; /* Very light gray/blue, good for subtle backgrounds */
            --color-neutral-light: #d1d5db;    /* Light gray for disabled elements, input borders */
            --color-neutral-medium: #9ca3af;    /* Medium gray for placeholders, disabled radio accents */
            --color-neutral-dark: #4b5563;       /* Dark gray for most body text, labels */
            --color-neutral-darkest: #333333;  /* Very dark gray for prominent text */

            /* Semantic Colors */
            --color-error-red: #e74c3c;         /* Standard error color */
            --color-error-red-dark: #c0392b;    /* Darker error red for hover states */
            --color-success-green: #2ecc71;     /* Success color */
            --color-info-blue: #3498db;         /* Info color */

            /* Background Gradients */
            --gradient-background-primary: linear-gradient(135deg, var(--color-brand-primary), var(--color-brand-secondary));
            --gradient-background-secondary: linear-gradient(135deg, var(--color-brand-primary), var(--color-brand-secondary), var(--color-brand-primary));

            /* Text Gradients */
            --gradient-text-gold: linear-gradient(to right, var(--color-brand-gold), var(--color-neutral-white));

            /* Button Gradients */
            --gradient-button-active: linear-gradient(to right, var(--color-brand-gold), var(--color-brand-orange));
            --gradient-button-active-hover: linear-gradient(to right, #FFC800, #FF8C00);

            /* Transparent Overlays */
            --overlay-light: rgba(255, 255, 255, 0.1);
            --overlay-medium: rgba(0, 0, 0, 0.2);
            --overlay-dark: rgba(30, 30, 60, 0.95);
            --overlay-very-transparent: rgba(200, 200, 210, 0.15); /* Very transparent grey */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--gradient-background-secondary);
            min-height: 100vh;
            color: var(--color-neutral-white);
            overflow-x: hidden;
        }

        /* Floating Books Animation */
        .floating-books {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .book {
            position: absolute;
            font-size: 2rem;
            color: var(--color-brand-gold);
            opacity: 0.7;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Main Content */
        .main-content {
            position: relative;
            z-index: 10;
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
        }

        /* Logo */
        .logo {
            font-size: 4rem;
            font-weight: 900;
            background: var(--gradient-text-gold);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
            margin-bottom: 1rem;
            display: inline-block;
        }

        /* Avatar */
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--gradient-background-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-neutral-white);
            font-size: 3rem;
            margin: 0 auto 1.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.05) rotate(5deg);
        }

        /* Reset Container */
        .reset-container {
            background-color: var(--overlay-very-transparent);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-top: 1.5rem;
            text-align: left;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Tabs */
        .tabs {
            display: flex;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .tab {
            padding: 0.8rem 1.5rem;
            cursor: pointer;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            color: var(--color-neutral-white);
        }

        .tab.active {
            border-bottom: 3px solid var(--color-brand-gold);
            color: var(--color-brand-gold);
        }

        .tab:hover:not(.active) {
            color: var(--color-brand-gold);
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--color-neutral-white);
        }

        input[type="password"],
        input[type="email"],
        input[type="text"] {
            width: 100%;
            padding: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            font-size: 1rem;
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--color-neutral-white);
            transition: all 0.3s;
        }

        input[type="password"]:focus,
        input[type="email"]:focus,
        input[type="text"]:focus {
            border-color: var(--color-brand-gold);
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.2);
            outline: none;
            background-color: rgba(255, 255, 255, 0.15);
        }

        input[type="password"]::placeholder,
        input[type="email"]::placeholder,
        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        /* Password Fields */
        .password-fields {
            display: none;
        }

        .password-fields.active {
            display: block;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            background: var(--gradient-button-active);
            color: var(--color-neutral-darkest);
            padding: 1rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 1rem;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            background: var(--gradient-button-active-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .btn:disabled {
            background: var(--color-neutral-medium);
            color: var(--color-neutral-dark);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Message Box */
        .message-box {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .message-box.active {
            opacity: 1;
            visibility: visible;
        }

        .message-content {
            background-color: var(--overlay-very-transparent);
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .message-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .message-icon.loading {
            color: var(--color-brand-gold);
            animation: spin 1.5s linear infinite;
        }

        .message-icon.success {
            color: var(--color-success-green);
        }

        .message-text {
            margin-bottom: 1.5rem;
            font-size: 1.2rem;
            color: var(--color-neutral-white);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Moving Gradient Background */
        .moving-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--color-brand-primary), var(--color-brand-secondary), var(--color-brand-primary));
            background-size: 400% 400%;
            animation: gradient-shift 15s ease infinite;
            z-index: -1;
        }

        @keyframes gradient-shift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }

            .book, .moving-gradient {
                display: none !important;
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-content {
                padding: 2rem 1rem;
            }

            .logo {
                font-size: 3rem;
            }

            .avatar {
                width: 80px;
                height: 80px;
                font-size: 2.5rem;
            }

            .reset-container {
                padding: 1.5rem;
            }

            .tabs {
                flex-direction: column;
            }

            .tab {
                text-align: center;
                margin-bottom: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Moving Gradient Background -->
    <div class="moving-gradient"></div>

    <!-- Floating Books -->
    <div class="floating-books" id="floatingBooks"></div>

    <!-- Main Content -->
    <div class="main-content">
        <h1 class="logo">SchoolByte</h1>

        <div class="avatar">
            <i class="fas fa-user-shield"></i>
        </div>

        <h2 class="text-2xl font-semibold mb-6">Reset Your Password</h2>

        <!-- Reset Container -->
        <div class="reset-container">
            <!-- Tabs -->
            <div class="tabs">
                <div class="tab active" id="passwordTab">Using Password</div>
                <div class="tab" id="emailTab">Email Verification</div>
            </div>

            <!-- Password Reset Form -->
            <div id="passwordForm" class="form-content">
                <div class="form-group">
                    <label for="oldPassword">Old Password</label>
                    <input type="password" id="oldPassword" placeholder="Enter your current password">
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter your new password">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your new password">
                </div>

                <button id="changePasswordBtn" class="btn">Change Password</button>
            </div>

            <!-- Email Verification Form -->
            <div id="emailForm" class="form-content" style="display: none;">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email address">
                </div>

                <div class="form-group">
                    <label for="verificationCode">Verification Code</label>
                    <input type="text" id="verificationCode" placeholder="Enter verification code">
                </div>

                <div id="passwordFields" class="password-fields">
                    <div class="form-group">
                        <label for="newPasswordEmail">New Password</label>
                        <input type="password" id="newPasswordEmail" placeholder="Enter your new password">
                    </div>

                    <div class="form-group">
                        <label for="confirmPasswordEmail">Confirm New Password</label>
                        <input type="password" id="confirmPasswordEmail" placeholder="Confirm your new password">
                    </div>
                </div>

                <button id="verifyEmailBtn" class="btn">Verify Email</button>
            </div>
        </div>
    </div>

    <!-- Message Box -->
    <div class="message-box" id="messageBox">
        <div class="message-content">
            <div class="message-icon loading" id="messageIcon">
                <i class="fas fa-spinner"></i>
            </div>
            <div class="message-text" id="messageText">Changing your password...</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Create floating books
            createFloatingBooks();

            // Cache DOM elements
            const elements = {
                passwordTab: document.getElementById('passwordTab'),
                emailTab: document.getElementById('emailTab'),
                passwordForm: document.getElementById('passwordForm'),
                emailForm: document.getElementById('emailForm'),
                changePasswordBtn: document.getElementById('changePasswordBtn'),
                verifyEmailBtn: document.getElementById('verifyEmailBtn'),
                verificationCode: document.getElementById('verificationCode'),
                passwordFields: document.getElementById('passwordFields'),
                messageBox: document.getElementById('messageBox'),
                messageIcon: document.getElementById('messageIcon'),
                messageText: document.getElementById('messageText')
            };

            // Create floating books animation
            function createFloatingBooks() {
                const container = document.getElementById('floatingBooks');
                const bookCount = 15;
                const bookIcons = ['book', 'book-open', 'bookmark', 'graduation-cap', 'scroll', 'file-alt'];

                // Check for reduced motion preference
                const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (reducedMotion) return;

                for (let i = 0; i < bookCount; i++) {
                    const book = document.createElement('i');
                    book.classList.add('book', 'fas', `fa-${bookIcons[Math.floor(Math.random() * bookIcons.length)]}`);

                    // Random position and animation
                    const posX = Math.random() * 100;
                    const delay = Math.random() * 10;
                    const duration = Math.random() * 15 + 10;
                    const size = Math.random() * 1 + 1;

                    book.style.left = `${posX}%`;
                    book.style.animationDuration = `${duration}s`;
                    book.style.animationDelay = `${delay}s`;
                    book.style.fontSize = `${size}rem`;

                    container.appendChild(book);
                }
            }

            // Tab switching functionality
            elements.passwordTab.addEventListener('click', () => {
                elements.passwordTab.classList.add('active');
                elements.emailTab.classList.remove('active');
                elements.passwordForm.style.display = 'block';
                elements.emailForm.style.display = 'none';
            });

            elements.emailTab.addEventListener('click', () => {
                elements.emailTab.classList.add('active');
                elements.passwordTab.classList.remove('active');
                elements.emailForm.style.display = 'block';
                elements.passwordForm.style.display = 'none';
            });

            // Show password fields when verification code is entered
            elements.verificationCode.addEventListener('input', () => {
                if (elements.verificationCode.value.length >= 4) {
                    elements.passwordFields.classList.add('active');
                    elements.verifyEmailBtn.textContent = 'Change Password';
                } else {
                    elements.passwordFields.classList.remove('active');
                    elements.verifyEmailBtn.textContent = 'Verify Email';
                }
            });

            // Show message box
            function showMessageBox(message, isSuccess = false) {
                elements.messageText.textContent = message;
                elements.messageIcon.innerHTML = isSuccess ? 
                    '<i class="fas fa-check-circle"></i>' : 
                    '<i class="fas fa-spinner"></i>';
                elements.messageIcon.className = isSuccess ? 
                    'message-icon success' : 'message-icon loading';
                elements.messageBox.classList.add('active');
            }

            // Hide message box
            function hideMessageBox() {
                elements.messageBox.classList.remove('active');
            }

            const API_URL = window.location.origin;
            let verificationCodeSent = false;

            // Handle password change using old password
            async function changePasswordWithOldPassword() {
                const oldPassword = document.getElementById('oldPassword').value;
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                // Basic validation
                if (!oldPassword || !newPassword || !confirmPassword) {
                    alert('Please fill in all fields');
                    return;
                }

                if (newPassword !== confirmPassword) {
                    alert('New passwords do not match');
                    return;
                }

                if (newPassword.length < 6) {
                    alert('New password must be at least 6 characters long');
                    return;
                }

                const token = localStorage.getItem('token');
                if (!token) {
                    alert('Please log in first to change your password');
                    window.location.href = '/';
                    return;
                }

                showMessageBox("Changing your password...", false);

                try {
                    const response = await fetch(`${API_URL}/student/change-password`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ oldPassword, newPassword })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showMessageBox("✓ Password changed successfully!", true);
                        setTimeout(() => {
                            window.location.href = 'studentdashboard.html';
                        }, 2000);
                    } else {
                        hideMessageBox();
                        alert(data.message || 'Failed to change password');
                    }
                } catch (error) {
                    hideMessageBox();
                    console.error('Error:', error);
                    alert('An error occurred. Please try again.');
                }
            }

            // Handle email verification button click
            async function handleEmailVerification() {
                const email = document.getElementById('email').value;
                const verificationCode = document.getElementById('verificationCode').value;

                // Basic validation
                if (!email) {
                    alert('Please enter your email address');
                    return;
                }

                // If no code entered, send verification code
                if (!verificationCode) {
                    showMessageBox("Sending verification code...", false);
                    
                    try {
                        const response = await fetch(`${API_URL}/student/send-password-reset-code`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email })
                        });

                        const data = await response.json();

                        if (response.ok) {
                            hideMessageBox();
                            verificationCodeSent = true;
                            alert('✓ Verification code sent to your email! Please check your inbox.');
                            document.getElementById('verificationCode').focus();
                        } else {
                            hideMessageBox();
                            alert(data.message || 'Failed to send verification code');
                        }
                    } catch (error) {
                        hideMessageBox();
                        console.error('Error:', error);
                        alert('An error occurred. Please try again.');
                    }
                    return;
                }

                // If code entered and password fields shown, reset password
                if (elements.passwordFields.classList.contains('active')) {
                    const newPassword = document.getElementById('newPasswordEmail').value;
                    const confirmPassword = document.getElementById('confirmPasswordEmail').value;

                    if (!newPassword || !confirmPassword) {
                        alert('Please fill in all password fields');
                        return;
                    }

                    if (newPassword !== confirmPassword) {
                        alert('New passwords do not match');
                        return;
                    }

                    if (newPassword.length < 6) {
                        alert('New password must be at least 6 characters long');
                        return;
                    }

                    showMessageBox("Resetting your password...", false);

                    try {
                        const response = await fetch(`${API_URL}/student/reset-password-with-code`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                email, 
                                code: verificationCode, 
                                newPassword 
                            })
                        });

                        const data = await response.json();

                        if (response.ok) {
                            showMessageBox("✓ Password reset successfully!", true);
                            setTimeout(() => {
                                window.location.href = '/';
                            }, 2000);
                        } else {
                            hideMessageBox();
                            alert(data.message || 'Failed to reset password');
                        }
                    } catch (error) {
                        hideMessageBox();
                        console.error('Error:', error);
                        alert('An error occurred. Please try again.');
                    }
                }
            }

            // Handle password change button click
            elements.changePasswordBtn.addEventListener('click', changePasswordWithOldPassword);

            // Handle email verification button click
            elements.verifyEmailBtn.addEventListener('click', handleEmailVerification);
        });
    </script>
</body>
</html>
