
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolByte - Set Initial Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--user-font-family, 'Inter', sans-serif);
        }

        body {
            background: linear-gradient(135deg, #2c3e50, #1a2530);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ecf0f1;
            padding: 20px;
        }

        .setup-container {
            width: 100%;
            max-width: 450px;
            background: rgba(30, 40, 56, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            padding: 40px;
            border: 1px solid rgba(127, 140, 163, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            color: #3498db;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #ecf0f1;
        }

        .description {
            color: #bdc3c7;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #bdc3c7;
            font-size: 15px;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #3498db;
            font-size: 18px;
        }

        .form-control {
            width: 100%;
            padding: 15px 15px 15px 50px;
            background: rgba(25, 35, 50, 0.6);
            border: 1px solid rgba(127, 140, 163, 0.3);
            border-radius: 10px;
            color: #ecf0f1;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-control:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
            background: rgba(30, 45, 65, 0.7);
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #7f8c8d;
            cursor: pointer;
            font-size: 18px;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: #3498db;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(to right, #3498db, #2980b9);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(41, 128, 185, 0.3);
        }

        .btn:hover:not(:disabled) {
            background: linear-gradient(to right, #2980b9, #2573a7);
            box-shadow: 0 6px 20px rgba(41, 128, 185, 0.4);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #e74c3c;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: rgba(46, 204, 113, 0.1);
            color: #2ecc71;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #2ecc71;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .password-requirements {
            background: rgba(52, 152, 219, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 4px solid #3498db;
        }

        .password-requirements h4 {
            color: #3498db;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .password-requirements ul {
            list-style: none;
            padding: 0;
        }

        .password-requirements li {
            color: #bdc3c7;
            font-size: 13px;
            margin-bottom: 5px;
            padding-left: 20px;
            position: relative;
        }

        .password-requirements li::before {
            content: "•";
            color: #3498db;
            position: absolute;
            left: 0;
        }
    </style>
</head>
<body>
    <div class="setup-container">
        <div class="header">
            <div class="logo">
                <i class="fas fa-key"></i>
            </div>
            <h1>Set Your Password</h1>
            <p class="description">
                Welcome to SchoolByte! Please set your initial password to complete your account setup.
            </p>
        </div>

        <form id="password-form">
            <div class="form-group">
                <label for="new-password">New Password</label>
                <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <div class="password-container">
                        <input 
                            type="password" 
                            id="new-password" 
                            class="form-control" 
                            placeholder="Enter your new password"
                            required
                        >
                        <button type="button" class="toggle-password" id="toggleNewPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <div class="password-container">
                        <input 
                            type="password" 
                            id="confirm-password" 
                            class="form-control" 
                            placeholder="Confirm your new password"
                            required
                        >
                        <button type="button" class="toggle-password" id="toggleConfirmPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="password-requirements">
                <h4>Password Requirements:</h4>
                <ul>
                    <li>At least 6 characters long</li>
                    <li>Use a combination of letters and numbers</li>
                    <li>Avoid common passwords</li>
                </ul>
            </div>

            <div class="error-message" id="error-message"></div>
            <div class="success-message" id="success-message"></div>

            <button type="submit" class="btn" id="set-password-btn">
                Set Password
            </button>
        </form>
    </div>

    <script>
        // 1. CHECK TOKEN IMMEDIATELY (outside DOMContentLoaded)
        // If the token is missing, redirect instantly, minimizing the flash.
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'teacherlogin.html';
        }

        // 2. UTILITY FUNCTIONS (Defined globally so form submission can use them)
        // These functions must be defined before they are used.
        function getMessageElements() {
            return {
                errorMessage: document.getElementById('error-message'),
                successMessage: document.getElementById('success-message')
            };
        }

        function showError(message) {
            const { errorMessage, successMessage } = getMessageElements();
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            successMessage.classList.remove('show');
        }

        function showSuccess(message) {
            const { errorMessage, successMessage } = getMessageElements();
            successMessage.textContent = message;
            successMessage.classList.add('show');
            errorMessage.classList.remove('show');
        }

        function hideMessages() {
            const { errorMessage, successMessage } = getMessageElements();
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
        }


        // 3. MAIN ASYNCHRONOUS AUTHENTICATION AND SETUP FUNCTION
        async function verifyTokenAndSetup() {
            try {
                console.log('Verifying token with /teacher/profile...');

                // SERVER-SIDE VALIDATION: Calls the protected /teacher/profile endpoint
                const response = await fetch('/teacher/profile', { 
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                console.log('Token verification status:', response.status);

                // Handle unauthorized (expired/invalid token)
                if (response.status === 401 || response.status === 403) {
                    console.log('Token invalid, redirecting');
                    localStorage.removeItem('token');
                    window.location.href = 'teacherlogin.html';
                    return;
                }

                if (!response.ok) {
                    // This catches server errors (e.g., 500)
                    throw new Error(`Token verification failed with status: ${response.status}`);
                }

                const data = await response.json();

                // Check if password is already set - if so, redirect to dashboard
                if (data.teacher && data.teacher.isPasswordSet === true) {
                    console.log('Password already set, redirecting to dashboard');
                    window.location.href = 'teacherdashboard.html';
                    return;
                }

                console.log('Authentication passed. Setting up form listeners.');

                // If authentication passed and password is NOT set, proceed to form setup
                setupFormListeners();

            } catch (error) {
                console.error('Initial setup failed:', error);
                localStorage.removeItem('token');
                window.location.href = 'teacherlogin.html';
            }
        }

        // 4. FORM SETUP (Moved into a function to run ONLY after verification passes)
        function setupFormListeners() {
            const passwordForm = document.getElementById('password-form');
            const newPasswordInput = document.getElementById('new-password');
            const confirmPasswordInput = document.getElementById('confirm-password');
            const setPasswordBtn = document.getElementById('set-password-btn');
            const toggleNewPassword = document.getElementById('toggleNewPassword');
            const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');

            // Toggle password visibility
            function setupPasswordToggle(toggleBtn, passwordInput) {
                toggleBtn.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);

                    if (type === 'password') {
                        this.innerHTML = '<i class="fas fa-eye"></i>';
                    } else {
                        this.innerHTML = '<i class="fas fa-eye-slash"></i>';
                    }
                });
            }

            setupPasswordToggle(toggleNewPassword, newPasswordInput);
            setupPasswordToggle(toggleConfirmPassword, confirmPasswordInput);

            // Handle form submission
            passwordForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                hideMessages();

                const newPassword = newPasswordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                // Validation (using 6 characters as per your HTML)
                if (newPassword.length < 6) {
                    showError('Password must be at least 6 characters long.');
                    return;
                }
                if (newPassword !== confirmPassword) {
                    showError('Passwords do not match.');
                    return;
                }

                setPasswordBtn.disabled = true;
                setPasswordBtn.innerHTML = '<span class="loading"></span> Setting Password...';

                try {
                    // The form submission call is correct!
                    const response = await fetch('/teacher/set-initial-password', {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            newPassword: newPassword
                        }),
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.message || 'Failed to set password');
                    }

                    showSuccess('Password set successfully! Redirecting to dashboard...');

                    // Final redirect after success
                    setTimeout(() => {
                        window.location.href = 'teacherdashboard.html';
                    }, 2000);

                } catch (error) {
                    console.error('Password setup error:', error);
                    showError(error.message || 'Failed to set password. Please try again.');
                } finally {
                    setPasswordBtn.disabled = false;
                    setPasswordBtn.textContent = 'Set Password';
                }
            });
        }

        // 5. START THE WHOLE PROCESS
        document.addEventListener('DOMContentLoaded', verifyTokenAndSetup);
    </script>
</body>
</html>
