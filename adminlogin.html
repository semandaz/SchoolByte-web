<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolByte - Admin Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* General styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2c3e50, #1a2530);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ecf0f1;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            background: rgba(30, 40, 56, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            border: 1px solid rgba(127, 140, 163, 0.2);
            padding: 40px;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            color: #3498db;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #ecf0f1;
        }

        .description {
            color: #bdc3c7;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #bdc3c7;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            background: rgba(25, 35, 50, 0.6);
            border: 1px solid rgba(127, 140, 163, 0.3);
            border-radius: 10px;
            color: #ecf0f1;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
            background: rgba(30, 45, 65, 0.7);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, #3498db, #2980b9);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover:not(:disabled) {
            background: linear-gradient(to right, #2980b9, #2573a7);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(41, 128, 185, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #e74c3c;
            display: none;
            text-align: center;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <i class="fas fa-user-shield"></i>
        </div>
        <h1>Admin Login</h1>
        <p class="description">
            Please enter your admin email and password.
        </p>

        <form id="admin-login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="e.g., name@schoolbyte.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <div class="error-message" id="error-message"></div>

            <button type="submit" class="btn" id="login-btn">
                Log In
            </button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('admin-login-form');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('login-btn');
            const errorMessage = document.getElementById('error-message');
            // const ADMIN_PREFIX = 'admin:'; // Removed this constant

            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.classList.add('show');
            }

            function hideError() {
                errorMessage.classList.remove('show');
            }

            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                hideError();

                // Get the email directly without checking for a prefix
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();

                // Removed the prefix validation check
                // if (!fullEmail.startsWith(ADMIN_PREFIX)) {
                //     showError('Admin email must start with "admin:".');
                //     return;
                // }

                if (!email) {
                    showError('Please enter your email address.');
                    return;
                }

                if (!password) {
                    showError('Please enter your password.');
                    return;
                }

                // Removed the substring logic since there is no prefix to remove
                // const email = fullEmail.substring(ADMIN_PREFIX.length);

                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="loading"></span> Logging In...';

                try {
                    const response = await fetch('/login-admin', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        // The 'email' variable now holds the final email to send
                        body: JSON.stringify({ email, password }),
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.message || 'Login failed. Please try again.');
                    }

                    // Store the email without the prefix for the 2FA page
                    localStorage.setItem('adminEmail', email);

                    // Redirect to the 2FA verification page
                    window.location.href = 'admin-2fa-verify.html';

                } catch (error) {
                    console.error('Login error:', error);
                    showError(error.message || 'Login failed. Please check your credentials.');
                } finally {
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Log In';
                }
            });
        });
    </script>
</body>
</html>
