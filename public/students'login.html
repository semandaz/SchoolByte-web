<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolByte - Student Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Global CSS Variables for Unified Color Palette (copy from index.html) */
        :root {
          /* Brand Colors */
          --color-brand-primary: #1a2a6c;   /* Dark Blue - Main brand color */
          --color-brand-secondary: #b21f1f; /* Deep Red/Maroon - Secondary brand color, accents */
          --color-brand-gold: #FFD700;     /* Gold - Accent for special elements, highlights */
          --color-brand-orange: #FFA500;   /* Orange - Used in gradients with gold */

          /* Neutral Palette */
          --color-neutral-white: #ffffff;
          --color-neutral-lightest: #f0f4f8; /* Very light gray/blue, good for subtle backgrounds */
          --color-neutral-light: #d1d5db;    /* Light gray for disabled elements, input borders */
          --color-neutral-medium: #9ca3af;   /* Medium gray for placeholders, disabled radio accents */
          --color-neutral-dark: #4b5563;     /* Dark gray for most body text, labels */
          --color-neutral-darkest: #333333;  /* Very dark gray for prominent text (e.g., terms.html body) */

          /* Semantic Colors */
          --color-error-red: #e74c3c;        /* Standard error color */
          --color-error-red-dark: #c0392b;   /* Darker error red for hover states */

          /* Background Gradients */
          --gradient-background-primary: linear-gradient(135deg, var(--color-brand-primary), var(--color-brand-secondary));
          --gradient-background-secondary: linear-gradient(135deg, var(--color-brand-primary), var(--color-brand-secondary), var(--color-brand-primary));

          /* Text Gradients */
          --gradient-text-gold: linear-gradient(to right, var(--color-brand-gold), var(--color-neutral-white));

          /* Button Gradients */
          --gradient-button-active: linear-gradient(to right, var(--color-brand-gold), var(--color-brand-orange));
          --gradient-button-active-hover: linear-gradient(to right, #FFC800, #FF8C00);

          /* Transparent Overlays (for cards, popups, etc.) */
          --overlay-light: rgba(255, 255, 255, 0.1);
          --overlay-medium: rgba(0, 0, 0, 0.2);
          --overlay-dark: rgba(30, 30, 60, 0.95);
          --overlay-selected-option: rgba(26, 42, 108, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif; /* Standardized font */
        }

        body {
            background: var(--gradient-background-secondary); /* Consistent background gradient */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            padding: 40px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 4.5rem;
            font-weight: 900;
            background: var(--gradient-background-primary); /* Consistent text gradient */
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -2px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--color-brand-primary); /* Consistent subtitle color */
            font-size: 1.2rem;
            margin-top: 15px;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--gradient-background-primary); /* Consistent avatar background */
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: var(--color-neutral-white);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .profile-header h2 {
            color: var(--color-brand-primary); /* Consistent heading color */
            font-size: 1.8rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative; /* Added for send-code-btn positioning */
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-brand-primary); /* Consistent label color */
            font-weight: 600;
            font-size: 1.1rem;
        }

        .required::after {
            content: " *";
            color: var(--color-error-red); /* Consistent required indicator color */
        }

        input, select {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--color-neutral-light); /* Consistent border color */
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--color-brand-primary); /* Consistent focus border color */
            box-shadow: 0 0 0 3px rgba(26, 42, 108, 0.2);
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-neutral-dark); /* Consistent toggle color */
            cursor: pointer;
        }

        .password-hint {
            font-size: 0.85rem;
            color: var(--color-neutral-dark); /* Consistent password hint color */
            margin-top: 5px;
            font-style: italic;
        }

        /* Styles for send code button */
        .send-code-btn {
            position: absolute;
            right: 10px;
            top: 40px;
            background: var(--color-brand-primary); /* Consistent brand primary color */
            color: var(--color-neutral-white);
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .send-code-btn:hover:not(.disabled) {
            background: var(--color-brand-primary); /* Use a slightly darker shade if available */
            opacity: 0.9;
        }

        .send-code-btn.disabled {
            background: var(--color-neutral-light); /* Consistent disabled background */
            color: var(--color-neutral-dark); /* Consistent disabled text color */
            cursor: not-allowed;
        }

        .resend-code {
            text-align: right;
            margin-top: 5px;
            font-size: 0.9rem;
            color: var(--color-brand-primary); /* Consistent link color */
            cursor: pointer;
            display: none;
        }

        .resend-code:hover {
            text-decoration: underline;
        }

        .verification-code-input {
            letter-spacing: 10px; /* Wider spacing for verification code */
            text-align: center;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            margin: 25px 0;
            gap: 12px;
        }

        .terms input {
            width: 22px;
            height: 22px;
            margin-top: 3px;
        }

        .terms label {
            font-weight: normal;
            color: var(--color-neutral-dark); /* Consistent label text color */
        }

        .terms a {
            color: var(--color-brand-primary); /* Consistent link color */
            font-weight: 600;
            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 10px;
        }

        .btn {
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-back {
            background: var(--color-error-red); /* Consistent back button color */
            color: var(--color-neutral-white);
            flex: 1;
        }

        .btn-back:hover {
            background: var(--color-error-red-dark); /* Consistent hover for back button */
            transform: translateY(-2px);
        }

        .btn-submit {
            background: var(--color-brand-primary); /* Consistent submit button color */
            color: var(--color-neutral-white);
            flex: 2;
        }

        .btn-submit:hover {
            background: var(--color-brand-primary); /* Consider a darker shade if available, or just keep primary */
            opacity: 0.9; /* Add slight opacity change for hover if no dark variant */
            transform: translateY(-2px);
        }

        .btn-submit:disabled {
            background: var(--color-neutral-medium); /* Consistent disabled background */
            color: var(--color-neutral-dark); /* Consistent disabled text */
            cursor: not-allowed;
            transform: none;
        }

        .btn i {
            font-size: 1.2rem;
        }

        /* Custom Message Box Styles (copied for consistency) */
        .message-box-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }

        .message-box-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .message-box {
            background: var(--color-neutral-white);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }

        .message-box-overlay.show .message-box {
            transform: translateY(0);
        }

        .message-box h3 {
            color: var(--color-error-red);
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .message-box p {
            color: var(--color-neutral-darkest);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
            white-space: pre-wrap; /* Allows newlines from JS to display */
        }

        .message-box button {
            background: var(--color-brand-primary);
            color: var(--color-neutral-white);
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .message-box button:hover {
            background: var(--color-brand-primary); /* Consistent hover for primary */
        }

        @media (max-width: 768px) {
            .card {
                padding: 30px 20px;
            }

            .logo {
                font-size: 3.5rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .avatar {
                width: 100px;
                height: 100px;
                font-size: 2.5rem;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo-container">
                <div class="logo">SchoolByte</div>
                <p class="subtitle">Your personalized academic platform</p>
            </div>

            <div class="profile-header">
                <div class="avatar">
                    <i class="fas fa-user-graduate"></i>
                </div>
                <h2>Your Profile</h2>
            </div>

            <p class="subtitle" style="text-align: center; margin-bottom: 25px;">Enter your details to personalize your academic experience</p>

            <form id="studentProfileForm">
                <div class="form-group">
                    <label for="studentName" class="required">Student's Name</label>
                    <input type="text" id="studentName" placeholder="e.g., Naluwagga Joy" required>
                </div>

                <div class="form-group">
                    <label for="indexNumber" class="required">Index Number</label>
                    <input type="text" id="indexNumber" placeholder="e.g., 21/M/N/22" required>
                </div>

                <div class="form-group">
                    <label for="classTeacher">Class Teacher</label>
                    <input type="text" id="classTeacher" placeholder="e.g., Mr. Sentongo">
                </div>

                <div class="form-group">
                    <label for="class" class="required">Class</label>
                    <select id="class" required>
                        <option value="">Select Class</option>
                        <option value="S1">Senior 1</option>
                        <option value="S2">Senior 2</option>
                        <option value="S3">Senior 3</option>
                        <option value="S4">Senior 4</option>
                        <option value="S5">Senior 5</option>
                        <option value="S6">Senior 6</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="stream">Stream</label>
                    <select id="stream">
                        <option value="">Select Stream (Optional)</option>
                        <option value="Arts">Arts</option>
                        <option value="Science">Science</option>
                        <option value="Commercial">Commercial</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email" class="required">Email Address</label>
                    <input type="email" id="email" placeholder="e.g., student@schoolbyte.com" required>
                    <button type="button" id="sendCodeBtn" class="send-code-btn" disabled>Send Code</button>
                    <div id="resendCode" class="resend-code">Didn't receive code? Send code again</div>
                </div>

                <div class="form-group">
                    <label for="verificationCode">Verification Code</label>
                    <input type="text" id="verificationCode" placeholder="••••••" maxlength="6" class="verification-code-input" required>
                </div>

                <div class="form-group">
                    <label for="password" class="required">Password</label>
                    <div class="password-container">
                        <input type="password" id="password" required>
                        <span class="toggle-password" id="passwordToggle">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                    <p class="password-hint">Minimum 8 characters, at least one uppercase, one lowercase, one number, and one special character</p>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="required">Confirm Password</label>
                    <div class="password-container">
                        <input type="password" id="confirmPassword" required>
                        <span class="toggle-password" id="confirmPasswordToggle">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>

                <div class="terms">
                    <input type="checkbox" id="agreeTerms" class="custom-checkbox">
                    <label for="agreeTerms">
                        I have read and agree to the SchoolByte
                        <a href="term.html" target="_blank">Terms and Conditions</a>
                    </label>
                </div>

                <div class="buttons">
                    <button type="button" class="btn btn-back" onclick="location.href='index.html'">
                        <i class="fas fa-arrow-left"></i> Back
                    </button>
                    <button type="submit" id="submitButton" class="btn btn-submit" disabled>
                        Continue <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom Message Box HTML (copied for consistency) -->
    <div id="messageBoxOverlay" class="message-box-overlay">
        <div class="message-box">
            <h3 id="messageBoxTitle"></h3>
            <p id="messageBoxContent"></p>
            <button id="messageBoxCloseBtn">OK</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Get DOM elements
            const agreeTermsCheckbox = document.getElementById('agreeTerms');
            const submitButton = document.getElementById('submitButton');
            const passwordField = document.getElementById('password');
            const confirmPasswordField = document.getElementById('confirmPassword');
            const passwordToggle = document.getElementById('passwordToggle');
            const confirmPasswordToggle = document.getElementById('confirmPasswordToggle');
            const form = document.getElementById('studentProfileForm');
            const emailInput = document.getElementById('email');
            const sendCodeBtn = document.getElementById('sendCodeBtn');
            const resendCode = document.getElementById('resendCode');
            const verificationCode = document.getElementById('verificationCode');
            let countdownInterval;

            // Message Box elements
            const messageBoxOverlay = document.getElementById('messageBoxOverlay');
            const messageBoxTitle = document.getElementById('messageBoxTitle');
            const messageBoxContent = document.getElementById('messageBoxContent');
            const messageBoxCloseBtn = document.getElementById('messageBoxCloseBtn');

            // Function to display custom message box
            function showMessageBox(title, message) {
                messageBoxTitle.textContent = title;
                messageBoxContent.textContent = message;
                messageBoxOverlay.classList.add('show');
            }

            // Close message box
            messageBoxCloseBtn.addEventListener('click', function() {
                messageBoxOverlay.classList.remove('show');
            });

            // Toggle password visibility
            function setupPasswordToggle(field, toggle) {
                toggle.addEventListener('click', function() {
                    const icon = this.querySelector('i');
                    if (field.type === 'password') {
                        field.type = 'text';
                        icon.classList.remove('fa-eye');
                        icon.classList.add('fa-eye-slash');
                    } else {
                        field.type = 'password';
                        icon.classList.remove('fa-eye-slash');
                        icon.classList.add('fa-eye');
                    }
                });
            }

            // Set up password toggles
            setupPasswordToggle(passwordField, passwordToggle);
            setupPasswordToggle(confirmPasswordField, confirmPasswordToggle);

            // Validate email format
            function isValidEmail(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }

            // Start countdown timer
            function startCountdown() {
                let seconds = 60;
                sendCodeBtn.classList.add('disabled');
                sendCodeBtn.textContent = `Resend (${seconds}s)`;
                sendCodeBtn.disabled = true; // Disable during countdown

                countdownInterval = setInterval(function() {
                    seconds--;
                    sendCodeBtn.textContent = `Resend (${seconds}s)`;

                    if (seconds <= 0) {
                        clearInterval(countdownInterval);
                        sendCodeBtn.classList.remove('disabled');
                        sendCodeBtn.textContent = 'Send Code';
                        sendCodeBtn.disabled = false; // Re-enable after countdown
                        resendCode.style.display = 'block';
                    }
                }, 1000);
            }

            // Send verification code
            sendCodeBtn.addEventListener('click', function() {
                if (sendCodeBtn.classList.contains('disabled') || !isValidEmail(emailInput.value)) {
                    if (!isValidEmail(emailInput.value)) {
                         showMessageBox('Input Error', 'Please enter a valid email address to send the code.');
                    }
                    return;
                }

                // Here you would typically send the code to the email
                // For this demo, we'll just simulate it
                showMessageBox('Code Sent', 'A verification code has been sent to your email address.');
                startCountdown();
                resendCode.style.display = 'none';
            });

            // Resend verification code
            resendCode.addEventListener('click', function() {
                if (isValidEmail(emailInput.value)) {
                    showMessageBox('Code Resent', 'A new verification code has been sent to your email address.');
                    startCountdown();
                    this.style.display = 'none';
                } else {
                    showMessageBox('Input Error', 'Please enter a valid email address to resend the code.');
                }
            });

            // Validate form on input changes
            function validateForm() {
                const isFormValid = document.getElementById('studentName').value.trim() !== '' && 
                                   document.getElementById('indexNumber').value.trim() !== '' && 
                                   isValidEmail(emailInput.value) && 
                                   verificationCode.value.length === 6 && 
                                   passwordField.value.trim() !== '' && 
                                   confirmPasswordField.value.trim() !== '' &&
                                   agreeTermsCheckbox.checked;

                // Enable/disable Send Code button based on email validity
                if (isValidEmail(emailInput.value) && !sendCodeBtn.classList.contains('disabled')) {
                    sendCodeBtn.disabled = false;
                } else if (!isValidEmail(emailInput.value)) {
                    sendCodeBtn.disabled = true;
                }

                submitButton.disabled = !isFormValid;
                if (isFormValid) {
                    submitButton.classList.add('active');
                } else {
                    submitButton.classList.remove('active');
                }
            }

            // Add event listeners for form validation
            document.getElementById('studentName').addEventListener('input', validateForm);
            document.getElementById('indexNumber').addEventListener('input', validateForm);
            emailInput.addEventListener('input', validateForm);
            verificationCode.addEventListener('input', validateForm);
            passwordField.addEventListener('input', validateForm);
            confirmPasswordField.addEventListener('input', validateForm);
            agreeTermsCheckbox.addEventListener('change', validateForm);

            // Form submission
            form.addEventListener('submit', function(event) {
                event.preventDefault();

                // Validate password match
                if (passwordField.value !== confirmPasswordField.value) {
                    showMessageBox('Error', 'Passwords do not match!');
                    confirmPasswordField.focus();
                    return;
                }

                // Validate password strength
                const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+])[A-Za-z\d!@#$%^&*()_+]{8,}$/;
                if (!passwordRegex.test(passwordField.value)) {
                    showMessageBox('Password Requirements', 
                        'Password does not meet the requirements:\n' +
                        '- Minimum 8 characters\n' +
                        '- At least one uppercase letter\n' +
                        '- At least one lowercase letter\n' +
                        '- At least one number\n' +
                        '- At least one special character (!@#$%^&*()_+)');
                    passwordField.focus();
                    return;
                }

                // Add verification code check here
                if (verificationCode.value.length !== 6) {
                    showMessageBox('Validation Error', 'Please enter the 6-digit verification code.');
                    verificationCode.focus();
                    return;
                }

                // Get the first name
                const fullName = document.getElementById('studentName').value.trim();
                const firstName = fullName.split(' ')[0] || 'Student';

                // Redirect to threebii.html with the first name
                window.location.href = `threebii.html?name=${encodeURIComponent(firstName)}`;
            });

            // Initial validation when page loads
            validateForm();
        });
    </script>
</body>
</html>
