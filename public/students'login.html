<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolByte - Student Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Global CSS Variables for Unified Color Palette */
        :root {
          --color-brand-primary: #1a2a6c;   /* Dark Blue */
          --color-brand-secondary: #b21f1f; /* Deep Red/Maroon */
          --color-brand-gold: #FFD700;     /* Gold */
          --color-neutral-white: #ffffff;
          --color-neutral-lightest: #f0f4f8;
          --color-neutral-light: #d1d5db;
          --color-neutral-medium: #9ca3af;
          --color-neutral-dark: #4b5563;
          --color-neutral-darkest: #333333;
          --color-error-red: #e74c3c;
          --gradient-background-primary: linear-gradient(135deg, var(--color-brand-primary), var(--color-brand-secondary));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--gradient-background-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            max-width: 450px;
            width: 100%;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            padding: 40px;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            font-weight: 900;
            background: var(--gradient-background-primary);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .login-header {
            margin-bottom: 30px;
        }

        .login-header h2 {
            color: var(--color-brand-primary);
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .login-header p {
            color: var(--color-neutral-dark);
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-brand-primary);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .input-group {
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px;
            border: 2px solid var(--color-neutral-light);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            padding-right: 40px;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--color-brand-primary);
            box-shadow: 0 0 0 3px rgba(26, 42, 108, 0.1);
        }

        .input-group i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-neutral-medium);
            cursor: pointer;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remember-me input {
            accent-color: var(--color-brand-primary);
        }

        .forgot-password a {
            color: var(--color-brand-primary);
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--color-brand-primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .login-btn:hover {
            background: var(--color-brand-secondary);
            transform: translateY(-2px);
        }

        .login-btn:disabled {
            background: var(--color-neutral-medium);
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: var(--color-neutral-medium);
            font-size: 0.9rem;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid var(--color-neutral-light);
            margin: 0 10px;
        }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .social-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--color-neutral-lightest);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-brand-primary);
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            background: var(--color-neutral-light);
            transform: translateY(-2px);
        }

        .register-link {
            font-size: 0.95rem;
            color: var(--color-neutral-dark);
        }

        .register-link a {
            color: var(--color-brand-primary);
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* Custom Message Box Styles (copied from signup/profile for consistency) */
        .message-box-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }

        .message-box-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .message-box {
            background: var(--color-neutral-white);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }

        .message-box-overlay.show .message-box {
            transform: translateY(0);
        }

        .message-box h3 {
            color: var(--color-error-red); /* Default to error red for general messages */
            font-size: 1.8rem;
            margin-bottom: 15px;
        }
        .message-box h3.success-title {
            color: var(--color-brand-primary); /* Green for success messages */
        }


        .message-box p {
            color: var(--color-neutral-darkest);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
            white-space: pre-wrap; /* Allows newlines from JS to display */
        }

        .message-box button {
            background: var(--color-brand-primary);
            color: var(--color-neutral-white);
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .message-box button:hover {
            background: var(--color-brand-secondary); /* Consistent hover for primary */
        }
        
        @media (max-width: 768px) {
            .login-card {
                padding: 30px 25px;
            }
            
            .logo {
                font-size: 2.5rem;
            }
            
            .login-header h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">SchoolByte</div>
            
            <div class="login-header">
                <h2>Welcome Back</h2>
                <p>Sign in to your student account</p>
            </div>

            <form id="loginForm" novalidate> <!-- Added novalidate to prevent default browser validation -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-group">
                        <input type="email" id="email" placeholder="Enter your email address" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-group">
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <i class="fas fa-eye" id="togglePassword"></i>
                    </div>
                </div>

                <div class="options">
                    <div class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <label for="rememberMe">Remember me</label>
                    </div>
                    <div class="forgot-password">
                        <a href="#">Forgot password?</a>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginSubmitBtn">Log In</button> <!-- Added ID for easier JS access -->

                <div class="divider">or continue with</div>

                <div class="social-login">
                    <a href="#" class="social-btn">
                        <i class="fab fa-google"></i>
                    </a>
                    <a href="#" class="social-btn">
                        <i class="fab fa-microsoft"></i>
                    </a>
                    <a href="#" class="social-btn">
                        <i class="fab fa-apple"></i>
                    </a>
                </div>

                <p class="register-link">
                    Don't have an account? <a href="students'signup.html">Sign up</a> <!-- Corrected link to students'signup.html -->
                </p>
            </form>
        </div>
    </div>

    <!-- Custom Message Box HTML -->
    <div id="messageBoxOverlay" class="message-box-overlay">
        <div class="message-box">
            <h3 id="messageBoxTitle"></h3>
            <p id="messageBoxContent"></p>
            <button id="messageBoxCloseBtn">OK</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Define your backend URL here! This is the URL Replit gives you.
            const BACKEND_URL = window.location.origin; 

            // Cached DOM elements
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const emailInput = document.getElementById('email');
            const loginForm = document.getElementById('loginForm');
            const loginSubmitBtn = document.getElementById('loginSubmitBtn'); // Get the login button

            // Message Box elements
            const messageBoxOverlay = document.getElementById('messageBoxOverlay');
            const messageBoxTitle = document.getElementById('messageBoxTitle');
            const messageBoxContent = document.getElementById('messageBoxContent');
            const messageBoxCloseBtn = document.getElementById('messageBoxCloseBtn');

            // Function to display custom message box
            function showMessageBox(title, message, isSuccess = false) {
                messageBoxTitle.textContent = title;
                messageBoxContent.textContent = message;
                // Set title color based on success/error
                if (isSuccess) {
                    messageBoxTitle.classList.add('success-title');
                    messageBoxTitle.style.color = 'var(--color-brand-primary)'; // Explicitly set success color
                } else {
                    messageBoxTitle.classList.remove('success-title');
                    messageBoxTitle.style.color = 'var(--color-error-red)'; // Explicitly set error color
                }
                messageBoxOverlay.classList.add('show');
            }

            // Close message box
            messageBoxCloseBtn.addEventListener('click', function() {
                messageBoxOverlay.classList.remove('show');
            });

            // Password toggle functionality
            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    this.classList.toggle('fa-eye-slash');
                    this.classList.toggle('fa-eye'); // Ensure both classes are toggled correctly
                });
            }

            // Simple form validation for button state
            function validateForm() {
                const isEmailFilled = emailInput.value.trim() !== '';
                const isPasswordFilled = passwordInput.value.trim() !== '';
                loginSubmitBtn.disabled = !(isEmailFilled && isPasswordFilled);
            }

            // Add event listeners for input changes to enable/disable button
            emailInput.addEventListener('input', validateForm);
            passwordInput.addEventListener('input', validateForm);

            // Form submission handler
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault(); // Prevent default form submission

                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();
                const rememberMe = document.getElementById('rememberMe').checked; // Still capture this, but not implementing yet

                // Basic frontend validation
                if (!email || !password) {
                    showMessageBox('Input Error', 'Please enter both email and password.');
                    return;
                }

                // Disable button and show loading state
                loginSubmitBtn.textContent = 'Logging In...';
                loginSubmitBtn.disabled = true;

                try {
                    const response = await fetch(`${BACKEND_URL}/login-student`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    if (response.ok) { // Status code 200-299
                        showMessageBox('Success', data.message, true); // Pass true for success message
                        console.log('Login successful:', data);
                        
                        // Redirect to student dashboard after a short delay
                        setTimeout(() => {
                            // Pass student name to dashboard for display
                            window.location.href = `studentdashboard.html?name=${encodeURIComponent(data.student.studentName)}`;
                        }, 1500); // 1.5 second delay
                    } else { // Status code outside 200-299 (e.g., 401, 400, 500)
                        showMessageBox('Login Failed', data.message || 'An unexpected error occurred. Please try again.');
                        console.error('Login failed:', data);
                    }
                } catch (error) {
                    console.error('Network error during login:', error);
                    showMessageBox('Network Error', 'Could not connect to the server. Please check your internet connection and try again.');
                } finally {
                    // Re-enable button and reset text after API call
                    loginSubmitBtn.textContent = 'Log In';
                    validateForm(); // Re-run validation to set correct disabled state
                }
            });

            // Initial validation when page loads
            validateForm();
        });
    </script>
</body>
</html>
