<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolByte - Student Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2530, #2c3e50);
            min-height: 100vh;
            color: #ecf0f1;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .dashboard-header {
            background: rgba(30, 40, 56, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            padding: 30px;
            border: 1px solid rgba(127, 140, 163, 0.3);
            margin-bottom: 30px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #3498db;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .bytes-display {
            background: linear-gradient(to right, #3498db, #2980b9);
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 16px;
        }

        .logout-btn {
            padding: 10px 20px;
            background: linear-gradient(to right, #e74c3c, #c0392b);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3);
        }

        .welcome-section {
            text-align: center;
            padding: 20px;
            background: rgba(25, 35, 50, 0.6);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .welcome-message {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .student-details {
            font-size: 16px;
            color: #bdc3c7;
        }

        .progress-section {
            background: rgba(25, 35, 50, 0.6);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .progress-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #3498db;
        }

        .progress-bar {
            background: rgba(127, 140, 163, 0.2);
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            background: linear-gradient(to right, #2ecc71, #27ae60);
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 14px;
            color: #bdc3c7;
        }

        .subjects-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            color: #3498db;
            margin-bottom: 20px;
            text-align: center;
        }

        .subjects-group {
            margin-bottom: 30px;
        }

        .group-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(127, 140, 163, 0.3);
        }

        .group-title.compulsory {
            color: #2ecc71;
        }

        .group-title.elective {
            color: #f39c12;
        }

        .group-title.principal {
            color: #9b59b6;
        }

        .group-title.subsidiary {
            color: #e67e22;
        }

        .subject-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .subject-card {
            background: rgba(30, 40, 56, 0.9);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid rgba(127, 140, 163, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .subject-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(to right, #3498db, #2980b9);
        }

        .subject-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border-color: #3498db;
        }

        .subject-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #3498db;
        }

        .subject-stats {
            margin-bottom: 20px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .stat-label {
            color: #bdc3c7;
        }

        .stat-value {
            color: #ecf0f1;
            font-weight: 600;
        }

        .subject-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(to right, #3498db, #2980b9);
            color: white;
        }

        .btn-secondary {
            background: rgba(127, 140, 163, 0.2);
            color: #ecf0f1;
            border: 1px solid rgba(127, 140, 163, 0.3);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .quick-actions {
            background: rgba(30, 40, 56, 0.9);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid rgba(127, 140, 163, 0.3);
        }

        .quick-actions-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #3498db;
        }

        .quick-action-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .quick-action-card {
            background: rgba(25, 35, 50, 0.6);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(127, 140, 163, 0.2);
        }

        .quick-action-card:hover {
            background: rgba(25, 35, 50, 0.8);
            border-color: #3498db;
        }

        .quick-action-icon {
            font-size: 24px;
            margin-bottom: 10px;
            color: #3498db;
        }

        .quick-action-text {
            font-size: 16px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .dashboard-container {
                padding: 10px;
            }

            .header-top {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .subject-cards {
                grid-template-columns: 1fr;
            }

            .quick-action-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Dashboard Header -->
        <div class="dashboard-header">
            <div class="header-top">
                <div class="logo-section">
                    <div class="logo">
                        <i class="fas fa-graduation-cap"></i> SchoolByte
                    </div>
                </div>
                <div class="user-info">
                    <div class="bytes-display" id="bytesDisplay">
                        <i class="fas fa-coins"></i> 0 Bytes
                    </div>
                    <button class="logout-btn" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>

            <div class="welcome-section">
                <div class="welcome-message" id="welcomeMessage">Welcome back!</div>
                <div class="student-details" id="studentDetails"></div>
            </div>

            <div class="progress-section">
                <div class="progress-title">Quiz Session Progress ("Fats and Beef" Cycle)</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                <div class="progress-text" id="progressText">0 / 180 questions completed this cycle</div>
            </div>
        </div>

        <!-- Subjects Section -->
        <div class="subjects-section">
            <div class="section-title">Your Enrolled Subjects</div>
            <div id="subjectsContainer"></div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <div class="quick-actions-title">Quick Actions</div>
            <div class="quick-action-grid">
                <div class="quick-action-card" onclick="window.location.href='quizzesstudentdashboard.html'">
                    <div class="quick-action-icon">
                        <i class="fas fa-brain"></i>
                    </div>
                    <div class="quick-action-text">Take Quiz</div>
                </div>
                <div class="quick-action-card" onclick="window.location.href='preadergamesstudentdashboard.html'">
                    <div class="quick-action-icon">
                        <i class="fas fa-gamepad"></i>
                    </div>
                    <div class="quick-action-text">Preader Games</div>
                </div>
                <div class="quick-action-card" onclick="window.location.href='studentprofile.html'">
                    <div class="quick-action-icon">
                        <i class="fas fa-user-cog"></i>
                    </div>
                    <div class="quick-action-text">Profile Settings</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let studentData = null;

        // Subject configuration - matches backend
        const subjectConfig = {
            compulsoryOLevel: [
                "Mathematics", "English Language", "Biology", "Chemistry", 
                "Physics", "History", "Geography"
            ],
            aLevelSubsidiaries: [
                "General Paper", "Computer Science", "Subsidiary Mathematics"
            ]
        };

        document.addEventListener('DOMContentLoaded', async function() {
            const token = localStorage.getItem('studentToken');

            if (!token) {
                window.location.href = 'studentlogin.html';
                return;
            }

            try {
                await loadDashboardData();
                renderDashboard();
            } catch (error) {
                console.error('Error loading dashboard:', error);
                if (error.message.includes('401') || error.message.includes('403')) {
                    localStorage.removeItem('studentToken');
                    window.location.href = 'studentlogin.html';
                }
            }
        });

        async function loadDashboardData() {
            const token = localStorage.getItem('studentToken');

            const response = await fetch('/student/dashboard', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const data = await response.json();
            studentData = data.student;
        }

        function renderDashboard() {
            if (!studentData) return;

            // Update header information
            document.getElementById('bytesDisplay').innerHTML = 
                `<i class="fas fa-coins"></i> ${studentData.bytes || 0} Bytes`;

            document.getElementById('welcomeMessage').textContent = 
                `Welcome back, ${studentData.firstNameDisplay || studentData.studentName.split(' ')[0]}!`;

            document.getElementById('studentDetails').textContent = 
                `${studentData.class} ${studentData.stream} • Index: ${studentData.indexNumber}`;

            // Update progress bar
            updateProgressBar();

            // Render subject cards
            renderSubjectCards();
        }

        function updateProgressBar() {
            const quizSession = studentData.quizSession;
            const completed = quizSession ? quizSession.questionsCompletedCount : 0;
            const total = 180;
            const percentage = (completed / total) * 100;

            document.getElementById('progressFill').style.width = `${percentage}%`;
            document.getElementById('progressText').textContent = 
                `${completed} / ${total} questions completed this cycle`;
        }

        function renderSubjectCards() {
            const container = document.getElementById('subjectsContainer');
            container.innerHTML = '';

            if (!studentData.subjectsEnrolled || studentData.subjectsEnrolled.length === 0) {
                container.innerHTML = '<p>No subjects enrolled.</p>';
                return;
            }

            const studentClass = studentData.class;
            const subjects = studentData.subjectsEnrolled;

            // Group subjects by type
            const groupedSubjects = groupSubjectsByType(subjects, studentClass);

            // Render each group
            Object.entries(groupedSubjects).forEach(([groupName, groupSubjects]) => {
                if (groupSubjects.length > 0) {
                    const groupDiv = createSubjectGroup(groupName, groupSubjects);
                    container.appendChild(groupDiv);
                }
            });
        }

        function groupSubjectsByType(subjects, studentClass) {
            const groups = {
                compulsory: [],
                elective: [],
                principal: [],
                subsidiary: []
            };

            subjects.forEach(subject => {
                if (['S.1', 'S.2', 'S.3', 'S.4'].includes(studentClass)) {
                    // O-Level grouping
                    if (subjectConfig.compulsoryOLevel.includes(subject)) {
                        groups.compulsory.push(subject);
                    } else {
                        groups.elective.push(subject);
                    }
                } else if (['S.5', 'S.6'].includes(studentClass)) {
                    // A-Level grouping
                    if (subjectConfig.aLevelSubsidiaries.includes(subject)) {
                        groups.subsidiary.push(subject);
                    } else {
                        groups.principal.push(subject);
                    }
                }
            });

            return groups;
        }

        function createSubjectGroup(groupName, subjects) {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'subjects-group';

            const groupTitle = document.createElement('div');
            groupTitle.className = `group-title ${groupName}`;

            const titleText = {
                compulsory: 'Core Curriculum (Compulsory)',
                elective: 'Your Electives',
                principal: 'Principal Subjects',
                subsidiary: 'Subsidiary Subjects'
            };

            groupTitle.textContent = titleText[groupName] || groupName;
            groupDiv.appendChild(groupTitle);

            const cardsContainer = document.createElement('div');
            cardsContainer.className = 'subject-cards';

            subjects.forEach(subject => {
                const card = createSubjectCard(subject);
                cardsContainer.appendChild(card);
            });

            groupDiv.appendChild(cardsContainer);
            return groupDiv;
        }

        function createSubjectCard(subjectName) {
            const card = document.createElement('div');
            card.className = 'subject-card';

            // Generate placeholder stats (in real implementation, these would come from backend)
            const stats = generatePlaceholderStats(subjectName);

            card.innerHTML = `
                <div class="subject-name">${subjectName}</div>
                <div class="subject-stats">
                    <div class="stat-item">
                        <span class="stat-label">Quizzes Completed:</span>
                        <span class="stat-value">${stats.quizzes}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Activities Completed:</span>
                        <span class="stat-value">${stats.activities}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Bytes Earned:</span>
                        <span class="stat-value">${stats.bytes}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Average Score:</span>
                        <span class="stat-value">${stats.average}%</span>
                    </div>
                </div>
                <div class="subject-actions">
                    <button class="action-btn btn-primary" onclick="startQuiz('${subjectName}')">
                        <i class="fas fa-brain"></i> Quiz
                    </button>
                    <button class="action-btn btn-secondary" onclick="viewNotes('${subjectName}')">
                        <i class="fas fa-book"></i> Notes
                    </button>
                </div>
            `;

            return card;
        }

        function generatePlaceholderStats(subjectName) {
            // Generate consistent pseudo-random stats based on subject name
            const hash = subjectName.split('').reduce((a, b) => a + b.charCodeAt(0), 0);

            return {
                quizzes: Math.floor((hash % 50) + 10),
                activities: Math.floor((hash % 15) + 2),
                bytes: Math.floor((hash % 300) + 50),
                average: Math.floor((hash % 30) + 70)
            };
        }

        function startQuiz(subjectName) {
            // Store selected subject for quiz generation
            localStorage.setItem('selectedQuizSubject', subjectName);
            window.location.href = 'quizzesstudentdashboard.html';
        }

        function viewNotes(subjectName) {
            // Navigate to subject-specific notes (you can implement specific routing)
            const subjectMap = {
                'Mathematics': 'notesmathstudentdashboard.html',
                'English Language': 'notesengstudentdashboard.html',
                'Biology': 'notesbiostudentdashboard.html',
                'Chemistry': 'noteschestudentdashboard.html',
                'Physics': 'notesphystudentdashboard.html',
                'History': 'noteshisstudentdashboard.html',
                'Geography': 'notesgeostudentdashboard.html',
                'Computer Science': 'notestdstudentdashboard.html',
                'Agriculture': 'notesagristudentdashboard.html',
                'Literature in English': 'noteslitstudentdashboard.html',
                'French': 'notesengstudentdashboard.html', // Placeholder
                'German': 'notesgerstudentdashboard.html',
                'Kiswahili': 'noteskiswastudentdashboard.html',
                'Luganda': 'noteslugstudentdashboard.html',
                'Fine Art': 'notespastudentdashboard.html',
                'Performing Arts': 'notespastudentdashboard.html',
                'Physical Education': 'notespestudentdashboard.html',
                'Technology and Design': 'notestdstudentdashboard.html',
                'Economics': 'notesengstudentdashboard.html', // Placeholder
                'General Paper': 'notesengstudentdashboard.html',
                'Subsidiary Mathematics': 'notesmathstudentdashboard.html'
            };

            const notesPage = subjectMap[subjectName] || 'notesengstudentdashboard.html';
            window.location.href = notesPage;
        }

        function logout() {
            localStorage.removeItem('studentToken');
            window.location.href = 'studentlogin.html';
        }
    </script>
</body>
</html>
