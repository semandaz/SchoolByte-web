
                            <i class="fas fa-running"></i>
                        </div>
                        <div class="subject-name">Physical Education</div>
                    </div>

                    <div class="subject-card" onclick="window.location.href='phystudentdashboard.html'">
                        <div class="subject-icon">
                            <i class="fas fa-atom"></i>
                        </div>
                        <div class="subject-name">Physics</div>
                    </div>

                    <div class="subject-card" onclick="window.location.href='tdstudentdashboard.html'">
                        <div class="subject-icon">
                            <i class="fas fa-laptop-code"></i>
                        </div>
                        <div class="subject-name">Technology and Design</div>
                    </div>
                </div>
            </div>

            <div class="sign-out-section">
                <button class="sign-out-btn" id="signOutBtn">
                    <i class="fas fa-sign-out-alt"></i> Sign Out
                </button>
            </div>
        </div>
    </div>

    <div class="bytes-counter" id="bytesCounter">
        <i class="fas fa-coins bytes-icon"></i>
        <span id="bytesCount">0</span> Bytes
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize student data
            const studentName = localStorage.getItem('studentName') || 'Student';
            document.getElementById('studentNameDisplay').textContent = studentName;
            document.getElementById('welcomeMessage').textContent = `Hello ${studentName}, what do you want to dive into today?`;
            
            // Initialize bytes count
            let bytesCount = parseInt(localStorage.getItem('bytesCount')) || 0;
            document.getElementById('bytesCount').textContent = bytesCount;
            
            // Create floating particles
            createParticles();
            
            // Set up activity feed
            setupActivityFeed();
            
            // Set up event listeners for earning bytes
            setupByteEarning();
            
            // Set up sign out button
            document.getElementById('signOutBtn').addEventListener('click', function() {
                localStorage.removeItem('studentName');
                localStorage.removeItem('bytesCount');
                window.location.href = 'index.html';
            });
            
            // Tooltip initialization
            document.querySelectorAll('.info-icon').forEach(icon => {
                icon.addEventListener('mouseenter', function() {
                    this.querySelector('.info-tooltip').style.opacity = '1';
                    this.querySelector('.info-tooltip').style.visibility = 'visible';
                });
                
                icon.addEventListener('mouseleave', function() {
                    this.querySelector('.info-tooltip').style.opacity = '0';
                    this.querySelector('.info-tooltip').style.visibility = 'hidden';
                });
            });
        });
        
        // Create floating golden orbs
        function createParticles() {
            const container = document.getElementById('particlesContainer');
            const particleCount = 30;
            
            // Check for reduced motion preference
            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reducedMotion) return;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random position and size
                const size = Math.random() * 10 + 5;
                const posX = Math.random() * 100;
                const delay = Math.random() * 10;
                const duration = Math.random() * 10 + 10;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${posX}%`;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;
                
                container.appendChild(particle);
            }
        }
        
        // Set up activity feed
        function setupActivityFeed() {
            const bytesCounter = document.getElementById('bytesCounter');
            const activityFeed = document.getElementById('activityFeed');
            
            bytesCounter.addEventListener('click', function() {
                activityFeed.classList.toggle('active');
            });
            
            // Close feed when clicking outside
            document.addEventListener('click', function(e) {
                if (!bytesCounter.contains(e.target) {
                    activityFeed.classList.remove('active');
                }
            });
        }
        
        // Set up byte earning system
        function setupByteEarning() {
            const quizBtn = document.getElementById('quizBtn');
            const gameBtn = document.getElementById('gameBtn');
            const bytesCountElement = document.getElementById('bytesCount');
            const activityFeed = document.getElementById('activityFeed');
            
            // Function to add activity to feed
            function addActivity(message) {
                const now = new Date();
                const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                const activityItem = document.createElement('div');
                activityItem.classList.add('activity-item');
                activityItem.innerHTML = `
                    <i class="fas fa-coins activity-icon"></i>
                    <span>${message} - ${timeString}</span>
                `;
                
                activityFeed.insertBefore(activityItem, activityFeed.firstChild);
                
                // Show feed temporarily
                activityFeed.classList.add('active');
                setTimeout(() => {
                    activityFeed.classList.remove('active');
                }, 3000);
            }
            
            // Function to animate byte earning
            function animateByteEarning(amount, sourceElement) {
                const bytesCounter = document.getElementById('bytesCounter');
                const counterRect = bytesCounter.getBoundingClientRect();
                const counterX = counterRect.left + counterRect.width / 2;
                const counterY = counterRect.top + counterRect.height / 2;
                
                // Check for reduced motion preference
                const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (reducedMotion) {
                    // Just update the count without animation
                    updateByteCount(amount);
                    return;
                }
                
                // Create coins that fly to counter
                for (let i = 0; i < amount; i++) {
                    setTimeout(() => {
                        const sourceRect = sourceElement.getBoundingClientRect();
                        const startX = sourceRect.left + Math.random() * sourceRect.width;
                        const startY = sourceRect.top + Math.random() * sourceRect.height;
                        
                        const coin = document.createElement('div');
                        coin.classList.add('byte-coin');
                        
                        // Calculate final position relative to start
                        const tx = counterX - startX;
                        const ty = counterY - startY;
                        
                        coin.style.setProperty('--tx', `${tx}px`);
                        coin.style.setProperty('--ty', `${ty}px`);
                        coin.style.left = `${startX}px`;
                        coin.style.top = `${startY}px`;
                        
                        document.body.appendChild(coin);
                        
                        // Remove coin after animation
                        setTimeout(() => {
                            coin.remove();
                            if (i === amount - 1) {
                                updateByteCount(amount);
                            }
                        }, 1000);
                    }, i * 100);
                }
            }
            
            // Function to update byte count
            function updateByteCount(amount) {
                let currentBytes = parseInt(bytesCountElement.textContent) || 0;
                currentBytes += amount;
                bytesCountElement.textContent = currentBytes;
                localStorage.setItem('bytesCount', currentBytes);
            }
            
            // Quiz button click handler
            quizBtn.addEventListener('click', function(e) {
                e.preventDefault();
                const bytesEarned = 3;
                animateByteEarning(bytesEarned, this);
                addActivity(`Earned ${bytesEarned} bytes for starting a quiz`);
            });
            
            // Game button click handler
            gameBtn.addEventListener('click', function(e) {
                e.preventDefault();
                const bytesEarned = 5;
                animateByteEarning(bytesEarned, this);
                addActivity(`Earned ${bytesEarned} bytes for playing a game`);
            });
            
            // Simulate some initial activities
            setTimeout(() => {
                addActivity("Welcome to SchoolByte! Start learning to earn bytes");
            }, 1000);
        }
    </script>
</body>
</html>
