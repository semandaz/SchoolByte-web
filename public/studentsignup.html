<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolByte - Student Sign Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Global CSS Variables for Unified Color Palette */
        :root {
            /* Brand Colors */
            --color-brand-primary: #1a2a6c;    /* Dark Blue - Main brand color */
            --color-brand-secondary: #b21f1f; /* Deep Red/Maroon - Secondary brand color, accents */
            --color-brand-gold: #FFD700;       /* Gold - Accent for special elements, highlights */
            --color-brand-orange: #FFA500;    /* Orange - Used in gradients with gold */

            /* Neutral Palette */
            --color-neutral-white: #ffffff;
            --color-neutral-lightest: #f0f4f8; /* Very light gray/blue, good for subtle backgrounds */
            --color-neutral-light: #d1d5db;    /* Light gray for disabled elements, input borders */
            --color-neutral-medium: #9ca3af;    /* Medium gray for placeholders, disabled radio accents */
            --color-neutral-dark: #4b5563;     /* Dark gray for most body text, labels */
            --color-neutral-darkest: #333333;  /* Very dark gray for prominent text */

            /* Semantic Colors */
            --color-error-red: #e74c3c;        /* Standard error color */
            --color-error-red-dark: #c0392b;    /* Darker error red for hover states */
            --color-success-green: #2ecc71;    /* Success color */
            --color-info-blue: #3498db;        /* Info color */

            /* Background Gradients */
            --gradient-background-primary: linear-gradient(135deg, var(--color-brand-primary), var(--color-brand-secondary));
            --gradient-background-secondary: linear-gradient(135deg, var(--color-brand-primary), var(--color-brand-secondary), var(--color-brand-primary));

            /* Text Gradients */
            --gradient-text-gold: linear-gradient(to right, var(--color-brand-gold), var(--color-neutral-white));

            /* Button Gradients */
            --gradient-button-active: linear-gradient(to right, var(--color-brand-gold), var(--color-brand-orange));
            --gradient-button-active-hover: linear-gradient(to right, #FFC800, #FF8C00);

            /* Transparent Overlays */
            --overlay-light: rgba(255, 255, 255, 0.1);
            --overlay-medium: rgba(0, 0, 0, 0.2);
            --overlay-dark: rgba(30, 30, 60, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--gradient-background-secondary);
            min-height: 100vh;
            color: var(--color-neutral-white);
            overflow-x: hidden;
        }

        /* Floating Books Animation */
        .floating-books {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .book {
            position: absolute;
            font-size: 2rem;
            color: var(--color-brand-gold);
            opacity: 0.7;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Main Content */
        .main-content {
            position: relative;
            z-index: 10;
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
        }

        /* Logo */
        .logo {
            font-size: 4rem;
            font-weight: 900;
            background: var(--gradient-text-gold);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
            margin-bottom: 1rem;
            display: inline-block;
        }

        /* Avatar */
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--gradient-background-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-neutral-white);
            font-size: 3rem;
            margin: 0 auto 1.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.05) rotate(5deg);
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--color-neutral-white);
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--overlay-light);
            border-radius: 10px;
            font-size: 1rem;
            background-color: var(--overlay-light);
            color: var(--color-neutral-white);
            transition: all 0.3s;
        }

        select option {
            background-color: var(--color-brand-primary);
            color: var(--color-neutral-white);
        }

        input:focus,
        select:focus {
            border-color: var(--color-brand-gold);
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.2);
            outline: none;
        }

        input::placeholder {
            color: var(--color-neutral-light);
        }

        /* Continue Button */
        .continue-btn {
            display: inline-block;
            background: var(--gradient-button-active);
            color: var(--color-neutral-darkest);
            padding: 1rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 1rem;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .continue-btn:hover {
            background: var(--gradient-button-active-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .continue-btn:disabled {
            background: var(--color-neutral-medium);
            color: var(--color-neutral-dark);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Error/Success Message */
        .message-display {
            color: var(--color-brand-gold); /* Default for errors/info */
            text-align: center;
            margin-top: 1rem;
            min-height: 1.5rem;
            font-weight: 500;
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.3);
        }
        .message-display.success {
            color: var(--color-success-green);
        }
        .message-display.error {
            color: var(--color-error-red);
        }


        /* Moving Gradient Background */
        .moving-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--color-brand-primary), var(--color-brand-secondary), var(--color-brand-primary));
            background-size: 400% 400%;
            animation: gradient-shift 15s ease infinite;
            z-index: -1;
        }

        @keyframes gradient-shift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Password toggle */
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 40px;
            cursor: pointer;
            color: var(--color-neutral-light);
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: var(--color-brand-gold);
        }

        /* Terms checkbox */
        .terms {
            display: flex;
            align-items: center;
            margin: 25px 0;
            gap: 12px;
        }

        .terms-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--color-neutral-light);
            border-radius: 5px;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }

        .terms-checkbox:checked {
            background-color: var(--color-brand-gold);
            border-color: var(--color-brand-gold);
        }

        .terms-label {
            color: var(--color-neutral-white);
        }

        .terms-label a {
            color: var(--color-brand-gold);
            text-decoration: underline;
        }

        /* Buttons container */
        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .btn {
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-back {
            background: var(--color-brand-secondary);
            color: var(--color-neutral-white);
            flex: 1;
        }

        .btn-back:hover {
            background: var(--color-error-red-dark);
            transform: translateY(-2px);
        }

        .btn-next {
            background: var(--color-neutral-medium);
            color: var(--color-neutral-dark);
            flex: 2;
            cursor: not-allowed;
        }

        .btn-next.active {
            background: var(--gradient-button-active);
            color: var(--color-neutral-darkest);
            cursor: pointer;
        }

        .btn-next.active:hover {
            background: var(--gradient-button-active-hover);
            transform: translateY(-2px);
        }

        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
            
            .book, .moving-gradient {
                display: none !important;
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-content {
                padding: 2rem 1rem;
            }
            
            .logo {
                font-size: 3rem;
            }
            
            .avatar {
                width: 80px;
                height: 80px;
                font-size: 2.5rem;
            }
            
            .buttons {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedFont = localStorage.getItem('preferredFont');
            if (savedFont) {
                document.body.style.fontFamily = savedFont;
            } else {
                document.body.style.fontFamily = 'Inter, sans-serif';
            }
        });
    </script>
</head>
<body>
    <!-- Moving Gradient Background -->
    <div class="moving-gradient"></div>
    
    <!-- Floating Books -->
    <div class="floating-books" id="floatingBooks"></div>
    
    <!-- Main Content -->
    <div class="main-content">
        <h1 class="logo">SchoolByte</h1>
        
        <div class="avatar">
            <i class="fas fa-user-graduate"></i>
        </div>
        
        <h2 class="text-2xl font-semibold mb-6">Student Sign Up</h2>
        
        <form id="studentSignupForm">
            <div class="form-group">
                <label for="studentName">Student's Full Name</label>
                <input type="text" id="studentName" placeholder="e.g., Naluwagga Joy" required>
            </div>
            
            <div class="form-group">
                <label for="classTeacher">Class Teacher's Name</label>
                <input type="text" id="classTeacher" placeholder="e.g., Mr. Katongole" required>
            </div>
            
            <div class="form-group">
                <label for="indexNumber">Index Number</label>
                <input type="text" id="indexNumber" placeholder="e.g., 23MMS22" pattern="[A-Za-z0-9]+" required>
                <small class="error-message" id="indexNumberError" style="display: block; text-align: left; margin-top: 5px;">Must be alphanumeric</small>
            </div>
            
            <div class="form-group">
                <label for="class">Class</label>
                <select id="class" required>
                    <option value="" disabled selected>Select your class</option>
                    <option value="S1">S1</option>
                    <option value="S2">S2</option>
                    <option value="S3">S3</option>
                    <option value="S4">S4</option>
                    <option value="S5">S5</option>
                    <option value="S6">S6</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="stream">Stream</label>
                <select id="stream" required>
                    <option value="" disabled selected>Select your stream</option>
                    <option value="Annointed">Annointed</option>
                    <option value="Blue">Blue</option>
                    <option value="Central">Central</option>
                    <option value="Diamond">Diamond</option>
                    <option value="East">East</option>
                    <option value="Gold">Gold</option>
                    <option value="Maroon">Maroon</option>
                    <option value="North">North</option>
                    <option value="Purple">Purple</option>
                    <option value="Red">Red</option>
                    <option value="South">South</option>
                    <option value="Violet">Violet</option>
                    <option value="West">West</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="schoolbyte@gmail.com" required>
                <button type="button" id="sendCodeBtn" class="continue-btn" style="margin-top: 10px;" disabled>Send Code</button>
                <div id="resendCode" class="error-message" style="text-align: right; display: none;">Didn't receive code? Send again</div>
            </div>
            
            <div class="form-group">
                <label for="verificationCode">Verification Code</label>
                <input type="text" id="verificationCode" placeholder="••••••" maxlength="6" required>
            </div>

            <!-- Password Section (initially hidden) -->
            <div id="passwordSection" style="display: none;">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Min 8 chars, incl. uppercase, lowercase, number, special" required>
                    <i class="fas fa-eye password-toggle" id="togglePassword"></i>
                    <small class="error-message" id="passwordError" style="display: block; text-align: left; margin-top: 5px;">Password must be at least 8 characters with uppercase, lowercase, number, and special character.</small>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>
                    <i class="fas fa-eye password-toggle" id="toggleConfirmPassword"></i>
                    <small class="error-message" id="confirmPasswordError" style="display: block; text-align: left; margin-top: 5px;">Passwords do not match.</small>
                </div>
            </div>
            
            <div class="terms">
                <input type="checkbox" id="agreeTerms" class="terms-checkbox" required>
                <label for="agreeTerms" class="terms-label">
                    I agree to the <a href="term.html" target="_blank">Terms and Conditions</a>
                </label>
            </div>
            
            <div class="buttons">
                <button type="button" class="btn btn-back" onclick="location.href='index.html'">
                    <i class="fas fa-arrow-left"></i> Back
                </button>
                <button type="button" id="submitButton" class="btn btn-next" disabled>
                    Continue <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </form>
        <!-- Message Display Area -->
        <div id="messageDisplay" class="message-display" style="display: none;"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // API Base URL - Using current repl URL
            const API_BASE_URL = window.location.origin;

            // Create floating books
            createFloatingBooks();
            
            // DOM Elements
            const sendCodeBtn = document.getElementById('sendCodeBtn');
            const resendCode = document.getElementById('resendCode');
            const emailInput = document.getElementById('email');
            const verificationCodeInput = document.getElementById('verificationCode');
            const studentNameInput = document.getElementById('studentName');
            const classTeacherInput = document.getElementById('classTeacher');
            const indexNumberInput = document.getElementById('indexNumber');
            const classSelect = document.getElementById('class');
            const streamSelect = document.getElementById('stream');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const passwordSection = document.getElementById('passwordSection');
            const togglePassword = document.getElementById('togglePassword');
            const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
            const agreeTermsCheckbox = document.getElementById('agreeTerms');
            const submitButton = document.getElementById('submitButton');
            const messageDisplay = document.getElementById('messageDisplay');
            const indexNumberError = document.getElementById('indexNumberError');
            const passwordError = document.getElementById('passwordError');
            const confirmPasswordError = document.getElementById('confirmPasswordError');
            
            let emailVerified = false;
            let countdownInterval;

            // Function to display messages
            function showMessage(message, type = 'info') {
                messageDisplay.textContent = message;
                messageDisplay.className = `message-display ${type}`; // Add type class for styling
                messageDisplay.style.display = 'block';
            }

            function hideMessage() {
                messageDisplay.style.display = 'none';
                messageDisplay.textContent = '';
            }

            // Create floating books animation
            function createFloatingBooks() {
                const container = document.getElementById('floatingBooks');
                const bookCount = 15;
                const bookIcons = ['book', 'book-open', 'bookmark', 'graduation-cap', 'scroll', 'file-alt'];
                
                // Check for reduced motion preference
                const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (reducedMotion) return;
                
                for (let i = 0; i < bookCount; i++) {
                    const book = document.createElement('i');
                    book.classList.add('book', 'fas', `fa-${bookIcons[Math.floor(Math.random() * bookIcons.length)]}`);
                    
                    // Random position and animation
                    const posX = Math.random() * 100;
                    const delay = Math.random() * 10;
                    const duration = Math.random() * 15 + 10;
                    const size = Math.random() * 1 + 1;
                    
                    book.style.left = `${posX}%`;
                    book.style.animationDuration = `${duration}s`;
                    book.style.animationDelay = `${delay}s`;
                    book.style.fontSize = `${size}rem`;
                    
                    container.appendChild(book);
                }
            }

            // Toggle password visibility
            function setupPasswordToggle(toggleElement, passwordField) {
                toggleElement.addEventListener('click', function() {
                    const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordField.setAttribute('type', type);
                    toggleElement.classList.toggle('fa-eye');
                    toggleElement.classList.toggle('fa-eye-slash');
                });
            }

            // Initialize password toggles
            setupPasswordToggle(togglePassword, passwordInput);
            setupPasswordToggle(toggleConfirmPassword, confirmPasswordInput);

            // Start countdown timer for resend
            function startCountdown() {
                let seconds = 60;
                sendCodeBtn.disabled = true;
                sendCodeBtn.textContent = `Resend (${seconds}s)`;
                
                clearInterval(countdownInterval);
                countdownInterval = setInterval(function() {
                    seconds--;
                    sendCodeBtn.textContent = `Resend (${seconds}s)`;
                    
                    if (seconds <= 0) {
                        clearInterval(countdownInterval);
                        sendCodeBtn.disabled = false;
                        sendCodeBtn.textContent = 'Send Code';
                        resendCode.style.display = 'block';
                    }
                }, 1000);
            }

            // Validate email format
            function isValidEmail(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }

            // Validate index number (alphanumeric)
            function isValidIndexNumber(indexNumber) {
                const isValid = /^[A-Za-z0-9]+$/.test(indexNumber);
                indexNumberError.style.display = isValid ? 'none' : 'block';
                return isValid;
            }

            // Validate password complexity
            function isValidPassword(password) {
                const isValid = password.length >= 8 && 
                               /[A-Z]/.test(password) && 
                               /[a-z]/.test(password) && 
                               /\d/.test(password) && 
                               /[!@#$%^&*()_+]/.test(password);
                passwordError.style.display = isValid ? 'none' : 'block';
                return isValid;
            }

            // Validate passwords match
            function doPasswordsMatch() {
                const match = passwordInput.value === confirmPasswordInput.value;
                confirmPasswordError.style.display = match ? 'none' : 'block';
                return match;
            }

            // Validate form and update button states
            function validateForm() {
                const isEmailValid = isValidEmail(emailInput.value);
                const isNameFilled = studentNameInput.value.trim() !== '';
                const isTeacherFilled = classTeacherInput.value.trim() !== '';
                const isIndexValid = isValidIndexNumber(indexNumberInput.value);
                const isClassSelected = classSelect.value !== '';
                const isStreamSelected = streamSelect.value !== '';
                const isCodeFilled = verificationCodeInput.value.length === 6;
                const isTermsChecked = agreeTermsCheckbox.checked;

                // Enable/disable send code button based on email validity and countdown status
                const isCountdownActive = countdownInterval !== undefined && countdownInterval !== null;
                sendCodeBtn.disabled = !isEmailValid || isCountdownActive;

                let canSubmit = false;

                if (!emailVerified) {
                    // Phase 1: Email verification - Continue button should be enabled when:
                    // 1. All basic fields are filled
                    // 2. Email is valid 
                    // 3. 6-digit code is entered
                    // 4. Terms are accepted
                    canSubmit = isNameFilled && isTeacherFilled && isIndexValid &&
                                isClassSelected && isStreamSelected &&
                                isEmailValid && isCodeFilled && isTermsChecked;
                } else {
                    // Phase 2: Registration (after email is verified)
                    const isPasswordValid = isValidPassword(passwordInput.value);
                    const passwordsMatch = doPasswordsMatch();
                    canSubmit = isNameFilled && isTeacherFilled && isIndexValid &&
                                isClassSelected && isStreamSelected &&
                                isEmailValid && isTermsChecked &&
                                isPasswordValid && passwordsMatch;
                }

                // Update submit button state
                submitButton.disabled = !canSubmit;
                if (canSubmit) {
                    submitButton.classList.add('active');
                } else {
                    submitButton.classList.remove('active');
                }
            }

            // Send verification code to backend
            sendCodeBtn.addEventListener('click', async function() {
                hideMessage(); // Clear previous messages
                if (!isValidEmail(emailInput.value)) {
                    showMessage('Please enter a valid email address.', 'error');
                    return;
                }
                
                sendCodeBtn.disabled = true;
                sendCodeBtn.textContent = 'Sending...';

                try {
                    const response = await fetch(`${API_BASE_URL}/send-verification-code`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ email: emailInput.value }),
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showMessage(data.message, 'success');
                        startCountdown();
                        resendCode.style.display = 'none';
                    } else {
                        showMessage(data.message || 'Failed to send verification code.', 'error');
                        sendCodeBtn.disabled = false;
                        sendCodeBtn.textContent = 'Send Code';
                    }
                } catch (error) {
                    console.error('Error sending verification code:', error);
                    showMessage('Network error. Could not send verification code.', 'error');
                    sendCodeBtn.disabled = false;
                    sendCodeBtn.textContent = 'Send Code';
                }
            });

            // Resend code (re-triggers sendCodeBtn click)
            resendCode.addEventListener('click', function() {
                sendCodeBtn.click();
            });

            // Form submission (Continue/Register Account)
            submitButton.addEventListener('click', async function() {
                hideMessage(); // Clear previous messages

                if (!emailVerified) {
                    // Phase 1: Verify email code
                    if (verificationCodeInput.value.length !== 6) {
                        showMessage('Please enter the 6-digit verification code.', 'error');
                        return;
                    }

                    submitButton.disabled = true;
                    submitButton.textContent = 'Verifying...';

                    try {
                        const response = await fetch(`${API_BASE_URL}/verify-code`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                email: emailInput.value,
                                code: verificationCodeInput.value
                            }),
                        });

                        const data = await response.json();

                        if (response.ok && data.verified) {
                            emailVerified = true;
                            passwordSection.style.display = 'block';
                            emailInput.readOnly = true;
                            verificationCodeInput.readOnly = true;
                            sendCodeBtn.disabled = true;
                            clearInterval(countdownInterval); // Stop countdown
                            countdownInterval = null; // Clear interval ID
                            resendCode.style.display = 'none';
                            submitButton.textContent = 'Register Account';
                            showMessage(data.message, 'success');
                            validateForm(); // Re-validate to enable/disable button based on password fields
                        } else {
                            showMessage(data.message || 'Verification failed.', 'error');
                            submitButton.disabled = false;
                            submitButton.textContent = 'Continue'; // Keep original text if verification fails
                        }
                    } catch (error) {
                        console.error('Error verifying code:', error);
                        showMessage('Network error. Could not verify code.', 'error');
                        submitButton.disabled = false;
                        submitButton.textContent = 'Continue';
                    }
                } else {
                    // Phase 2: Register student account
                    if (!isValidPassword(passwordInput.value)) {
                        showMessage('Password must be at least 8 characters with uppercase, lowercase, number, and special character.', 'error');
                        return;
                    }
                    
                    if (!doPasswordsMatch()) {
                        showMessage('Passwords do not match.', 'error');
                        return;
                    }

                    submitButton.disabled = true;
                    submitButton.textContent = 'Registering...';

                    const studentData = {
                        studentName: studentNameInput.value.trim(),
                        classTeacher: classTeacherInput.value.trim(),
                        indexNumber: indexNumberInput.value.trim(),
                        class: classSelect.value,
                        stream: streamSelect.value,
                        email: emailInput.value.trim(),
                        password: passwordInput.value,
                    };

                    try {
                        const response = await fetch(`${API_BASE_URL}/register-student`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify(studentData),
                        });

                        const data = await response.json();

                        if (response.ok) {
                            showMessage(data.message + ' Redirecting to login...', 'success');
                            setTimeout(() => {
                                window.location.href = 'studentlogin.html'; // Redirect to student login page
                            }, 2000);
                        } else {
                            // Handle backend validation errors or other server errors
                            let errorMessage = data.message || 'Registration failed.';
                            if (data.errors && Array.isArray(data.errors)) {
                                errorMessage = data.errors.map(err => err.msg).join('; ');
                            }
                            showMessage(errorMessage, 'error');
                            submitButton.disabled = false;
                            submitButton.textContent = 'Register Account';
                        }
                    } catch (error) {
                        console.error('Error during registration:', error);
                        showMessage('Network error. Could not register account.', 'error');
                        submitButton.disabled = false;
                        submitButton.textContent = 'Register Account';
                    }
                }
                validateForm();
            });

            // Form validation on input
            studentNameInput.addEventListener('input', validateForm);
            classTeacherInput.addEventListener('input', validateForm);
            indexNumberInput.addEventListener('input', validateForm);
            classSelect.addEventListener('change', validateForm);
            streamSelect.addEventListener('change', validateForm);
            emailInput.addEventListener('input', validateForm);
            verificationCodeInput.addEventListener('input', validateForm);
            passwordInput.addEventListener('input', validateForm);
            confirmPasswordInput.addEventListener('input', validateForm);
            agreeTermsCheckbox.addEventListener('change', validateForm);

            // Initial validation
            validateForm();
        });
    </script>
</body>
</html>
