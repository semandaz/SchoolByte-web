
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolByte - Student Registration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2530, #2c3e50);
            min-height: 100vh;
            color: #ecf0f1;
            padding: 20px;
        }

        .signup-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(30, 40, 56, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            padding: 40px;
            border: 1px solid rgba(127, 140, 163, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #3498db;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 16px;
            color: #bdc3c7;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #3498db;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(52, 152, 219, 0.3);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #ecf0f1;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            padding: 12px 16px;
            border: 2px solid rgba(127, 140, 163, 0.3);
            border-radius: 8px;
            background: rgba(25, 35, 50, 0.8);
            color: #ecf0f1;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        .class-selection {
            margin-bottom: 30px;
        }

        .subjects-section {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: rgba(25, 35, 50, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(127, 140, 163, 0.2);
        }

        .subjects-instruction {
            font-size: 16px;
            font-weight: 600;
            color: #3498db;
            margin-bottom: 15px;
        }

        .subject-counter {
            font-size: 14px;
            color: #f39c12;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .compulsory-subjects {
            margin-bottom: 25px;
        }

        .compulsory-title {
            font-size: 16px;
            font-weight: 600;
            color: #2ecc71;
            margin-bottom: 10px;
        }

        .subject-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
        }

        .subject-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: rgba(30, 40, 56, 0.6);
            border-radius: 6px;
            border: 1px solid rgba(127, 140, 163, 0.2);
        }

        .subject-item.compulsory {
            background: rgba(46, 204, 113, 0.1);
            border-color: rgba(46, 204, 113, 0.3);
        }

        .subject-item.locked {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .subject-checkbox {
            margin-right: 10px;
        }

        .subject-label {
            font-size: 14px;
            cursor: pointer;
            flex: 1;
        }

        .subject-label.locked {
            cursor: not-allowed;
        }

        .elective-subjects {
            margin-top: 20px;
        }

        .elective-title {
            font-size: 16px;
            font-weight: 600;
            color: #e67e22;
            margin-bottom: 10px;
        }

        .signup-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(to right, #3498db, #2980b9);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
            letter-spacing: 1px;
        }

        .signup-button:hover:not(:disabled) {
            background: linear-gradient(to right, #2980b9, #2573a7);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.4);
        }

        .signup-button:disabled {
            background: linear-gradient(to right, #7f8c8d, #95a5a6);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
        }

        .message.success {
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid rgba(46, 204, 113, 0.5);
            color: #2ecc71;
        }

        .message.error {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid rgba(231, 76, 60, 0.5);
            color: #e74c3c;
        }

        @media (max-width: 768px) {
            .signup-container {
                padding: 30px 20px;
            }
            
            .form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .subject-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="header">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i> SchoolByte
            </div>
            <div class="subtitle">Join the Future of Learning</div>
        </div>

        <div id="messageContainer"></div>

        <form id="signupForm">
            <!-- Basic Information -->
            <div class="form-section">
                <div class="section-title">Account Information</div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="studentName">Full Name *</label>
                        <input type="text" id="studentName" name="studentName" required>
                    </div>
                    <div class="form-group">
                        <label for="indexNumber">Index Number *</label>
                        <input type="text" id="indexNumber" name="indexNumber" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password *</label>
                        <input type="password" id="password" name="password" required minlength="6">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password *</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required>
                    </div>
                </div>
            </div>

            <!-- Academic Information -->
            <div class="form-section">
                <div class="section-title">Academic Information</div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="stream">Stream *</label>
                        <input type="text" id="stream" name="stream" required placeholder="e.g., A, B, C">
                    </div>
                    <div class="form-group">
                        <label for="classTeacher">Class Teacher *</label>
                        <input type="text" id="classTeacher" name="classTeacher" required placeholder="e.g., Mr. Okello">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group class-selection">
                        <label for="class">Select Your Current Class Level *</label>
                        <select id="class" name="class" required>
                            <option value="">-- Select Class --</option>
                            <option value="S.1">S.1 (Senior One)</option>
                            <option value="S.2">S.2 (Senior Two)</option>
                            <option value="S.3">S.3 (Senior Three)</option>
                            <option value="S.4">S.4 (Senior Four)</option>
                            <option value="S.5">S.5 (Senior Five)</option>
                            <option value="S.6">S.6 (Senior Six)</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Dynamic Subject Selection -->
            <div class="form-section">
                <div class="section-title">Subject Enrollment</div>
                <div id="subjectsSection" class="subjects-section">
                    <div id="subjectsInstruction" class="subjects-instruction"></div>
                    <div id="subjectCounter" class="subject-counter"></div>
                    
                    <div id="compulsorySubjects" class="compulsory-subjects">
                        <div class="compulsory-title">Compulsory Subjects</div>
                        <div id="compulsoryList" class="subject-list"></div>
                    </div>
                    
                    <div id="electiveSubjects" class="elective-subjects">
                        <div id="electiveTitle" class="elective-title">Additional Subjects</div>
                        <div id="electiveList" class="subject-list"></div>
                    </div>
                </div>
            </div>

            <button type="submit" id="signupButton" class="signup-button" disabled>
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>

        <div class="login-link">
            Already have an account? <a href="studentlogin.html">Login here</a>
        </div>
    </div>

    <script>
        // Subject data - this should match your backend Subject collection
        const allSubjects = [
            { name: "Mathematics", isCompulsory: true, isPrincipalAlevel: true },
            { name: "English Language", isCompulsory: true, isPrincipalAlevel: false },
            { name: "Biology", isCompulsory: true, isPrincipalAlevel: true },
            { name: "Chemistry", isCompulsory: true, isPrincipalAlevel: true },
            { name: "Physics", isCompulsory: true, isPrincipalAlevel: true },
            { name: "History", isCompulsory: true, isPrincipalAlevel: true },
            { name: "Geography", isCompulsory: true, isPrincipalAlevel: true },
            { name: "Computer Science", isCompulsory: false, isPrincipalAlevel: true },
            { name: "Agriculture", isCompulsory: false, isPrincipalAlevel: true },
            { name: "Literature in English", isCompulsory: false, isPrincipalAlevel: true },
            { name: "French", isCompulsory: false, isPrincipalAlevel: true },
            { name: "German", isCompulsory: false, isPrincipalAlevel: true },
            { name: "Kiswahili", isCompulsory: false, isPrincipalAlevel: true },
            { name: "Luganda", isCompulsory: false, isPrincipalAlevel: true },
            { name: "Fine Art", isCompulsory: false, isPrincipalAlevel: true },
            { name: "Performing Arts", isCompulsory: false, isPrincipalAlevel: true },
            { name: "Physical Education", isCompulsory: false, isPrincipalAlevel: true },
            { name: "Technology and Design", isCompulsory: false, isPrincipalAlevel: true },
            { name: "Economics", isCompulsory: false, isPrincipalAlevel: true },
            { name: "General Paper", isCompulsory: false, isPrincipalAlevel: false },
            { name: "Subsidiary Mathematics", isCompulsory: false, isPrincipalAlevel: false }
        ];

        let selectedSubjects = [];
        let currentClassLevel = '';

        const classSelect = document.getElementById('class');
        const subjectsSection = document.getElementById('subjectsSection');
        const subjectsInstruction = document.getElementById('subjectsInstruction');
        const subjectCounter = document.getElementById('subjectCounter');
        const compulsoryList = document.getElementById('compulsoryList');
        const electiveList = document.getElementById('electiveList');
        const signupButton = document.getElementById('signupButton');
        const signupForm = document.getElementById('signupForm');

        // Handle class selection change
        classSelect.addEventListener('change', function() {
            currentClassLevel = this.value;
            selectedSubjects = [];
            updateSubjectSection();
            validateForm();
        });

        function updateSubjectSection() {
            if (!currentClassLevel) {
                subjectsSection.style.display = 'none';
                return;
            }

            subjectsSection.style.display = 'block';
            
            if (['S.1', 'S.2'].includes(currentClassLevel)) {
                setupOLevelLower();
            } else if (['S.3', 'S.4'].includes(currentClassLevel)) {
                setupOLevelMiddle();
            } else if (['S.5', 'S.6'].includes(currentClassLevel)) {
                setupALevel();
            }
        }

        function setupOLevelLower() {
            subjectsInstruction.textContent = `For ${currentClassLevel}, you must select 5 additional subjects alongside the 7 compulsory subjects.`;
            
            const compulsorySubjects = allSubjects.filter(s => s.isCompulsory);
            const electiveSubjects = allSubjects.filter(s => !s.isCompulsory && s.name !== 'General Paper' && s.name !== 'Subsidiary Mathematics');
            
            // Add compulsory subjects automatically
            selectedSubjects = compulsorySubjects.map(s => s.name);
            
            renderCompulsorySubjects(compulsorySubjects);
            renderElectiveSubjects(electiveSubjects, 5);
            updateCounter(12, selectedSubjects.length);
        }

        function setupOLevelMiddle() {
            subjectsInstruction.textContent = `For ${currentClassLevel}, you must select 2 additional subjects alongside the 7 compulsory subjects.`;
            
            const compulsorySubjects = allSubjects.filter(s => s.isCompulsory);
            const electiveSubjects = allSubjects.filter(s => !s.isCompulsory && s.name !== 'General Paper' && s.name !== 'Subsidiary Mathematics');
            
            // Add compulsory subjects automatically
            selectedSubjects = compulsorySubjects.map(s => s.name);
            
            renderCompulsorySubjects(compulsorySubjects);
            renderElectiveSubjects(electiveSubjects, 2);
            updateCounter(9, selectedSubjects.length);
        }

        function setupALevel() {
            subjectsInstruction.textContent = `For ${currentClassLevel}, select exactly 3 principal subjects. General Paper is compulsory.`;
            
            const principalSubjects = allSubjects.filter(s => s.isPrincipalAlevel);
            
            // Add General Paper automatically
            selectedSubjects = ['General Paper'];
            
            renderALevelSubjects(principalSubjects);
            updateCounter(5, selectedSubjects.length);
        }

        function renderCompulsorySubjects(subjects) {
            compulsoryList.innerHTML = '';
            subjects.forEach(subject => {
                const subjectItem = createSubjectItem(subject.name, true, true);
                compulsoryList.appendChild(subjectItem);
            });
        }

        function renderElectiveSubjects(subjects, maxSelect) {
            document.getElementById('electiveTitle').textContent = `Select ${maxSelect} Additional Subjects`;
            electiveList.innerHTML = '';
            
            subjects.forEach(subject => {
                const subjectItem = createSubjectItem(subject.name, false, false);
                electiveList.appendChild(subjectItem);
            });
        }

        function renderALevelSubjects(subjects) {
            // Render General Paper as compulsory
            compulsoryList.innerHTML = '';
            const gpItem = createSubjectItem('General Paper', true, true);
            compulsoryList.appendChild(gpItem);
            
            // Render principal subjects
            document.getElementById('electiveTitle').textContent = 'Select 3 Principal Subjects';
            electiveList.innerHTML = '';
            
            subjects.forEach(subject => {
                const subjectItem = createSubjectItem(subject.name, false, false);
                electiveList.appendChild(subjectItem);
            });
        }

        function createSubjectItem(subjectName, isCompulsory, isChecked) {
            const div = document.createElement('div');
            div.className = `subject-item ${isCompulsory ? 'compulsory' : ''}`;
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'subject-checkbox';
            checkbox.value = subjectName;
            checkbox.checked = isChecked;
            checkbox.disabled = isCompulsory;
            
            const label = document.createElement('label');
            label.className = `subject-label ${isCompulsory ? 'locked' : ''}`;
            label.textContent = subjectName;
            
            if (!isCompulsory) {
                checkbox.addEventListener('change', handleSubjectSelection);
                label.addEventListener('click', () => {
                    checkbox.checked = !checkbox.checked;
                    handleSubjectSelection({ target: checkbox });
                });
            }
            
            div.appendChild(checkbox);
            div.appendChild(label);
            
            return div;
        }

        function handleSubjectSelection(event) {
            const subjectName = event.target.value;
            const isChecked = event.target.checked;
            
            if (isChecked) {
                if (!selectedSubjects.includes(subjectName)) {
                    selectedSubjects.push(subjectName);
                }
            } else {
                selectedSubjects = selectedSubjects.filter(s => s !== subjectName);
            }

            // Handle A-Level logic for ICT/Sub-Math
            if (['S.5', 'S.6'].includes(currentClassLevel)) {
                handleALevelSubsidiaryLogic();
            }

            updateCounter(getExpectedSubjectCount(), selectedSubjects.length);
            validateForm();
        }

        function handleALevelSubsidiaryLogic() {
            const hasMath = selectedSubjects.includes('Mathematics');
            
            // Remove existing subsidiary subjects first
            selectedSubjects = selectedSubjects.filter(s => s !== 'Computer Science' && s !== 'Subsidiary Mathematics');
            
            if (hasMath) {
                selectedSubjects.push('Computer Science');
            } else {
                selectedSubjects.push('Subsidiary Mathematics');
            }
        }

        function getExpectedSubjectCount() {
            if (['S.1', 'S.2'].includes(currentClassLevel)) return 12;
            if (['S.3', 'S.4'].includes(currentClassLevel)) return 9;
            if (['S.5', 'S.6'].includes(currentClassLevel)) return 5;
            return 0;
        }

        function updateCounter(expected, current) {
            subjectCounter.textContent = `Subjects Selected: ${current} / ${expected} Required`;
            subjectCounter.style.color = current === expected ? '#2ecc71' : '#f39c12';
        }

        function validateForm() {
            const form = document.getElementById('signupForm');
            const formData = new FormData(form);
            
            // Check basic fields
            const requiredFields = ['studentName', 'indexNumber', 'email', 'password', 'confirmPassword', 'stream', 'classTeacher', 'class'];
            const basicFieldsValid = requiredFields.every(field => {
                const value = formData.get(field);
                return value && value.trim() !== '';
            });
            
            // Check password match
            const password = formData.get('password');
            const confirmPassword = formData.get('confirmPassword');
            const passwordsMatch = password === confirmPassword;
            
            // Check subject count
            const expectedCount = getExpectedSubjectCount();
            const subjectsValid = selectedSubjects.length === expectedCount;
            
            signupButton.disabled = !(basicFieldsValid && passwordsMatch && subjectsValid);
        }

        // Add event listeners for form validation
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', validateForm);
        });

        // Handle form submission
        signupForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = {
                studentName: formData.get('studentName'),
                indexNumber: formData.get('indexNumber'),
                email: formData.get('email'),
                password: formData.get('password'),
                class: formData.get('class'),
                stream: formData.get('stream'),
                classTeacher: formData.get('classTeacher'),
                subjectsEnrolled: selectedSubjects
            };
            
            try {
                signupButton.disabled = true;
                signupButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';
                
                const response = await fetch('/register-student', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showMessage('Account created successfully! Please check your email for verification.', 'success');
                    setTimeout(() => {
                        window.location.href = 'studentlogin.html';
                    }, 2000);
                } else {
                    showMessage(result.message || 'Registration failed. Please try again.', 'error');
                }
            } catch (error) {
                showMessage('Network error. Please try again.', 'error');
            } finally {
                signupButton.disabled = false;
                signupButton.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
                validateForm();
            }
        });

        function showMessage(text, type) {
            const messageContainer = document.getElementById('messageContainer');
            messageContainer.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => {
                messageContainer.innerHTML = '';
            }, 5000);
        }

        // Initial validation
        validateForm();
    </script>
</body>
</html>
