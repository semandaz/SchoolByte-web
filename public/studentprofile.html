<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolByte - Student Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Load all fonts that can be selected for site-wide font changing -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&family=Lato:wght@400;700&family=Nunito+Sans:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=Montserrat:wght@400;600;700&family=Poppins:wght@400;600;700&family=Satisfy&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Global CSS Variables for Unified Color Palette */
        :root {
            /* Brand Colors */
            --color-brand-primary: #1a2a6c;   /* Dark Blue - Main brand color */
            --color-brand-secondary: #b21f1f; /* Deep Red/Maroon - Secondary brand color, accents */
            --color-brand-gold: #FFD700;     /* Gold - Accent for special elements, highlights */
            --color-brand-orange: #FFA500;   /* Orange - Used in gradients with gold */

            /* Neutral Palette */
            --color-neutral-white: #ffffff;
            --color-neutral-lightest: #f0f4f8; /* Very light gray/blue, good for subtle backgrounds */
            --color-neutral-light: #d1d5db;    /* Light gray for disabled elements, input borders */
            --color-neutral-medium: #9ca3af;   /* Medium gray for placeholders, disabled radio accents */
            --color-neutral-dark: #4b5563;     /* Dark gray for most body text, labels */
            --color-neutral-darkest: #333333;  /* Very dark gray for prominent text */

            /* Semantic Colors */
            --color-error-red: #e74c3c;        /* Standard error color */
            --color-error-red-dark: #c0392b;   /* Darker error red for hover states */
            --color-success-green: #2ecc71;    /* Success color */
            --color-info-blue: #3498db;        /* Info color */

            /* Background Gradients */
            --gradient-background-primary: linear-gradient(135deg, var(--color-brand-primary), var(--color-brand-secondary));
            --gradient-background-secondary: linear-gradient(135deg, var(--color-brand-primary), var(--color-brand-secondary), var(--color-brand-primary));

            /* Text Gradients */
            --gradient-text-gold: linear-gradient(to right, var(--color-brand-gold), var(--color-neutral-white));

            /* Button Gradients */
            --gradient-button-active: linear-gradient(to right, var(--color-brand-gold), var(--color-brand-orange));
            --gradient-button-active-hover: linear-gradient(to right, #FFC800, #FF8C00);

            /* Transparent Overlays */
            --overlay-light: rgba(255, 255, 255, 0.1);
            --overlay-medium: rgba(0, 0, 0, 0.2);
            --overlay-dark: rgba(30, 30, 60, 0.95);
            --overlay-selected-option: rgba(26, 42, 108, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Font family set by JS based on user preference */
        }

        body {
            background: var(--gradient-background-secondary); /* Consistent background gradient */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            padding: 40px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 4.5rem;
            font-weight: 900;
            background: var(--gradient-background-primary); /* Consistent text gradient */
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -2px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--color-brand-primary); /* Consistent subtitle color */
            font-size: 1.2rem;
            margin-top: 15px;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--gradient-background-primary); /* Consistent avatar background */
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: var(--color-neutral-white);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .profile-header h2 {
            color: var(--color-brand-primary); /* Consistent heading color */
            font-size: 1.8rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-brand-primary); /* Consistent label color */
            font-weight: 600;
            font-size: 1.1rem;
        }

        .required::after {
            content: " *";
            color: var(--color-error-red); /* Consistent required indicator color */
        }

        input, select {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--color-neutral-light); /* Consistent border color */
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        input[readonly] {
            background-color: var(--color-neutral-lightest);
            cursor: not-allowed;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--color-brand-primary); /* Consistent focus border color */
            box-shadow: 0 0 0 3px rgba(26, 42, 108, 0.2);
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-neutral-dark); /* Consistent toggle color */
            cursor: pointer;
        }

        .password-hint {
            font-size: 0.85rem;
            color: var(--color-neutral-dark); /* Consistent password hint color */
            margin-top: 5px;
            font-style: italic;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            margin: 25px 0;
            gap: 12px;
        }

        .terms input {
            width: 22px;
            height: 22px;
            margin-top: 3px;
        }

        .terms label {
            font-weight: normal;
            color: var(--color-neutral-dark); /* Consistent label text color */
        }

        .terms a {
            color: var(--color-brand-primary); /* Consistent link color */
            font-weight: 600;
            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 10px;
        }

        .btn {
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-back {
            background: var(--color-error-red); /* Consistent back button color */
            color: var(--color-neutral-white);
            flex: 1;
        }

        .btn-back:hover {
            background: var(--color-error-red-dark); /* Consistent hover for back button */
            transform: translateY(-2px);
        }

        .btn-submit {
            background: var(--color-brand-primary); /* Consistent submit button color */
            color: var(--color-neutral-white);
            flex: 2;
        }

        .btn-submit:hover {
            background: var(--color-brand-primary); /* Consider a darker shade if available, or just keep primary */
            opacity: 0.9; /* Add slight opacity change for hover if no dark variant */
            transform: translateY(-2px);
        }

        .btn-submit:disabled {
            background: var(--color-neutral-medium); /* Consistent disabled background */
            color: var(--color-neutral-dark); /* Consistent disabled text */
            cursor: not-allowed;
            transform: none;
        }

        .btn i {
            font-size: 1.2rem;
        }

        /* Custom Message Box Styles (copied for consistency) */
        .message-box-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }

        .message-box-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .message-box {
            background: var(--color-neutral-white);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }

        .message-box-overlay.show .message-box {
            transform: translateY(0);
        }

        .message-box h3 {
            color: var(--color-error-red);
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .message-box h3.success-title {
            color: var(--color-brand-primary);
        }

        .message-box p {
            color: var(--color-neutral-darkest);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
            white-space: pre-wrap;
        }

        .message-box button {
            background: var(--color-brand-primary);
            color: var(--color-neutral-white);
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .message-box button:hover {
            background: var(--color-brand-secondary); /* Consistent hover for primary */
        }

        @media (max-width: 768px) {
            .card {
                padding: 30px 20px;
            }

            .logo {
                font-size: 3.5rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .avatar {
                width: 100px;
                height: 100px;
                font-size: 2.5rem;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo-container">
                <div class="logo">SchoolByte</div>
                <p class="subtitle">Your personalized academic platform</p>
            </div>

            <div class="profile-header">
                <div class="avatar">
                    <i class="fas fa-user-graduate"></i>
                </div>
                <h2>Your Profile</h2>
            </div>

            <p class="subtitle" style="text-align: center; margin-bottom: 25px;">View and update your academic details</p>

            <form id="studentProfileForm" novalidate>
                <div class="form-group">
                    <label for="studentName" class="required">Student's Name</label>
                    <input type="text" id="studentName" placeholder="e.g., Naluwagga Joy" required>
                </div>

                <div class="form-group">
                    <label for="indexNumber" class="required">Index Number</label>
                    <input type="text" id="indexNumber" placeholder="e.g., 21/M/N/22" required>
                </div>

                <div class="form-group">
                    <label for="classTeacher">Class Teacher</label>
                    <input type="text" id="classTeacher" placeholder="e.g., Mr. Sentongo">
                </div>

                <div class="form-group">
                    <label for="class" class="required">Class</label>
                    <select id="class" required>
                        <option value="">Select Class</option>
                        <option value="S1">Senior 1</option>
                        <option value="S2">Senior 2</option>
                        <option value="S3">Senior 3</option>
                        <option value="S4">Senior 4</option>
                        <option value="S5">Senior 5</option>
                        <option value="S6">Senior 6</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="stream">Stream</label>
                    <select id="stream">
                        <option value="">Select Stream (Optional)</option>
                        <option value="Arts">Arts</option>
                        <option value="Science">Science</option>
                        <option value="Commercial">Commercial</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email" class="required">Email Address</label>
                    <input type="email" id="email" placeholder="e.g., student@schoolbyte.com" required readonly>
                </div>

                <!-- Password change section - initially optional -->
                <div class="form-group">
                    <label for="currentPassword">Current Password (for change)</label>
                    <div class="password-container">
                        <input type="password" id="currentPassword" placeholder="Enter current password">
                        <span class="toggle-password" id="currentPasswordToggle">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="password-container">
                        <input type="password" id="newPassword" placeholder="Min 8 chars, incl. uppercase, lowercase, number, special">
                        <span class="toggle-password" id="newPasswordToggle">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                    <p class="password-hint">Only fill if you want to change your password.</p>
                </div>

                <div class="form-group">
                    <label for="confirmNewPassword">Confirm New Password</label>
                    <div class="password-container">
                        <input type="password" id="confirmNewPassword" placeholder="Re-enter new password">
                        <span class="toggle-password" id="confirmNewPasswordToggle">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>

                <div class="buttons">
                    <button type="button" class="btn btn-back" onclick="location.href='/studentdashboard.html'">
                        <i class="fas fa-arrow-left"></i> Back to Dashboard
                    </button>
                    <button type="submit" id="saveProfileBtn" class="btn btn-submit">
                        <i class="fas fa-save"></i> Save Profile
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom Message Box HTML -->
    <div id="messageBoxOverlay" class="message-box-overlay">
        <div class="message-box">
            <h3 id="messageBoxTitle"></h3>
            <p id="messageBoxContent"></p>
            <button id="messageBoxCloseBtn">OK</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const BACKEND_URL = window.location.origin; 

            // Cached DOM elements
            const studentProfileForm = document.getElementById('studentProfileForm');
            const studentNameInput = document.getElementById('studentName');
            const indexNumberInput = document.getElementById('indexNumber');
            const classTeacherInput = document.getElementById('classTeacher');
            const classSelect = document.getElementById('class');
            const streamSelect = document.getElementById('stream');
            const emailInput = document.getElementById('email'); // Now read-only

            const currentPasswordInput = document.getElementById('currentPassword');
            const newPasswordInput = document.getElementById('newPassword');
            const confirmNewPasswordInput = document.getElementById('confirmNewPassword');

            const currentPasswordToggle = document.getElementById('currentPasswordToggle');
            const newPasswordToggle = document.getElementById('newPasswordToggle');
            const confirmNewPasswordToggle = document.getElementById('confirmNewPasswordToggle');

            const saveProfileBtn = document.getElementById('saveProfileBtn');

            // Message Box elements
            const messageBoxOverlay = document.getElementById('messageBoxOverlay');
            const messageBoxTitle = document.getElementById('messageBoxTitle');
            const messageBoxContent = document.getElementById('messageBoxContent');
            const messageBoxCloseBtn = document.getElementById('messageBoxCloseBtn');

            // Function to display custom message box
            function showMessageBox(title, message, isSuccess = false) {
                messageBoxTitle.textContent = title;
                messageBoxContent.textContent = message;
                // Set title color based on success/error
                if (isSuccess) {
                    messageBoxTitle.classList.add('success-title');
                    messageBoxTitle.style.color = 'var(--color-brand-primary)'; // Explicitly set success color
                } else {
                    messageBoxTitle.classList.remove('success-title');
                    messageBoxTitle.style.color = 'var(--color-error-red)'; // Explicitly set error color
                }
                messageBoxOverlay.classList.add('show');
            }

            // Close message box
            messageBoxCloseBtn.addEventListener('click', function() {
                messageBoxOverlay.classList.remove('show');
            });

            // Toggle password visibility
            function setupPasswordToggle(field, toggle) {
                if (field && toggle) {
                    toggle.addEventListener('click', function() {
                        const icon = this.querySelector('i');
                        if (field.type === 'password') {
                            field.type = 'text';
                            icon.classList.remove('fa-eye');
                            icon.classList.add('fa-eye-slash');
                        } else {
                            field.type = 'password';
                            icon.classList.remove('fa-eye-slash');
                            icon.classList.add('fa-eye');
                        }
                    });
                }
            }

            // Setup password toggles for all password fields
            setupPasswordToggle(currentPasswordInput, currentPasswordToggle);
            setupPasswordToggle(newPasswordInput, newPasswordToggle);
            setupPasswordToggle(confirmNewPasswordInput, confirmNewPasswordToggle);

            // Validate password complexity
            function isValidPassword(password) {
                const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+])[A-Za-z\d!@#$%^&*()_+]{8,}$/;
                return passwordRegex.test(password);
            }

            // --- Fetch Student Data ---
            async function fetchStudentProfile() {
                const urlParams = new URLSearchParams(window.location.search);
                const studentEmail = urlParams.get('email'); // Get email from URL parameter

                if (!studentEmail) {
                    showMessageBox('Error', 'Student email not found in URL. Please log in again.', false);
                    console.error('Student email missing from URL for profile page.');
                    setTimeout(() => window.location.href = '/index.html', 2000); // Corrected redirect
                    return;
                }

                try {
                    const response = await fetch(`${BACKEND_URL}/student-dashboard-data?email=${encodeURIComponent(studentEmail)}`, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });

                    const data = await response.json();

                    if (response.ok) {
                        const student = data.student;
                        studentNameInput.value = student.studentName || '';
                        indexNumberInput.value = student.indexNumber || '';
                        classTeacherInput.value = student.classTeacher || '';
                        classSelect.value = student.class || '';
                        streamSelect.value = student.stream || '';
                        emailInput.value = student.email || ''; // Email is read-only
                        
                        // Store email in localStorage for consistency
                        localStorage.setItem('currentStudentEmail', student.email);

                    } else {
                        showMessageBox('Error', data.message || 'Failed to load profile data. Please try again.', false);
                        console.error('Failed to fetch student profile:', data.message);
                        setTimeout(() => window.location.href = '/index.html', 2000); // Corrected redirect
                    }
                } catch (error) {
                    console.error('Network error fetching profile:', error);
                    showMessageBox('Network Error', 'Could not load profile. Check internet.', false);
                    setTimeout(() => window.location.href = '/index.html', 2000); // Corrected redirect
                }
            }

            // --- Validate Form (for Save Profile button) ---
            function validateForm() {
                const isNameFilled = studentNameInput.value.trim() !== '';
                const isIndexNumberFilled = indexNumberInput.value.trim() !== '';
                const isClassSelected = classSelect.value !== '';
                const isEmailFilled = emailInput.value.trim() !== ''; // Email is read-only, so it should always be filled if data loaded

                let isPasswordChangeValid = true;
                const newPassword = newPasswordInput.value;
                const confirmNewPassword = confirmNewPasswordInput.value;
                const currentPassword = currentPasswordInput.value;

                // If any new password field is filled, all must be valid
                if (newPassword || confirmNewPassword || currentPassword) {
                    if (!currentPassword) {
                        isPasswordChangeValid = false;
                    }
                    if (newPassword.length < 8 || !isValidPassword(newPassword)) {
                        isPasswordChangeValid = false;
                    }
                    if (newPassword !== confirmNewPassword) {
                        isPasswordChangeValid = false;
                    }
                }

                const isFormValid = isNameFilled && isIndexNumberFilled && isClassSelected && isEmailFilled && isPasswordChangeValid;
                
                saveProfileBtn.disabled = !isFormValid;
                if (isFormValid) {
                    saveProfileBtn.classList.add('active');
                } else {
                    saveProfileBtn.classList.remove('active');
                }
            }

            // --- Handle Form Submission (Save Profile) ---
            studentProfileForm.addEventListener('submit', async function(event) {
                event.preventDefault();

                // Re-validate just before submission
                validateForm();
                if (saveProfileBtn.disabled) {
                    showMessageBox('Validation Error', 'Please fill in all required fields and ensure passwords meet criteria.', false);
                    return;
                }

                const studentEmail = emailInput.value.trim(); // Get email from the read-only field
                const studentName = studentNameInput.value.trim();
                const indexNumber = indexNumberInput.value.trim();
                const classTeacher = classTeacherInput.value.trim();
                const studentClass = classSelect.value;
                const stream = streamSelect.value;

                let updatePayload = {
                    studentName,
                    indexNumber,
                    classTeacher,
                    class: studentClass,
                    stream
                };

                // Add password fields to payload ONLY if they are being changed
                const newPassword = newPasswordInput.value;
                const currentPassword = currentPasswordInput.value;

                if (newPassword) {
                    if (newPassword !== confirmNewPasswordInput.value) {
                        showMessageBox('Error', 'New passwords do not match.', false);
                        confirmNewPasswordInput.focus();
                        return;
                    }
                    if (!isValidPassword(newPassword)) {
                        showMessageBox('Password Requirements', 'New password does not meet the requirements.', false);
                        newPasswordInput.focus();
                        return;
                    }
                    updatePayload.currentPassword = currentPassword;
                    updatePayload.newPassword = newPassword;
                }

                saveProfileBtn.textContent = 'Saving...';
                saveProfileBtn.disabled = true;
                saveProfileBtn.classList.remove('active');

                try {
                    const response = await fetch(`${BACKEND_URL}/update-student-profile?email=${encodeURIComponent(studentEmail)}`, {
                        method: 'PUT', // Use PUT for updates
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(updatePayload)
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showMessageBox('Success', data.message, true);
                        // Clear password fields after successful update
                        currentPasswordInput.value = '';
                        newPasswordInput.value = '';
                        confirmNewPasswordInput.value = '';
                        // Re-fetch data to ensure UI is consistent with backend (e.g., if backend modifies data)
                        fetchStudentProfile(); 
                    } else {
                        showMessageBox('Error', data.message || 'Failed to update profile.', false);
                    }
                } catch (error) {
                    console.error('Error saving profile:', error);
                    showMessageBox('Network Error', 'Could not connect to the server to save profile.', false);
                } finally {
                    saveProfileBtn.textContent = 'Save Profile';
                    validateForm(); // Re-validate to reset button state
                }
            });

            // Apply saved font preference on page load
            const savedFont = localStorage.getItem('preferredFont');
            if (savedFont) {
                document.body.style.fontFamily = savedFont;
            } else {
                document.body.style.fontFamily = 'Inter, sans-serif'; // Default font
            }

            // Initial load and validation
            fetchStudentProfile(); // Load data when page loads
            studentNameInput.addEventListener('input', validateForm);
            indexNumberInput.addEventListener('input', validateForm);
            classTeacherInput.addEventListener('input', validateForm);
            classSelect.addEventListener('change', validateForm);
            streamSelect.addEventListener('change', validateForm);
            currentPasswordInput.addEventListener('input', validateForm);
            newPasswordInput.addEventListener('input', validateForm);
            confirmNewPasswordInput.addEventListener('input', validateForm);
            // Initial validation after data is populated (or mocked)
            setTimeout(validateForm, 500); // Give a slight delay for data to load
        });
    </script>
</body>
</html>
