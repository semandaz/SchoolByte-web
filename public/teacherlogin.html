
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolByte - Teacher Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* General styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--user-font-family, 'Inter', sans-serif);
        }
        
        body {
            background: linear-gradient(135deg, #2c3e50, #1a2530);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ecf0f1;
            padding: 20px;
        }
        
        .login-container {
            width: 100%;
            max-width: 450px;
            background: rgba(30, 40, 56, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            border: 1px solid rgba(127, 140, 163, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .login-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
        
        .login-header {
            background: linear-gradient(to right, #3498db, #2c3e50);
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .login-header::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            transform: rotate(30deg);
        }
        
        .logo {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .logo-icon {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        
        .logo-text {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .login-header h1 {
            position: relative;
            z-index: 2;
            font-weight: 500;
            font-size: 22px;
            letter-spacing: 0.5px;
            margin-top: 10px;
            color: rgba(255, 255, 255, 0.9);
        }
        
        /* Form styling */
        .login-form {
            padding: 40px;
        }
        
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #bdc3c7;
            font-size: 15px;
            letter-spacing: 0.5px;
        }
        
        .input-with-icon {
            position: relative;
        }
        
        .input-with-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #3498db;
            font-size: 18px;
        }
        
        .form-control {
            width: 100%;
            padding: 15px 15px 15px 50px;
            background: rgba(25, 35, 50, 0.6);
            border: 1px solid rgba(127, 140, 163, 0.3);
            border-radius: 10px;
            color: #ecf0f1;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
            letter-spacing: 0.5px;
        }
        
        .form-control:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
            background: rgba(30, 45, 65, 0.7);
        }
        
        .password-container {
            position: relative;
        }
        
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #7f8c8d;
            cursor: pointer;
            font-size: 18px;
            transition: color 0.3s;
        }
        
        .toggle-password:hover {
            color: #3498db;
        }
        
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0;
            font-size: 14px;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .remember-me input {
            accent-color: #3498db;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .forgot-password {
            color: #3498db;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .forgot-password:hover {
            color: #2980b9;
            text-decoration: underline;
        }
        
        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(to right, #3498db, #2980b9);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(41, 128, 185, 0.3);
        }
        
        .btn-login:hover:not(:disabled) {
            background: linear-gradient(to right, #2980b9, #2573a7);
            box-shadow: 0 6px 20px rgba(41, 128, 185, 0.4);
            transform: translateY(-2px);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Divider styling */
        .divider {
            display: flex;
            align-items: center;
            margin: 30px 0;
            color: #7f8c8d;
        }
        
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(127, 140, 163, 0.3);
        }
        
        .divider-text {
            padding: 0 15px;
            font-size: 14px;
        }
        
        /* Social login styling */
        .social-login {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(25, 35, 50, 0.6);
            border: 1px solid rgba(127, 140, 163, 0.3);
            color: #bdc3c7;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .social-btn:hover {
            background: rgba(52, 152, 219, 0.2);
            color: #3498db;
            transform: translateY(-3px);
        }
        
        /* Signup link styling */
        .signup-link {
            text-align: center;
            font-size: 15px;
            color: #bdc3c7;
        }
        
        .signup-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        .signup-link a:hover {
            color: #2980b9;
            text-decoration: underline;
        }
        
        /* Security info styling */
        .security-info {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            font-size: 13px;
            color: #7f8c8d;
        }
        
        .security-info i {
            color: #2ecc71;
        }
        
        /* Responsive design */
        @media (max-width: 500px) {
            .login-form {
                padding: 30px 20px;
            }
            
            .login-header {
                padding: 25px 20px;
            }
            
            .logo-text {
                font-size: 24px;
            }
        }
        
        /* Animation for form elements */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .form-group, .options, .btn-login, .divider, .social-login, .signup-link {
            animation: fadeIn 0.5s ease-out;
            animation-fill-mode: both;
        }
        
        .form-group { animation-delay: 0.1s; }
        .options { animation-delay: 0.3s; }
        .btn-login { animation-delay: 0.4s; }
        .divider { animation-delay: 0.5s; }
        .social-login { animation-delay: 0.6s; }
        .signup-link { animation-delay: 0.7s; }

        /* Custom Message Box Styles */
        .message-box-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .message-box-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .message-box {
            background: #2c3e50;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 350px;
            width: 90%;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }

        .message-box-overlay.show .message-box {
            transform: translateY(0);
        }

        .message-box p {
            font-size: 16px;
            margin-bottom: 20px;
            color: #ecf0f1;
        }

        .message-box button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.3s ease;
        }

        .message-box button:hover {
            background: #2980b9;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-text {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .error-text.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <div class="logo-text">SchoolByte</div>
            </div>
            <h1>Educator Portal - Secure Login</h1>
        </div>
        
        <form class="login-form" id="login-form">
            <div class="form-group">
                <label for="teacherName">Full Name</label>
                <div class="input-with-icon">
                    <i class="fas fa-user"></i>
                    <input 
                        type="text" 
                        id="teacherName" 
                        class="form-control" 
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>
                <div class="error-text" id="name-error"></div>
            </div>
            
            <div class="form-group">
                <label for="email">School Email</label>
                <div class="input-with-icon">
                    <i class="fas fa-envelope"></i>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-control" 
                        placeholder="your.name@school.edu or Admin: your.name@school.edu"
                        autocomplete="email"
                        required
                    >
                </div>
                <div class="error-text" id="email-error"></div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <div class="password-container">
                        <input 
                            type="password" 
                            id="password" 
                            class="form-control" 
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="error-text" id="password-error"></div>
            </div>
            
            <div class="options">
                <div class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="forgot-password">Forgot password?</a>
            </div>
            
            <button type="submit" class="btn-login" id="login-btn">Sign In to Dashboard</button>
            
            <div class="divider">
                <div class="divider-text">Or continue with</div>
            </div>
            
            <div class="social-login">
                <div class="social-btn">
                    <i class="fab fa-google"></i>
                </div>
                <div class="social-btn">
                    <i class="fab fa-microsoft"></i>
                </div>
                <div class="social-btn">
                    <i class="fab fa-apple"></i>
                </div>
            </div>
            
            <div class="signup-link">
                New to SchoolByte? <a href="#">Contact Admin</a>
            </div>
            
            <div class="security-info">
                <i class="fas fa-shield-alt"></i>
                <span>256-bit SSL encryption</span>
                <i class="fas fa-user-shield"></i>
                <span>GDPR compliant</span>
            </div>
        </form>
    </div>

    <!-- Custom Message Box HTML -->
    <div id="messageBoxOverlay" class="message-box-overlay">
        <div class="message-box">
            <p id="messageBoxText"></p>
            <button id="messageBoxClose">OK</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const loginForm = document.getElementById('login-form');
            const loginBtn = document.getElementById('login-btn');
            const teacherNameInput = document.getElementById('teacherName');
            const emailInput = document.getElementById('email');

            // Message box elements
            const messageBoxOverlay = document.getElementById('messageBoxOverlay');
            const messageBoxText = document.getElementById('messageBoxText');
            const messageBoxClose = document.getElementById('messageBoxClose');

            // Error elements
            const nameError = document.getElementById('name-error');
            const emailError = document.getElementById('email-error');
            const passwordError = document.getElementById('password-error');

            // Load font preferences
            loadFontPreferences();

            // Function to show custom message box
            function showMessageBox(message) {
                messageBoxText.textContent = message;
                messageBoxOverlay.classList.add('show');
            }

            // Function to hide custom message box
            function hideMessageBox() {
                messageBoxOverlay.classList.remove('show');
            }

            // Clear error messages
            function clearErrors() {
                nameError.classList.remove('show');
                emailError.classList.remove('show');
                passwordError.classList.remove('show');
            }

            // Show error message
            function showError(element, message) {
                element.textContent = message;
                element.classList.add('show');
            }

            // Load font preferences from localStorage or default
            function loadFontPreferences() {
                try {
                    const userData = JSON.parse(localStorage.getItem('userData') || '{}');
                    if (userData.preferences && userData.preferences.fontFamily) {
                        document.documentElement.style.setProperty('--user-font-family', userData.preferences.fontFamily);
                    }
                } catch (error) {
                    console.error('Error loading font preferences:', error);
                }
            }

            // Close message box on OK button click
            messageBoxClose.addEventListener('click', hideMessageBox);
            
            // Close message box if clicking outside
            messageBoxOverlay.addEventListener('click', function(e) {
                if (e.target === messageBoxOverlay) {
                    hideMessageBox();
                }
            });

            // Toggle password visibility
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // Toggle eye icon
                if (type === 'password') {
                    this.innerHTML = '<i class="fas fa-eye"></i>';
                } else {
                    this.innerHTML = '<i class="fas fa-eye-slash"></i>';
                }
            });
            
            // Form submission handler
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                clearErrors();

                const name = teacherNameInput.value.trim();
                let email = emailInput.value.trim();
                const password = passwordInput.value;

                // Client-side validation
                let hasError = false;

                if (!name) {
                    showError(nameError, 'Please enter your full name.');
                    hasError = true;
                }
                
                if (!email || !validateEmail(email)) {
                    showError(emailError, 'Please enter a valid school email address.');
                    hasError = true;
                }
                
                if (!password || password.length < 6) {
                    showError(passwordError, 'Password must be at least 6 characters long.');
                    hasError = true;
                }

                if (hasError) return;

                // Determine the redirection URL based on email prefix
                let redirectUrl = 'teacherdashboard.html';
                const adminPrefix = 'Admin: ';
                let isAdmin = false;

                if (email.startsWith(adminPrefix)) {
                    email = email.substring(adminPrefix.length).trim();
                    redirectUrl = 'verifyadmindashboard.html';
                    isAdmin = true;
                }
                
                // Show loading state
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="loading"></span> Authenticating...';
                
                try {
                    let response;
                    
                    if (isAdmin) {
                        // Admin login - first step (initiate 2FA)
                        response = await fetch('/login-admin', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ email, password }),
                        });
                    } else {
                        // Teacher login
                        response = await fetch('/login-teacher', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ email, password }),
                        });
                    }

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.message || 'Login failed');
                    }

                    if (isAdmin) {
                        // Admin 2FA initiated - redirect to verification page
                        localStorage.setItem('adminEmail', email);
                        showMessageBox('2FA code sent to your email. Redirecting to verification...');
                        setTimeout(() => {
                            window.location.href = 'admin-2fa-verify.html';
                        }, 2000);
                    } else {
                        // Teacher login successful
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('userData', JSON.stringify(data.teacher));
                        
                        // Check if teacher needs to set initial password
                        if (!data.teacher.isPasswordSet) {
                            showMessageBox('Please set your initial password. Redirecting...');
                            setTimeout(() => {
                                window.location.href = 'teacher-set-password.html';
                            }, 2000);
                        } else {
                            showMessageBox('Login successful! Redirecting to dashboard...');
                            setTimeout(() => {
                                window.location.href = redirectUrl;
                            }, 1500);
                        }
                    }

                } catch (error) {
                    console.error('Login error:', error);
                    showMessageBox(error.message || 'Login failed. Please try again.');
                } finally {
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Sign In to Dashboard';
                }
            });
            
            // Email validation function
            function validateEmail(email) {
                const re = /^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
                return re.test(String(email).toLowerCase());
            }
        });
    </script>
</body>
</html>
