<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolByte - Upload Quiz Question</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* General styling from Teacher Login */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif; /* Ensuring Inter is used */
        }

        body {
            background: linear-gradient(135deg, #2c3e50, #1a2530); /* Dark gradient from teacher login */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ecf0f1; /* Light text color */
            padding: 20px;
        }

        .quiz-container {
            width: 100%;
            max-width: 900px; /* Adjusted max-width for more form content */
            background: rgba(30, 40, 56, 0.85); /* Slightly transparent dark background */
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            border: 1px solid rgba(127, 140, 163, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            padding: 40px; /* Padding inside the container */
        }

        .quiz-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        /* Header styling from Teacher Login */
        .page-header {
            background: linear-gradient(to right, #3498db, #2c3e50);
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border-radius: 16px 16px 0 0; /* Match container top corners */
            margin: -40px -40px 40px -40px; /* Pull header to edges */
        }

        .page-header::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            transform: rotate(30deg);
        }

        .logo {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            color: #ecf0f1;
        }

        .page-header h1 {
            position: relative;
            z-index: 2;
            font-weight: 500;
            font-size: 22px;
            letter-spacing: 0.5px;
            margin-top: 10px;
            color: rgba(255, 255, 255, 0.9);
        }

        /* Form styling adaptations */
        .form-group { /* Replaced form-field */
            margin-bottom: 25px;
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #bdc3c7; /* Lighter text for labels */
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .input-with-icon { /* For text/number inputs if icons are desired */
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #3498db;
            font-size: 18px;
        }

        .form-control { /* Applies to input, select, textarea */
            width: 100%;
            padding: 15px; /* Increased padding */
            padding-left: 15px; /* Adjust if icon is present */
            background: rgba(25, 35, 50, 0.6);
            border: 1px solid rgba(127, 140, 163, 0.3);
            border-radius: 10px;
            color: #ecf0f1;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
            letter-spacing: 0.5px;
            appearance: none; /* Remove default select arrow */
            -webkit-appearance: none;
            -moz-appearance: none;
        }

        .form-control:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
            background: rgba(30, 45, 65, 0.7);
        }

        .form-select {
            background-image: url('data:image/svg+xml;utf8,<svg fill="%23ecf0f1" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>');
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 18px;
            padding-right: 40px; /* Make space for the custom arrow */
        }

        /* Specific for Quiz Page elements */
        .collapsible-section {
            background: rgba(25, 35, 50, 0.4);
            border: 1px solid rgba(127, 140, 163, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin-top: 25px; /* Space between sections */
        }

        .collapsible-header {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            font-weight: 600;
            color: #bdc3c7;
            font-size: 15px;
            transition: color 0.3s;
        }

        .collapsible-header:hover {
            color: #3498db;
        }

        .collapsible-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
        }
        .collapsible-content.expanded {
            max-height: 200px; /* Adjust as needed for content height */
            transition: max-height 0.6s ease-in;
        }

        .collapsible-header i {
            transition: transform 0.3s ease;
        }

        .collapsible-content.expanded + .collapsible-header i { /* Corrected selector */
            transform: rotate(180deg);
        }


        .add-button {
            background: linear-gradient(to right, #2ecc71, #27ae60); /* Green gradient */
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
        }
        .add-button:hover {
            background: linear-gradient(to right, #27ae60, #229954);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(46, 204, 113, 0.4);
        }

        .remove-button {
            color: #e74c3c; /* Red color */
            margin-left: 10px;
            cursor: pointer;
            font-size: 18px;
            transition: color 0.3s;
        }
        .remove-button:hover {
            color: #c0392b;
        }

        .btn-upload { /* Renamed from save-button to fit "btn-login" pattern */
            width: 100%;
            padding: 16px;
            background: linear-gradient(to right, #3498db, #2980b9);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(41, 128, 185, 0.3);
            margin-top: 40px; /* Space above button */
        }
        .btn-upload:hover:not(:disabled) {
            background: linear-gradient(to right, #2980b9, #2573a7);
            box-shadow: 0 6px 20px rgba(41, 128, 185, 0.4);
            transform: translateY(-2px);
        }
        .btn-upload:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .option-item, .pair-item, .order-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        input[type="radio"], input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #3498db; /* Blue accent color */
            cursor: pointer;
            border: 1px solid rgba(127, 140, 163, 0.3); /* Add a border */
            border-radius: 4px; /* Slightly rounded corners for checkboxes */
            background-color: rgba(25, 35, 50, 0.6); /* Match input background */
        }
        input[type="radio"] {
            border-radius: 50%; /* Make radio buttons perfectly round */
        }

        .dynamic-fields-container { /* Renamed for clarity */
            background: rgba(25, 35, 50, 0.4);
            border: 1px solid rgba(127, 140, 163, 0.2);
            border-radius: 10px;
            padding: 25px;
            margin-top: 25px;
            min-height: 150px;
            display: flex; /* Use flex to center content when empty */
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
        }

        .dynamic-fields-container p {
            color: #bdc3c7;
            font-size: 16px;
        }

        /* Custom Message Box Styles from Teacher Login */
        .message-box-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .message-box-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .message-box {
            background: #2c3e50;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 350px;
            width: 90%;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
            color: #ecf0f1; /* Ensure text is visible */
        }

        .message-box-overlay.show .message-box {
            transform: translateY(0);
        }

        .message-box h3 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .message-box p {
            font-size: 16px;
            margin-bottom: 20px;
            color: #ecf0f1;
            white-space: pre-wrap; /* Preserve line breaks from original */
        }

        .message-box button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.3s ease;
        }

        .message-box button:hover {
            background: #2980b9;
        }

        .error-text { /* For inline validation messages if needed */
            color: #e74c3c;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .error-text.show {
            display: block;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .quiz-container {
                padding: 20px;
            }
            .page-header {
                margin: -20px -20px 30px -20px;
            }
            .page-header h1 {
                font-size: 18px;
            }
            .logo-text {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="page-header">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <div class="logo-text">SchoolByte</div>
            </div>
            <h1>Upload New Quiz Question</h1>
        </div>

        <form id="quizUploadForm" class="space-y-6">
            <!-- General Question Details -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="form-group">
                    <label for="subject" class="form-label">Subject <span class="text-red-500">*</span></label>
                    <select id="subject" class="form-control form-select" required>
                        <option value="">Select Subject</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="English">English</option>
                        <option value="Biology">Biology</option>
                        <option value="Chemistry">Chemistry</option>
                        <option value="Physics">Physics</option>
                        <option value="History">History</option>
                        <option value="Geography">Geography</option>
                        <option value="Computer Science">Computer Science</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="intendedClass" class="form-label">Intended Class <span class="text-red-500">*</span></label>
                    <select id="intendedClass" class="form-control form-select" required>
                        <option value="">Select Class</option>
                        <option value="S.1">Senior 1</option>
                        <option value="S.2">Senior 2</option>
                        <option value="S.3">Senior 3</option>
                        <option value="S.4">Senior 4</option>
                        <option value="S.5">Senior 5</option>
                        <option value="S.6">Senior 6</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="maxBytesReward" class="form-label">Bytes Reward (for this question) <span class="text-red-500">*</span></label>
                <input type="number" id="maxBytesReward" class="form-control" placeholder="e.g., 1" min="1" required>
            </div>

            <!-- Instructions Collapsible -->
            <div class="collapsible-section">
                <div class="collapsible-header" onclick="toggleCollapsible('instructionsContent', 'instructionsArrow')">
                    <span>Instructions (Optional)</span>
                    <i id="instructionsArrow" class="fas fa-chevron-down"></i>
                </div>
                <div id="instructionsContent" class="collapsible-content">
                    <textarea id="instructions" class="form-control h-20 mt-2" placeholder="Provide specific instructions for the student..."></textarea>
                </div>
            </div>

            <!-- Hint Collapsible -->
            <div class="collapsible-section">
                <div class="collapsible-header" onclick="toggleCollapsible('hintContent', 'hintArrow')">
                    <span>Hint (Optional)</span>
                    <i id="hintArrow" class="fas fa-chevron-down"></i>
                </div>
                <div id="hintContent" class="collapsible-content">
                    <textarea id="hint" class="form-control h-20 mt-2" placeholder="Provide a hint for the student..."></textarea>
                </div>
            </div>

            <!-- Question Type Selection -->
            <div class="form-group">
                <label for="questionType" class="form-label">Question Type <span class="text-red-500">*</span></label>
                <select id="questionType" class="form-control form-select" onchange="renderQuestionTypeFields()" required>
                    <option value="">Select Question Type</option>
                    <option value="multiple-choice-single">Multiple Choice (Single Answer)</option>
                    <option value="multiple-choice-multi">Multiple Choice (Multiple Answers)</option>
                    <option value="short-answer">Short Answer</option>
                    <option value="true-false">True/False</option>
                    <option value="fill-in-the-blank">Fill in the Blank</option>
                    <option value="matching">Matching</option>
                    <option value="ordering">Ordering</option>
                    <option value="problem-solving">Problem Solving (Free Response)</option>
                    <option value="numeric-entry">Numeric Entry</option>
                </select>
            </div>

            <!-- Dynamic Question Type Fields Container -->
            <div id="dynamicQuestionFields" class="dynamic-fields-container">
                <p>Select a question type above to configure its options.</p>
            </div>

            <button type="submit" class="btn-upload">Upload Question?</button>
        </form>
    </div>

    <!-- Custom Message Box HTML -->
    <div id="messageBoxOverlay" class="message-box-overlay">
        <div class="message-box">
            <h3 id="messageBoxTitle"></h3>
            <p id="messageBoxContent"></p>
            <button id="messageBoxOkBtn">OK</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const quizUploadForm = document.getElementById('quizUploadForm');
            quizUploadForm.addEventListener('submit', handleFormSubmission);

            // Event listener for message box OK button
            document.getElementById('messageBoxOkBtn').addEventListener('click', hideMessageBox);

            // Initial render call in case a type is pre-selected (though not in this example)
            renderQuestionTypeFields();
        });

        function toggleCollapsible(contentId, arrowId) {
            const content = document.getElementById(contentId);
            const arrow = document.getElementById(arrowId);
            content.classList.toggle('expanded');
            arrow.classList.toggle('fa-chevron-up');
            arrow.classList.toggle('fa-chevron-down');
        }

        function renderQuestionTypeFields() {
            const questionType = document.getElementById('questionType').value;
            const dynamicFieldsContainer = document.getElementById('dynamicQuestionFields');
            dynamicFieldsContainer.innerHTML = ''; // Clear previous fields

            let html = '';
            switch (questionType) {
                case 'multiple-choice-single':
                    html = `
                        <label for="questionText" class="form-label">Question Text <span class="text-red-500">*</span></label>
                        <textarea id="questionText" class="form-control h-28 mb-6" placeholder="Enter the full question text here..." required></textarea>
                        <p class="form-label">Options (Mark one as correct):</p>
                        <div id="optionsContainer" class="mb-4 w-full"></div>
                        <button type="button" class="add-button" onclick="addOption('single')">
                            <i class="fas fa-plus-circle"></i> Add Option
                        </button>
                    `;
                    break;
                case 'multiple-choice-multi':
                    html = `
                        <label for="questionText" class="form-label">Question Text <span class="text-red-500">*</span></label>
                        <textarea id="questionText" class="form-control h-28 mb-6" placeholder="Enter the full question text here..." required></textarea>
                        <p class="form-label">Options (Mark one or more as correct):</p>
                        <div id="optionsContainer" class="mb-4 w-full"></div>
                        <button type="button" class="add-button" onclick="addOption('multi')">
                            <i class="fas fa-plus-circle"></i> Add Option
                        </button>
                    `;
                    break;
                case 'short-answer':
                case 'problem-solving':
                    html = `
                        <label for="questionText" class="form-label">Question Text <span class="text-red-500">*</span></label>
                        <textarea id="questionText" class="form-control h-28 mb-6" placeholder="Enter the full question text here..." required></textarea>
                        <label for="correctAnswers" class="form-label">Correct Answer(s) (Comma-separated for multiple possibilities)</label>
                        <textarea id="correctAnswers" class="form-control" rows="3" placeholder="e.g., Photosynthesis, Cell Respiration"></textarea>
                    `;
                    break;
                case 'true-false':
                    html = `
                        <label for="questionText" class="form-label">Question Text <span class="text-red-500">*</span></label>
                        <textarea id="questionText" class="form-control h-28 mb-6" placeholder="Enter the full question text here..." required></textarea>
                        <p class="form-label">Correct Answer:</p>
                        <div class="flex items-center gap-4 mt-2">
                            <label class="inline-flex items-center">
                                <input type="radio" name="trueFalseAnswer" value="true" class="form-radio">
                                <span class="ml-2">True</span>
                            </label>
                            <label class="inline-flex items-center">
                                <input type="radio" name="trueFalseAnswer" value="false" class="form-radio">
                                <span class="ml-2">False</span>
                            </label>
                        </div>
                    `;
                    break;
                case 'fill-in-the-blank':
                    html = `
                        <label for="blankQuestionText" class="form-label">Question with Blank (Use [BLANK] placeholder) <span class="text-red-500">*</span></label>
                        <textarea id="blankQuestionText" class="form-control mb-4" rows="3" placeholder="e.g., The capital of France is [BLANK]." required></textarea>
                        <label for="blankCorrectAnswer" class="form-label">Correct Answer for Blank <span class="text-red-500">*</span></label>
                        <input type="text" id="blankCorrectAnswer" class="form-control" placeholder="e.g., Paris" required>
                    `;
                    break;
                case 'matching':
                    html = `
                        <label for="questionText" class="form-label">Instructions for Matching (e.g., "Match the author to their work.") <span class="text-red-500">*</span></label>
                        <textarea id="questionText" class="form-control h-28 mb-6" placeholder="Enter instructions for the matching task..." required></textarea>
                        <p class="form-label">Matching Pairs (Item A matches Item B): <span class="text-red-500">*</span></p>
                        <div id="matchingPairsContainer" class="mb-4 w-full"></div>
                        <button type="button" class="add-button" onclick="addMatchingPair()">
                            <i class="fas fa-plus-circle"></i> Add Matching Pair
                        </button>
                    `;
                    break;
                case 'ordering':
                    html = `
                        <label for="questionText" class="form-label">Instructions for Ordering (e.g., "Put these events in chronological order:") <span class="text-red-500">*</span></label>
                        <textarea id="questionText" class="form-control h-28 mb-6" placeholder="Enter instructions for the ordering task..." required></textarea>
                        <p class="form-label">Items in Correct Order (Add items in the sequence you want them to be ordered): <span class="text-red-500">*</span></p>
                        <div id="orderingItemsContainer" class="mb-4 w-full"></div>
                        <button type="button" class="add-button" onclick="addOrderingItem()">
                            <i class="fas fa-plus-circle"></i> Add Item
                        </button>
                    `;
                    break;
                case 'numeric-entry':
                    html = `
                        <label for="questionText" class="form-label">Question Text <span class="text-red-500">*</span></label>
                        <textarea id="questionText" class="form-control h-28 mb-6" placeholder="e.g., Solve for x: 2x + 5 = 15" required></textarea>
                        <label for="numericAnswer" class="form-label">Correct Numeric Answer <span class="text-red-500">*</span></label>
                        <input type="number" id="numericAnswer" class="form-control" placeholder="e.g., 5" required>
                    `;
                    break;
                default:
                    html = '<p>Select a question type above to configure its options.</p>';
                    break;
            }
            dynamicFieldsContainer.innerHTML = html;

            // Add initial fields for dynamic types
            if (questionType.startsWith('multiple-choice')) {
                addOption(questionType.endsWith('single') ? 'single' : 'multi');
            } else if (questionType === 'matching') {
                addMatchingPair();
            } else if (questionType === 'ordering') {
                addOrderingItem();
            }
        }

        let optionCounter = 0;
        function addOption(type) {
            optionCounter++;
            const optionsContainer = document.getElementById('optionsContainer');
            const optionId = `option-${optionCounter}`;
            const inputType = type === 'single' ? 'radio' : 'checkbox';

            const optionDiv = document.createElement('div');
            optionDiv.className = 'option-item w-full'; /* Added w-full */
            optionDiv.innerHTML = `
                <input type="${inputType}" id="${optionId}" name="${type === 'single' ? 'correctOption' : 'correctOptions[]'}" value="${optionId}" class="form-${inputType}">
                <input type="text" id="optionText-${optionId}" class="form-control flex-grow" placeholder="Option Text" required>
                <button type="button" class="remove-button" onclick="removeElement('${optionId}')">
                    <i class="fas fa-times-circle"></i>
                </button>
            `;
            optionDiv.id = optionId; // Set the ID on the div for easy removal
            optionsContainer.appendChild(optionDiv);
        }

        let pairCounter = 0;
        function addMatchingPair() {
            pairCounter++;
            const pairsContainer = document.getElementById('matchingPairsContainer');
            const pairId = `pair-${pairCounter}`;

            const pairDiv = document.createElement('div');
            pairDiv.className = 'pair-item w-full'; /* Added w-full */
            pairDiv.innerHTML = `
                <input type="text" id="itemA-${pairId}" class="form-control" placeholder="Item A" required>
                <i class="fas fa-link text-gray-400"></i>
                <input type="text" id="itemB-${pairId}" class="form-control" placeholder="Item B" required>
                <button type="button" class="remove-button" onclick="removeElement('${pairId}')">
                    <i class="fas fa-times-circle"></i>
                </button>
            `;
            pairDiv.id = pairId;
            pairsContainer.appendChild(pairDiv);
        }

        let orderCounter = 0;
        function addOrderingItem() {
            orderCounter++;
            const itemsContainer = document.getElementById('orderingItemsContainer');
            const itemId = `order-item-${orderCounter}`;

            const itemDiv = document.createElement('div');
            itemDiv.className = 'order-item w-full'; /* Added w-full */
            itemDiv.innerHTML = `
                <span class="text-gray-400 font-bold">${orderCounter}.</span>
                <input type="text" id="itemText-${itemId}" class="form-control flex-grow" placeholder="Enter item in correct order" required>
                <button type="button" class="remove-button" onclick="removeElement('${itemId}')">
                    <i class="fas fa-times-circle"></i>
                </button>
            `;
            itemDiv.id = itemId;
            itemsContainer.appendChild(itemDiv);
        }

        function removeElement(id) {
            const elementToRemove = document.getElementById(id);
            if (elementToRemove) {
                elementToRemove.remove();
            }
        }

        function handleFormSubmission(event) {
            event.preventDefault(); // Prevent default form submission

            const subject = document.getElementById('subject').value;
            const intendedClass = document.getElementById('intendedClass').value;
            const maxBytesReward = parseInt(document.getElementById('maxBytesReward').value, 10);
            const instructions = document.getElementById('instructions').value.trim();
            const hint = document.getElementById('hint').value.trim();
            const questionType = document.getElementById('questionType').value;

            // Initial general validation
            if (!subject || !intendedClass || isNaN(maxBytesReward) || questionType === '') {
                showMessageBox('Validation Error', 'Please fill in all required general question details and select a question type.');
                return;
            }

            let quizData = {
                subject,
                intendedClass,
                type: questionType,
                maxBytesRewardPerQuestion: maxBytesReward
            };

            if (instructions) quizData.instructions = instructions;
            if (hint) quizData.hint = hint;

            let specificDataValid = true;
            let questionTextForPayload = ''; // Will hold the final questionText for quizData

            // Determine questionText and validate specific fields based on type
            switch (questionType) {
                case 'multiple-choice-single':
                case 'multiple-choice-multi':
                    questionTextForPayload = document.getElementById('questionText').value.trim();
                    if (!questionTextForPayload) {
                        showMessageBox('Validation Error', 'Please enter the question text.');
                        specificDataValid = false;
                        break;
                    }
                    const options = [];
                    const optionElements = document.querySelectorAll('#optionsContainer .option-item');
                    let correctCount = 0;

                    if (optionElements.length === 0) {
                        showMessageBox('Validation Error', 'Please add at least one option for multiple choice questions.');
                        specificDataValid = false;
                        break;
                    }

                    optionElements.forEach(optionDiv => {
                        const optionText = optionDiv.querySelector('input[type="text"]').value.trim();
                        const isCorrect = optionDiv.querySelector('input').checked;

                        if (!optionText) {
                            specificDataValid = false;
                            return; 
                        }
                        options.push({ text: optionText, isCorrect });
                        if (isCorrect) correctCount++;
                    });

                    if (!specificDataValid) { 
                        showMessageBox('Validation Error', 'All option texts must be filled.');
                        break;
                    }
                    if (questionType === 'multiple-choice-single' && correctCount !== 1) {
                        showMessageBox('Validation Error', 'For single choice, exactly one option must be marked as correct.');
                        specificDataValid = false;
                    } else if (questionType === 'multiple-choice-multi' && correctCount < 1) {
                        showMessageBox('Validation Error', 'For multiple choice (multi-select), at least one option must be marked as correct.');
                        specificDataValid = false;
                    }
                    quizData.options = options;
                    break;

                case 'short-answer':
                case 'problem-solving':
                    questionTextForPayload = document.getElementById('questionText').value.trim();
                    if (!questionTextForPayload) {
                        showMessageBox('Validation Error', 'Please enter the question text.');
                        specificDataValid = false;
                        break;
                    }
                    const correctAnswersSA = document.getElementById('correctAnswers').value.split(',').map(ans => ans.trim()).filter(ans => ans !== '');
                    if (correctAnswersSA.length === 0) {
                        showMessageBox('Validation Error', 'Please provide at least one correct answer.');
                        specificDataValid = false;
                        break;
                    }
                    quizData.correctAnswers = correctAnswersSA;
                    break;

                case 'true-false':
                    questionTextForPayload = document.getElementById('questionText').value.trim();
                    if (!questionTextForPayload) {
                        showMessageBox('Validation Error', 'Please enter the question text.');
                        specificDataValid = false;
                        break;
                    }
                    const trueFalseAnswer = document.querySelector('input[name="trueFalseAnswer"]:checked');
                    if (!trueFalseAnswer) {
                        showMessageBox('Validation Error', 'Please select either True or False as the correct answer.');
                        specificDataValid = false;
                        break;
                    }
                    quizData.correctAnswers = [trueFalseAnswer.value];
                    break;

                case 'fill-in-the-blank':
                    questionTextForPayload = document.getElementById('blankQuestionText').value.trim();
                    const blankCorrectAnswer = document.getElementById('blankCorrectAnswer').value.trim();
                    if (!questionTextForPayload || !questionTextForPayload.includes('[BLANK]')) {
                        showMessageBox('Validation Error', 'Please enter question text with a [BLANK] placeholder.');
                        specificDataValid = false;
                        break;
                    }
                    if (!blankCorrectAnswer) {
                        showMessageBox('Validation Error', 'Please provide the correct answer for the blank.');
                        specificDataValid = false;
                        break;
                    }
                    quizData.correctAnswers = [blankCorrectAnswer]; 
                    break;

                case 'matching':
                    questionTextForPayload = document.getElementById('questionText').value.trim();
                    if (!questionTextForPayload) {
                        showMessageBox('Validation Error', 'Please enter the instructions for matching.');
                        specificDataValid = false;
                        break;
                    }
                    const matchingPairs = [];
                    const pairElements = document.querySelectorAll('#matchingPairsContainer .pair-item');
                    if (pairElements.length === 0) {
                        showMessageBox('Validation Error', 'Please add at least one matching pair.');
                        specificDataValid = false;
                        break;
                    }
                    pairElements.forEach(pairDiv => {
                        const itemA = pairDiv.querySelector('input[id^="itemA-"]').value.trim();
                        const itemB = pairDiv.querySelector('input[id^="itemB-"]').value.trim();
                        if (!itemA || !itemB) {
                            specificDataValid = false; 
                            return;
                        }
                        matchingPairs.push({ itemA, itemB });
                    });
                    if (!specificDataValid) { 
                        showMessageBox('Validation Error', 'All matching items must be filled.');
                        break;
                    }
                    quizData.matchingPairs = matchingPairs;
                    break;

                case 'ordering':
                    questionTextForPayload = document.getElementById('questionText').value.trim();
                    if (!questionTextForPayload) {
                        showMessageBox('Validation Error', 'Please enter the instructions for ordering.');
                        specificDataValid = false;
                        break;
                    }
                    const orderedItems = [];
                    const itemElements = document.querySelectorAll('#orderingItemsContainer .order-item');
                    if (itemElements.length === 0) {
                        showMessageBox('Validation Error', 'Please add at least one item for ordering.');
                        specificDataValid = false;
                        break;
                    }
                    itemElements.forEach(itemDiv => {
                        const itemText = itemDiv.querySelector('input[type="text"]').value.trim();
                        if (!itemText) {
                            specificDataValid = false; 
                            return;
                        }
                        orderedItems.push(itemText);
                    });
                    if (!specificDataValid) { 
                        showMessageBox('Validation Error', 'All ordering items must be filled.');
                        break;
                    }
                    quizData.orderedItems = orderedItems;
                    break;

                case 'numeric-entry':
                    questionTextForPayload = document.getElementById('questionText').value.trim();
                    if (!questionTextForPayload) {
                        showMessageBox('Validation Error', 'Please enter the question text.');
                        specificDataValid = false;
                        break;
                    }
                    const numericAnswer = document.getElementById('numericAnswer').value.trim();
                    if (!numericAnswer || isNaN(parseFloat(numericAnswer))) {
                        showMessageBox('Validation Error', 'Please enter a valid numeric answer.');
                        specificDataValid = false;
                        break;
                    }
                    quizData.correctAnswers = [numericAnswer]; 
                    break;

                default:
                    showMessageBox('Error', 'Invalid question type selected. Please choose one from the list.');
                    specificDataValid = false;
                    break;
            }

            if (!specificDataValid) {
                return; 
            }

            quizData.questionText = questionTextForPayload;

            console.log('Quiz Question Data Prepared:', quizData);
            showMessageBox('Success', 'Quiz question data prepared for submission! Check console for payload.');

            // --- Simulating Backend Submission ---
            /*
            fetch('/teacher/upload-quiz-question', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer YOUR_TEACHER_AUTH_TOKEN` 
                },
                body: JSON.stringify(quizData)
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => { throw new Error(err.message || 'Server error'); });
                }
                return response.json();
            })
            .then(data => {
                if (data.success) { 
                    showMessageBox('Success', 'Quiz question uploaded successfully!');
                    quizUploadForm.reset(); 
                    renderQuestionTypeFields(); 
                } else {
                    showMessageBox('Upload Failed', data.message || 'Something went wrong during upload.');
                }
            })
            .catch(error => {
                console.error('Error uploading quiz:', error);
                showMessageBox('Network Error', error.message || 'Could not connect to the server. Please try again.');
            });
            */
        }

        // Custom Message Box Functions
        function showMessageBox(title, message) {
            const overlay = document.getElementById('messageBoxOverlay');
            const titleElement = document.getElementById('messageBoxTitle');
            const contentElement = document.getElementById('messageBoxContent');

            titleElement.textContent = title;
            contentElement.textContent = message;

            // Set color based on title (simple heuristic)
            if (title.includes('Success')) {
                titleElement.style.color = '#2ecc71'; // Green for success
            } else {
                titleElement.style.color = '#e74c3c'; // Red for error/validation
            }
            overlay.classList.add('show');
        }

        function hideMessageBox() {
            document.getElementById('messageBoxOverlay').classList.remove('show');
        }
    </script>
</body>
