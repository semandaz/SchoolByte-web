<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolByte – Activity of Integration Library</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3498db;
            --secondary: #2c3e50;
            --accent: #2980b9;
            --bg: #1a2535;
            --text: #ecf0f1;
            --border: rgba(127,140,163,0.3);
            --success: #2ecc71;
            --warning: #f39c12;
            --danger: #e74c3c;
            --muted: #95a5a6;
            --card-bg: rgba(30,42,60,0.85);
        }
        * { margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',sans-serif; }
        body { background: linear-gradient(135deg,#1a2535,#0f1923); min-height:100vh; color:var(--text); }

        header {
            background: rgba(20,30,45,0.97);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size:20px;font-weight:800;color:var(--primary); }
        .header-right { display:flex;align-items:center;gap:12px; }
        .btn-back {
            display:inline-flex;align-items:center;gap:8px;padding:8px 16px;
            background:rgba(52,152,219,0.15);color:var(--primary);border:1px solid rgba(52,152,219,0.3);
            border-radius:8px;text-decoration:none;font-size:13px;font-weight:600;transition:all 0.2s;
        }
        .btn-back:hover { background:var(--primary);color:#fff; }
        #teacherGreeting { font-size:13px;color:var(--muted); }

        .container { max-width:1100px;margin:0 auto;padding:24px; }

        .page-title {
            font-size:20px;font-weight:700;margin-bottom:24px;
            display:flex;align-items:center;gap:10px;
        }
        .page-title i { color:var(--primary); }

        /* TABS */
        .tab-bar { display:flex;gap:0;background:rgba(255,255,255,0.05);border-radius:10px;padding:3px;width:fit-content;margin-bottom:24px; }
        .tab-btn { padding:9px 24px;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;transition:all 0.2s; }
        .tab-btn.active { background:var(--primary);color:#fff; }
        .tab-panel { display:none; }
        .tab-panel.active { display:block; }

        /* CARD */
        .card { background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:20px; }
        .card-title { font-size:15px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:8px; }
        .card-title i { color:var(--primary); }

        /* FORM */
        .form-grid { display:grid;grid-template-columns:1fr 1fr;gap:14px; }
        @media(max-width:640px){.form-grid{grid-template-columns:1fr;}}
        .form-group { display:flex;flex-direction:column;gap:5px; }
        .form-group.full { grid-column:1/-1; }
        label { font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em; }
        input,select,textarea {
            padding:9px 12px;border:1px solid var(--border);border-radius:8px;
            background:rgba(255,255,255,0.06);color:var(--text);font-size:13px;font-family:inherit;
            outline:none;transition:border-color 0.2s;
        }
        input:focus,select:focus,textarea:focus { border-color:var(--primary); }
        select option { background:#2c3e50; }

        /* BTN */
        .btn { padding:9px 18px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all 0.2s; }
        .btn-primary { background:var(--primary);color:#fff; }
        .btn-primary:hover { background:var(--accent); }
        .btn-success { background:rgba(46,204,113,0.15);color:var(--success);border:1px solid rgba(46,204,113,0.3); }
        .btn-success:hover { background:var(--success);color:#fff; }
        .btn-warning { background:rgba(243,156,18,0.15);color:var(--warning);border:1px solid rgba(243,156,18,0.3); }
        .btn-warning:hover { background:var(--warning);color:#fff; }
        .btn-danger { background:rgba(231,76,60,0.15);color:var(--danger);border:1px solid rgba(231,76,60,0.3); }
        .btn-danger:hover { background:var(--danger);color:#fff; }
        .btn-sm { padding:6px 12px;font-size:12px;border-radius:6px; }
        .btn-full { width:100%;justify-content:center;margin-top:14px; }

        /* BADGE */
        .badge { display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700; }
        .badge-blue { background:rgba(52,152,219,0.2);color:var(--primary);border:1px solid rgba(52,152,219,0.3); }
        .badge-gray { background:rgba(127,140,163,0.15);color:var(--muted); }
        .badge-green { background:rgba(46,204,113,0.2);color:var(--success);border:1px solid rgba(46,204,113,0.3); }
        .badge-red { background:rgba(231,76,60,0.2);color:var(--danger);border:1px solid rgba(231,76,60,0.3); }

        /* LIBRARY */
        .toolbar { display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px; }
        .lib-sort { padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,0.06);color:var(--text);font-size:13px;outline:none; }
        .lib-sort option { background:#2c3e50; }
        .lib-count { margin-left:auto;font-size:13px;color:var(--muted);font-weight:600; }

        .activity-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px; }
        .activity-card { background:rgba(20,30,45,0.8);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;transition:border-color 0.2s; }
        .activity-card:hover { border-color:var(--primary); }
        .activity-title { font-weight:700;font-size:14px;color:var(--text);line-height:1.4; }
        .activity-badge-row { display:flex;gap:6px;flex-wrap:wrap;align-items:center; }
        .activity-preview { font-size:12px;color:var(--muted);line-height:1.6;border-top:1px solid var(--border);padding-top:10px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical; }
        .activity-meta { font-size:11px;color:var(--muted); }
        .activity-footer { display:flex;gap:8px;border-top:1px solid var(--border);padding-top:10px;flex-wrap:wrap; }

        /* APPROVED STATUS */
        .approved-tick { color:var(--success);font-weight:700;font-size:12px; }
        .not-approved { color:var(--danger);font-weight:700;font-size:12px; }

        /* MODAL */
        .modal-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);z-index:1000;align-items:center;justify-content:center;padding:1rem; }
        .modal-overlay.open { display:flex; }
        .modal-box { background:#1a2535;border:1px solid var(--border);border-radius:16px;padding:26px;width:100%;max-width:680px;max-height:90vh;overflow-y:auto;position:relative;box-shadow:0 24px 60px rgba(0,0,0,0.5); }
        .modal-close { position:absolute;top:14px;right:18px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer; }
        .modal-title { font-size:16px;font-weight:700;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border); }
        .modal-content-text { font-size:13px;color:var(--text);line-height:1.9;white-space:pre-wrap;word-break:break-word; }

        .construct-toggle { display:grid;grid-template-columns:1fr 1fr;gap:12px; }
        .construct-option { border:1.5px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;transition:all 0.2s;display:flex;gap:10px;align-items:flex-start; }
        .construct-option:hover { border-color:var(--primary); }
        .construct-option.selected { border-color:var(--primary);background:rgba(52,152,219,0.1); }
        .construct-option input[type=radio] { margin-top:2px;accent-color:var(--primary); }
        .construct-option .opt-label { font-weight:700;font-size:13px;color:var(--text); }
        .construct-option .opt-desc { font-size:12px;color:var(--muted);margin-top:3px; }

        .spinner { display:inline-block;width:16px;height:16px;border:2px solid rgba(52,152,219,0.3);border-top-color:var(--primary);border-radius:50%;animation:spin 0.7s linear infinite; }
        @keyframes spin { to{transform:rotate(360deg);} }

        #toastContainer { position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px; }
        .toast { padding:11px 18px;border-radius:9px;font-size:13px;font-weight:600;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,0.3);display:flex;align-items:center;gap:8px;animation:slideIn 0.3s ease; }
        .toast.success { background:#1d6a3b; } .toast.error { background:#922b21; } .toast.info { background:#1a5276; }
        @keyframes slideIn { from{transform:translateX(50px);opacity:0;}to{transform:none;opacity:1;} }
        .empty-state { text-align:center;padding:40px;color:var(--muted); }
        .empty-state i { font-size:30px;margin-bottom:10px;display:block;opacity:0.4; }
    </style>
</head>
<body>

<header>
    <span class="logo">SchoolByte</span>
    <div class="header-right">
        <span id="teacherGreeting"></span>
        <a href="teacherdashboard.html" class="btn-back"><i class="fas fa-arrow-left"></i> Dashboard</a>
    </div>
</header>

<div class="container">
    <div class="page-title"><i class="fas fa-project-diagram"></i> Activity of Integration</div>

    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('library-tab',this)"><i class="fas fa-book-open"></i> Library</button>
        <button class="tab-btn" onclick="switchTab('upload-tab',this)"><i class="fas fa-upload"></i> Upload Scenario</button>
    </div>

    <!-- LIBRARY TAB -->
    <div id="library-tab" class="tab-panel active">
        <div class="card">
            <div class="card-title"><i class="fas fa-book-open"></i> All Activities</div>
            <div class="toolbar">
                <select class="lib-sort" id="libSort" onchange="loadLibrary()">
                    <option value="date">Newest First</option>
                    <option value="approved">Approved First</option>
                    <option value="helpful">Most Helpful</option>
                </select>
                <select class="lib-sort" id="libFilter" onchange="loadLibrary()">
                    <option value="">All Activities</option>
                    <option value="approved">Approved Only</option>
                </select>
                <button class="btn btn-sm" style="background:rgba(255,255,255,0.06);color:var(--muted);border:1px solid var(--border);" onclick="loadLibrary()"><i class="fas fa-sync-alt"></i></button>
                <span class="lib-count" id="libCount"></span>
            </div>
            <div id="libraryContent">
                <div class="empty-state"><span class="spinner"></span></div>
            </div>
        </div>
    </div>

    <!-- UPLOAD TAB -->
    <div id="upload-tab" class="tab-panel">
        <div class="card">
            <div class="card-title"><i class="fas fa-upload"></i> Upload Activity of Integration</div>
            <p style="font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.7;">
                Teacher-uploaded activities are automatically approved and marked with a green tick. They will appear in the library immediately.
            </p>
            <div class="form-grid">
                <div class="form-group full">
                    <label>Title *</label>
                    <input type="text" id="upTitle" placeholder="e.g. S2 Biology – Nutrition and Soil Conservation">
                </div>
                <div class="form-group">
                    <label>Subject *</label>
                    <input type="text" id="upSubject" placeholder="e.g. Biology, Mathematics...">
                </div>
                <div class="form-group">
                    <label>Senior Class *</label>
                    <select id="upClass">
                        <option value="">Select class</option>
                        <option>S.1</option><option>S.2</option><option>S.3</option>
                        <option>S.4</option><option>S.5</option><option>S.6</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Topic *</label>
                    <input type="text" id="upTopic" placeholder="e.g. Transport in Plants">
                </div>
                <div class="form-group">
                    <label>Number of Scenarios</label>
                    <input type="number" id="upCount" value="1" min="1" max="10">
                </div>
                <div class="form-group full">
                    <label>Element of Construct</label>
                    <div class="construct-toggle">
                        <label class="construct-option selected" id="up-opt-one">
                            <input type="radio" name="upconstruct" value="one-topic" checked onchange="upSelectConstruct(this)">
                            <div>
                                <div class="opt-label"><i class="fas fa-bullseye"></i> One Topic</div>
                                <div class="opt-desc">Deep, focused exploration of a single topic.</div>
                            </div>
                        </label>
                        <label class="construct-option" id="up-opt-many">
                            <input type="radio" name="upconstruct" value="many-topics" onchange="upSelectConstruct(this)">
                            <div>
                                <div class="opt-label"><i class="fas fa-layer-group"></i> Element of Construct</div>
                                <div class="opt-desc">Cross-topic integration around a central theme.</div>
                            </div>
                        </label>
                    </div>
                </div>
                <div class="form-group full">
                    <label>Scenarios Content *</label>
                    <textarea id="upContent" rows="12" placeholder="Paste or write your CBC scenario activity here. Follow the standard format:&#10;&#10;---SCENARIO 1---&#10;**Title:** ...&#10;**Linked Competency:** ...&#10;**Scenario Description:** ...&#10;**Suggested Activities:** ...&#10;**Assessment Rubric:** ...&#10;---END SCENARIO 1---"></textarea>
                </div>
            </div>
            <button class="btn btn-primary btn-full" id="uploadBtn" onclick="uploadActivity()">
                <i class="fas fa-upload"></i> Upload Activity
            </button>
        </div>
    </div>
</div>

<!-- VIEW MODAL -->
<div id="viewModal" class="modal-overlay">
    <div class="modal-box">
        <button class="modal-close" onclick="closeViewModal()">&times;</button>
        <div class="modal-title" id="viewModalTitle"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;" id="viewModalBadges"></div>
        <div class="modal-content-text" id="viewModalContent"></div>
    </div>
</div>

<div id="toastContainer"></div>

<script>
const token = () => localStorage.getItem('token');

function showToast(msg, type='success') {
    const icons = { success:'fa-check-circle', error:'fa-exclamation-circle', info:'fa-info-circle' };
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    t.innerHTML = '<i class="fas ' + (icons[type]||'fa-circle') + '"></i> ' + msg;
    document.getElementById('toastContainer').appendChild(t);
    setTimeout(() => { t.style.opacity='0';t.style.transition='opacity 0.4s';setTimeout(()=>t.remove(),400); }, 4000);
}
function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Auth check
(async function init() {
    const t = token();
    if (!t) { window.location.href = 'teacherlogin.html'; return; }
    try {
        const r = await fetch('/teacher/dashboard', { headers: { Authorization: 'Bearer ' + t } });
        if (!r.ok) { window.location.href = 'teacherlogin.html'; return; }
        const d = await r.json();
        document.getElementById('teacherGreeting').textContent = d.teacher?.teacherName || 'Teacher';
        loadLibrary();
    } catch { window.location.href = 'teacherlogin.html'; }
})();

function switchTab(id, btn) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (btn) btn.classList.add('active');
    if (id === 'library-tab') loadLibrary();
}

function upSelectConstruct(radio) {
    document.getElementById('up-opt-one').classList.remove('selected');
    document.getElementById('up-opt-many').classList.remove('selected');
    if (radio.value === 'one-topic') document.getElementById('up-opt-one').classList.add('selected');
    else document.getElementById('up-opt-many').classList.add('selected');
}

async function loadLibrary() {
    const sort = document.getElementById('libSort').value;
    const filter = document.getElementById('libFilter').value;
    const content = document.getElementById('libraryContent');
    content.innerHTML = '<div class="empty-state"><span class="spinner"></span></div>';
    try {
        let url = '/teacher/activities-of-integration/library?sort=' + sort;
        if (filter) url += '&filter=' + filter;
        const r = await fetch(url, { headers: { Authorization: 'Bearer ' + token() } });
        if (!r.ok) throw new Error();
        const { activities } = await r.json();
        const cnt = document.getElementById('libCount');
        if (cnt) cnt.textContent = activities.length + ' activit' + (activities.length===1?'y':'ies');
        if (!activities.length) {
            content.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i>No activities in the library yet.</div>';
            return;
        }
        content.innerHTML = '<div class="activity-grid">' + activities.map(a => renderCard(a)).join('') + '</div>';
    } catch {
        content.innerHTML = '<div class="empty-state" style="color:var(--danger);"><i class="fas fa-exclamation-triangle"></i>Failed to load library.</div>';
    }
}

function renderCard(a) {
    const approvedStatus = a.isApproved
        ? '<span class="approved-tick"><i class="fas fa-check-circle"></i> Approved</span>'
        : '<span class="not-approved">Not yet Approved</span>';
    const approvedBadge = a.isApproved
        ? '<span class="badge badge-green"><i class="fas fa-check-circle"></i> Approved</span>'
        : '<span class="badge badge-red">Not yet Approved</span>';
    const preview = (a.scenariosContent||'').slice(0,200).replace(/\n/g,' ');
    const createdDate = a.createdAt ? new Date(a.createdAt).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '';
    const byLabel = a.createdByType === 'teacher' ? '<i class="fas fa-chalkboard-teacher"></i>' : '<i class="fas fa-robot"></i>';
    const approveBtn = !a.isApproved
        ? `<button class="btn btn-success btn-sm" onclick="approveActivity('${a._id}')"><i class="fas fa-check"></i> Approve</button>`
        : '';
    return `<div class="activity-card">
        <div class="activity-title">${esc(a.title)}</div>
        <div class="activity-badge-row">
            <span class="badge badge-blue">${esc(a.subject)}</span>
            <span class="badge badge-gray">${esc(a.seniorClass)}</span>
            ${approvedBadge}
        </div>
        <div style="font-size:12px;color:var(--muted);">Topic: ${esc(a.topic)} · ${a.elementOfConstruct==='many-topics'?'Many Topics':'One Topic'}</div>
        <div class="activity-preview">${esc(preview)}${a.scenariosContent&&a.scenariosContent.length>200?'…':''}</div>
        <div class="activity-meta">${byLabel} ${esc(a.createdByName)} · ${createdDate} · <i class="fas fa-thumbs-up"></i> ${a.helpfulCount||0}</div>
        <div class="activity-footer">
            <button class="btn btn-sm" style="background:rgba(255,255,255,0.06);color:var(--text);border:1px solid var(--border);" onclick="viewActivity(${JSON.stringify(esc(a.title))},${JSON.stringify(esc(a.subject)+' · '+esc(a.seniorClass))},${JSON.stringify(a.scenariosContent||'')})">
                <i class="fas fa-eye"></i> View
            </button>
            ${approveBtn}
        </div>
    </div>`;
}

async function approveActivity(id) {
    try {
        const r = await fetch('/teacher/activities-of-integration/' + id + '/approve', {
            method: 'PUT', headers: { Authorization: 'Bearer ' + token() }
        });
        if (!r.ok) throw new Error();
        showToast('Activity approved!', 'success');
        loadLibrary();
    } catch { showToast('Failed to approve.', 'error'); }
}

async function uploadActivity() {
    const title = document.getElementById('upTitle').value.trim();
    const subject = document.getElementById('upSubject').value.trim();
    const seniorClass = document.getElementById('upClass').value;
    const topic = document.getElementById('upTopic').value.trim();
    const numberOfScenarios = parseInt(document.getElementById('upCount').value) || 1;
    const elementOfConstruct = document.querySelector('input[name=upconstruct]:checked')?.value || 'one-topic';
    const scenariosContent = document.getElementById('upContent').value.trim();

    if (!title) { showToast('Title is required.', 'error'); return; }
    if (!subject) { showToast('Subject is required.', 'error'); return; }
    if (!seniorClass) { showToast('Please select a class.', 'error'); return; }
    if (!topic) { showToast('Topic is required.', 'error'); return; }
    if (!scenariosContent) { showToast('Scenarios content is required.', 'error'); return; }

    const btn = document.getElementById('uploadBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Uploading...';

    try {
        const r = await fetch('/teacher/activities-of-integration/upload', {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + token(), 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, subject, seniorClass, topic, numberOfScenarios, elementOfConstruct, scenariosContent })
        });
        if (!r.ok) { const d = await r.json(); throw new Error(d.error || 'Upload failed'); }
        showToast('Activity uploaded and automatically approved!', 'success');
        document.getElementById('upTitle').value = '';
        document.getElementById('upSubject').value = '';
        document.getElementById('upClass').value = '';
        document.getElementById('upTopic').value = '';
        document.getElementById('upCount').value = '1';
        document.getElementById('upContent').value = '';
        switchTab('library-tab', document.querySelectorAll('.tab-btn')[0]);
    } catch (e) { showToast(e.message || 'Upload failed.', 'error'); }
    finally { btn.disabled=false; btn.innerHTML='<i class="fas fa-upload"></i> Upload Activity'; }
}

function viewActivity(title, badges, content) {
    document.getElementById('viewModalTitle').textContent = title;
    document.getElementById('viewModalBadges').innerHTML = badges.split(' · ').map(b => '<span class="badge badge-gray">' + b + '</span>').join('');
    document.getElementById('viewModalContent').textContent = content;
    document.getElementById('viewModal').classList.add('open');
}
function closeViewModal() { document.getElementById('viewModal').classList.remove('open'); }
document.getElementById('viewModal').addEventListener('click', function(e){ if(e.target===this) closeViewModal(); });
</script>
</body>
</html>
