        <script>
            document.addEventListener("DOMContentLoaded", function () {
                // Initialize elements
                const teacherNameDisplay =
                    document.getElementById("teacherNameDisplay");
                const welcomeMessage =
                    document.getElementById("welcomeMessage");
                const resourceCountElement =
                    document.getElementById("resourceCount");
                const loadingMessage =
                    document.getElementById("loadingMessage");
                const errorMessage = document.getElementById("errorMessage");
                const mainContent = document.getElementById("mainContent");
                const signOutBtn = document.getElementById("signOutBtn");
                const uploadContentBtn =
                    document.getElementById("uploadContentBtn");
                const manageStudentsBtn =
                    document.getElementById("manageStudentsBtn");
                const toggleFeed = document.getElementById("toggleFeed");
                const activityFeed = document.getElementById("activityFeed");
                const feedItems = document.getElementById("feedItems");
                const floatingParticles =
                    document.getElementById("floatingParticles");

                // Function to fetch teacher data from server
                async function fetchTeacherData() {
                    try {
                        const token = localStorage.getItem('token');
                        if (!token) {
                            window.location.href = 'teacherlogin.html';
                            return;
                        }

                        const response = await fetch(`${window.location.origin}/teacher/dashboard`, {
                            method: 'GET',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            }
                        });

                        if (response.ok) {
                            const data = await response.json();
                            const teacher = data.teacher;

                            // Update display with real data
                            teacherNameDisplay.textContent = teacher.teacherName;
                            welcomeMessage.textContent = `Welcome, ${teacher.teacherName}. Ready to inspire today?`;
                            resourceCountElement.textContent = teacher.bytes || 0;

                            // Store data locally for quick access
                            localStorage.setItem('userData', JSON.stringify(teacher));

                            // Hide loading and show content
                            loadingMessage.classList.add('hidden');
                            mainContent.classList.remove('hidden');

                        } else if (response.status === 401 || response.status === 403) {
                            // Token is invalid or expired
                            localStorage.removeItem('token');
                            localStorage.removeItem('userData');
                            window.location.href = 'teacherlogin.html';
                        } else {
                            throw new Error('Failed to fetch teacher data');
                        }
                    } catch (error) {
                        console.error('Error fetching teacher data:', error);
                        errorMessage.querySelector('.error-message').textContent = 'Failed to load dashboard. Please try refreshing the page.';
                        loadingMessage.classList.add('hidden');
                        errorMessage.classList.remove('hidden');
                    }
                }

                // Initialize dashboard
                fetchTeacherData();

                // Upload content button click
                uploadContentBtn.addEventListener("click", function () {
                    window.location.href = 'teacher-upload-content.html';
                });

                // Upload Quizzes button click
                manageStudentsBtn.addEventListener("click", function () {
                    addActivity("Reviewed student submissions", "student");
                    addResources(2);

                    // Redirect to student management
                    setTimeout(() => {
                        window.location.href = "studentmanagement.html";
                    }, 800);
                });

                // Sign out function
                signOutBtn.addEventListener("click", function () {
                    // Clear teacher-related data
                    localStorage.removeItem("teacherToken");

                    // Redirect to login page
                    window.location.href = "teacherlogin.html";
                });

                // Tooltip initialization
                document.querySelectorAll(".info-icon").forEach((icon) => {
                    icon.addEventListener("mouseenter", function () {
                        this.querySelector(".info-tooltip").style.opacity = "1";
                        this.querySelector(".info-tooltip").style.visibility =
                            "visible";
                    });

                    icon.addEventListener("mouseleave", function () {
                        this.querySelector(".info-tooltip").style.opacity = "0";
                        this.querySelector(".info-tooltip").style.visibility =
                            "hidden";
                    });
                });

                // Create particles on load
                createParticles();

                // Add initial activities
                setTimeout(() => {
                    addActivity("Welcome to Teacher Dashboard", "resource");
                    addActivity("Chemistry lesson plan updated", "subject");
                    addActivity("Biology quiz results reviewed", "student");
                }, 1500);
            });
        </script>
