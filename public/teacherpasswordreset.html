<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolByte - Reset Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2c3e50, #1a2530);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ecf0f1;
            padding: 20px;
            position: relative;
        }

        /* Animated Background Elements */
        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .shape {
            position: absolute;
            background: rgba(52, 152, 219, 0.1);
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        /* Main Container */
        .reset-container {
            width: 100%;
            max-width: 500px;
            background: rgba(30, 40, 56, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            border: 1px solid rgba(127, 140, 163, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            z-index: 10;
        }

        .reset-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        /* Header Section */
        .reset-header {
            background: linear-gradient(to right, #3498db, #2c3e50);
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .reset-header::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            transform: rotate(30deg);
        }

        .logo {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .reset-header h1 {
            position: relative;
            z-index: 2;
            font-weight: 500;
            font-size: 22px;
            letter-spacing: 0.5px;
            margin-top: 10px;
            color: rgba(255, 255, 255, 0.9);
        }

        /* Content Section */
        .reset-content {
            padding: 40px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(127, 140, 163, 0.3);
            gap: 10px;
        }

        .tab {
            flex: 1;
            padding: 12px 20px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #bdc3c7;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            background: none;
            border: none;
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .tab i {
            margin-right: 8px;
            font-size: 14px;
        }

        .tab.active {
            color: #3498db;
            border-bottom-color: #3498db;
        }

        .tab:hover:not(.active) {
            color: #ecf0f1;
        }

        /* Form Groups */
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #bdc3c7;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #3498db;
            font-size: 18px;
            z-index: 2;
        }

        .form-control {
            width: 100%;
            padding: 14px 15px 14px 50px;
            background: rgba(25, 35, 50, 0.6);
            border: 1px solid rgba(127, 140, 163, 0.3);
            border-radius: 10px;
            color: #ecf0f1;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-control:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
            background: rgba(30, 45, 65, 0.7);
        }

        .form-control::placeholder {
            color: rgba(189, 195, 199, 0.6);
        }

        /* Password Container */
        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #7f8c8d;
            cursor: pointer;
            font-size: 18px;
            transition: color 0.3s;
            z-index: 2;
        }

        .toggle-password:hover {
            color: #3498db;
        }

        /* Password Strength Indicator */
        .password-strength {
            margin-top: 8px;
            height: 4px;
            background: rgba(127, 140, 163, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .strength-text {
            font-size: 12px;
            margin-top: 5px;
            color: #7f8c8d;
        }

        /* Password Fields Container */
        .password-fields {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .password-fields.active {
            display: block;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #3498db, #2980b9);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(41, 128, 185, 0.3);
        }

        .btn:hover:not(:disabled) {
            background: linear-gradient(to right, #2980b9, #2573a7);
            box-shadow: 0 6px 20px rgba(41, 128, 185, 0.4);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Back to Login Link */
        .back-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #bdc3c7;
        }

        .back-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .back-link a:hover {
            color: #2980b9;
            text-decoration: underline;
        }

        /* Security Info */
        .security-info {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            font-size: 12px;
            color: #7f8c8d;
            padding-top: 20px;
            border-top: 1px solid rgba(127, 140, 163, 0.2);
        }

        .security-info i {
            color: #2ecc71;
        }

        /* Message Box */
        .message-box-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .message-box-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .message-box {
            background: #2c3e50;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 350px;
            width: 90%;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
            border: 1px solid rgba(52, 152, 219, 0.3);
        }

        .message-box-overlay.show .message-box {
            transform: translateY(0);
        }

        .message-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .message-icon.success {
            color: #2ecc71;
        }

        .message-icon.error {
            color: #e74c3c;
        }

        .message-icon.loading {
            color: #3498db;
            animation: spin 1s linear infinite;
        }

        .message-box p {
            font-size: 16px;
            margin-bottom: 20px;
            color: #ecf0f1;
        }

        .message-box button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.3s ease;
        }

        .message-box button:hover {
            background: #2980b9;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .form-group, .btn, .back-link {
            animation: fadeIn 0.5s ease-out;
            animation-fill-mode: both;
        }

        .form-group { animation-delay: 0.1s; }
        .btn { animation-delay: 0.2s; }
        .back-link { animation-delay: 0.3s; }

        /* Error Text */
        .error-text {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .error-text.show {
            display: block;
        }

        /* Loading Spinner */
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        /* Responsive */
        @media (max-width: 550px) {
            .reset-content {
                padding: 30px 20px;
            }

            .reset-header {
                padding: 25px 20px;
            }

            .logo-text {
                font-size: 24px;
            }

            .tab {
                font-size: 13px;
                padding: 10px;
            }

            .tab i {
                margin-right: 5px;
            }
        }
    </style>
</head>
<body>
    <!-- Background Shapes -->
    <div class="bg-shapes" id="bgShapes"></div>

    <!-- Main Container -->
    <div class="reset-container">
        <div class="reset-header">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <div class="logo-text">SchoolByte</div>
            </div>
            <h1>Reset Your Password</h1>
        </div>

        <div class="reset-content">
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" id="passwordTab">
                    <i class="fas fa-key"></i> Using Password
                </button>
                <button class="tab" id="emailTab">
                    <i class="fas fa-envelope"></i> Email Verification
                </button>
            </div>

            <!-- Password Reset Form (Using Old Password) -->
            <div id="passwordForm" class="form-content">
                <div class="form-group">
                    <label>Current Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <div class="password-container">
                            <input type="password" id="oldPassword" class="form-control" placeholder="Enter your current password">
                            <button type="button" class="toggle-password" data-target="oldPassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="error-text" id="oldPasswordError"></div>
                </div>

                <div class="form-group">
                    <label>New Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-shield-alt"></i>
                        <div class="password-container">
                            <input type="password" id="newPassword" class="form-control" placeholder="Enter new password (min. 6 characters)">
                            <button type="button" class="toggle-password" data-target="newPassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="strength-text" id="strengthText"></div>
                    <div class="error-text" id="newPasswordError"></div>
                </div>

                <div class="form-group">
                    <label>Confirm New Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-check-circle"></i>
                        <div class="password-container">
                            <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your new password">
                            <button type="button" class="toggle-password" data-target="confirmPassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="error-text" id="confirmPasswordError"></div>
                </div>

                <button id="changePasswordBtn" class="btn">Change Password</button>
            </div>

            <!-- Email Verification Form -->
            <div id="emailForm" class="form-content" style="display: none;">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" class="form-control" placeholder="your.email@school.edu">
                    </div>
                    <div class="error-text" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label>Verification Code</label>
                    <div class="input-with-icon">
                        <i class="fas fa-qrcode"></i>
                        <input type="text" id="verificationCode" class="form-control" placeholder="Enter 6-digit verification code" maxlength="6">
                    </div>
                    <div class="error-text" id="codeError"></div>
                </div>

                <div id="passwordFields" class="password-fields">
                    <div class="form-group">
                        <label>New Password</label>
                        <div class="input-with-icon">
                            <i class="fas fa-shield-alt"></i>
                            <div class="password-container">
                                <input type="password" id="newPasswordEmail" class="form-control" placeholder="Enter new password (min. 6 characters)">
                                <button type="button" class="toggle-password" data-target="newPasswordEmail">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="error-text" id="newPasswordEmailError"></div>
                    </div>

                    <div class="form-group">
                        <label>Confirm New Password</label>
                        <div class="input-with-icon">
                            <i class="fas fa-check-circle"></i>
                            <div class="password-container">
                                <input type="password" id="confirmPasswordEmail" class="form-control" placeholder="Confirm your new password">
                                <button type="button" class="toggle-password" data-target="confirmPasswordEmail">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="error-text" id="confirmPasswordEmailError"></div>
                    </div>
                </div>

                <button id="verifyEmailBtn" class="btn">Send Verification Code</button>
            </div>

            <!-- Back to Login -->
            <div class="back-link">
                <i class="fas fa-arrow-left"></i> <a href="teacherlogin.html">Back to Login</a>
            </div>

            <!-- Security Info -->
            <div class="security-info">
                <i class="fas fa-shield-alt"></i>
                <span>256-bit SSL encryption</span>
                <i class="fas fa-user-shield"></i>
                <span>GDPR compliant</span>
            </div>
        </div>
    </div>

    <!-- Message Box -->
    <div id="messageBoxOverlay" class="message-box-overlay">
        <div class="message-box">
            <div class="message-icon" id="messageIcon">
                <i class="fas fa-spinner"></i>
            </div>
            <p id="messageText">Processing...</p>
            <button id="messageBoxClose">OK</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Create background shapes
            createBackgroundShapes();

            // DOM Elements
            const elements = {
                passwordTab: document.getElementById('passwordTab'),
                emailTab: document.getElementById('emailTab'),
                passwordForm: document.getElementById('passwordForm'),
                emailForm: document.getElementById('emailForm'),
                oldPassword: document.getElementById('oldPassword'),
                newPassword: document.getElementById('newPassword'),
                confirmPassword: document.getElementById('confirmPassword'),
                changePasswordBtn: document.getElementById('changePasswordBtn'),
                email: document.getElementById('email'),
                verificationCode: document.getElementById('verificationCode'),
                newPasswordEmail: document.getElementById('newPasswordEmail'),
                confirmPasswordEmail: document.getElementById('confirmPasswordEmail'),
                verifyEmailBtn: document.getElementById('verifyEmailBtn'),
                passwordFields: document.getElementById('passwordFields'),
                messageBoxOverlay: document.getElementById('messageBoxOverlay'),
                messageIcon: document.getElementById('messageIcon'),
                messageText: document.getElementById('messageText'),
                messageBoxClose: document.getElementById('messageBoxClose')
            };

            // Create animated background shapes
            function createBackgroundShapes() {
                const container = document.getElementById('bgShapes');
                const shapeCount = 8;

                for (let i = 0; i < shapeCount; i++) {
                    const shape = document.createElement('div');
                    shape.classList.add('shape');
                    const size = Math.random() * 200 + 50;
                    shape.style.width = `${size}px`;
                    shape.style.height = `${size}px`;
                    shape.style.left = `${Math.random() * 100}%`;
                    shape.style.top = `${Math.random() * 100}%`;
                    shape.style.animationDelay = `${Math.random() * 10}s`;
                    shape.style.animationDuration = `${Math.random() * 15 + 10}s`;
                    container.appendChild(shape);
                }
            }

            // Password strength checker
            function checkPasswordStrength(password) {
                let strength = 0;
                const strengthBar = document.getElementById('strengthBar');
                const strengthText = document.getElementById('strengthText');

                if (!password) {
                    strengthBar.style.width = '0%';
                    strengthBar.style.backgroundColor = '';
                    strengthText.textContent = '';
                    return;
                }

                if (password.length >= 6) strength++;
                if (password.length >= 10) strength++;
                if (/[A-Z]/.test(password)) strength++;
                if (/[0-9]/.test(password)) strength++;
                if (/[^A-Za-z0-9]/.test(password)) strength++;

                const percentage = (strength / 5) * 100;
                strengthBar.style.width = `${percentage}%`;

                if (strength <= 2) {
                    strengthBar.style.backgroundColor = '#e74c3c';
                    strengthText.textContent = 'Weak password';
                    strengthText.style.color = '#e74c3c';
                } else if (strength <= 4) {
                    strengthBar.style.backgroundColor = '#f39c12';
                    strengthText.textContent = 'Medium password';
                    strengthText.style.color = '#f39c12';
                } else {
                    strengthBar.style.backgroundColor = '#2ecc71';
                    strengthText.textContent = 'Strong password';
                    strengthText.style.color = '#2ecc71';
                }
            }

            // Toggle password visibility
            document.querySelectorAll('.toggle-password').forEach(button => {
                button.addEventListener('click', function() {
                    const targetId = this.getAttribute('data-target');
                    const input = document.getElementById(targetId);
                    const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                    input.setAttribute('type', type);
                    this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
                });
            });

            // Tab switching
            elements.passwordTab.addEventListener('click', () => {
                elements.passwordTab.classList.add('active');
                elements.emailTab.classList.remove('active');
                elements.passwordForm.style.display = 'block';
                elements.emailForm.style.display = 'none';
                clearErrors();
            });

            elements.emailTab.addEventListener('click', () => {
                elements.emailTab.classList.add('active');
                elements.passwordTab.classList.remove('active');
                elements.emailForm.style.display = 'block';
                elements.passwordForm.style.display = 'none';
                clearErrors();
            });

            // Password strength monitoring
            elements.newPassword.addEventListener('input', () => {
                checkPasswordStrength(elements.newPassword.value);
            });

            elements.newPasswordEmail.addEventListener('input', () => {
                const strength = elements.newPasswordEmail.value;
                // Simple strength check for email form
                if (strength.length >= 6) {
                    document.getElementById('newPasswordEmailError').classList.remove('show');
                }
            });

            // Show password fields when verification code is entered
            elements.verificationCode.addEventListener('input', () => {
                if (elements.verificationCode.value.length >= 4) {
                    elements.passwordFields.classList.add('active');
                    elements.verifyEmailBtn.textContent = 'Reset Password';
                } else {
                    elements.passwordFields.classList.remove('active');
                    elements.verifyEmailBtn.textContent = 'Send Verification Code';
                }
            });

            // Clear all error messages
            function clearErrors() {
                const errorElements = document.querySelectorAll('.error-text');
                errorElements.forEach(el => el.classList.remove('show'));
            }

            // Show error message
            function showError(element, message) {
                element.textContent = message;
                element.classList.add('show');
            }

            // Show message box
            function showMessageBox(message, type = 'loading') {
                elements.messageText.textContent = message;
                const iconElement = elements.messageIcon.querySelector('i');

                if (type === 'success') {
                    iconElement.className = 'fas fa-check-circle';
                    elements.messageIcon.className = 'message-icon success';
                } else if (type === 'error') {
                    iconElement.className = 'fas fa-exclamation-circle';
                    elements.messageIcon.className = 'message-icon error';
                } else {
                    iconElement.className = 'fas fa-spinner';
                    elements.messageIcon.className = 'message-icon loading';
                }

                elements.messageBoxOverlay.classList.add('show');
            }

            // Hide message box
            function hideMessageBox() {
                elements.messageBoxOverlay.classList.remove('show');
            }

            // Close message box on OK button click
            elements.messageBoxClose.addEventListener('click', hideMessageBox);

            // Close on overlay click
            elements.messageBoxOverlay.addEventListener('click', (e) => {
                if (e.target === elements.messageBoxOverlay) {
                    hideMessageBox();
                }
            });

            // Password Change Handler (Using Old Password)
            async function changePasswordWithOldPassword() {
                clearErrors();

                const oldPassword = elements.oldPassword.value;
                const newPassword = elements.newPassword.value;
                const confirmPassword = elements.confirmPassword.value;

                let hasError = false;
                if (!oldPassword) { showError(document.getElementById('oldPasswordError'), 'Please enter your current password'); hasError = true; }
                if (!newPassword) { showError(document.getElementById('newPasswordError'), 'Please enter a new password'); hasError = true; }
                else if (newPassword.length < 6) { showError(document.getElementById('newPasswordError'), 'Password must be at least 6 characters'); hasError = true; }
                if (newPassword !== confirmPassword) { showError(document.getElementById('confirmPasswordError'), 'Passwords do not match'); hasError = true; }
                if (hasError) return;

                const token = localStorage.getItem('token');
                if (!token) {
                    showMessageBox('You must be logged in to change your password. Redirecting...', 'error');
                    setTimeout(() => { window.location.href = 'teacherlogin.html'; }, 2000);
                    return;
                }

                showMessageBox('Changing your password...', 'loading');
                try {
                    const response = await fetch('/teacher/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                        body: JSON.stringify({ oldPassword, newPassword })
                    });
                    let data = {};
                    try { data = await response.json(); } catch(e) { throw new Error('Unexpected server response.'); }
                    if (!response.ok) throw new Error(data.message || 'Failed to change password.');
                    hideMessageBox();
                    showMessageBox('✓ Password changed successfully! Redirecting to dashboard...', 'success');
                    setTimeout(() => { window.location.href = 'teacherdashboard.html'; }, 2000);
                } catch (error) {
                    hideMessageBox();
                    showMessageBox(error.message || 'Failed to change password. Please try again.', 'error');
                }
            }

            // Email Verification Handler
            let verificationCodeSent = false;

            async function handleEmailVerification() {
                clearErrors();

                const email = elements.email.value;
                const verificationCode = elements.verificationCode.value;
                const newPassword = elements.newPasswordEmail.value;
                const confirmPassword = elements.confirmPasswordEmail.value;

                if (!email) { showError(document.getElementById('emailError'), 'Please enter your email address'); return; }
                const emailRegex = /^[^s@]+@([^s@]+.)+[^s@]+$/;
                if (!emailRegex.test(email)) { showError(document.getElementById('emailError'), 'Please enter a valid email address'); return; }

                if (!verificationCode) {
                    showMessageBox('Sending verification code to your email...', 'loading');
                    try {
                        const response = await fetch('/teacher/send-password-reset-code', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email })
                        });
                        let data = {};
                        try { data = await response.json(); } catch(e) { throw new Error('Unexpected server response.'); }
                        if (!response.ok) throw new Error(data.message || 'Failed to send code.');
                        hideMessageBox();
                        showMessageBox('✓ If a teacher account exists with that email, a reset code has been sent. Check your inbox.', 'success');
                        setTimeout(() => { hideMessageBox(); elements.verificationCode.focus(); }, 3000);
                    } catch (error) {
                        hideMessageBox();
                        showMessageBox(error.message || 'Failed to send code. Please try again.', 'error');
                    }
                    return;
                }

                if (!elements.passwordFields.classList.contains('active')) {
                    showError(document.getElementById('codeError'), 'Please enter at least 4 digits of the code');
                    return;
                }

                if (!newPassword) { showError(document.getElementById('newPasswordEmailError'), 'Please enter a new password'); return; }
                if (newPassword.length < 6) { showError(document.getElementById('newPasswordEmailError'), 'Password must be at least 6 characters'); return; }
                if (newPassword !== confirmPassword) { showError(document.getElementById('confirmPasswordEmailError'), 'Passwords do not match'); return; }

                showMessageBox('Resetting your password...', 'loading');
                try {
                    const response = await fetch('/teacher/reset-password-with-code', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, code: verificationCode, newPassword })
                    });
                    let data = {};
                    try { data = await response.json(); } catch(e) { throw new Error('Unexpected server response.'); }
                    if (!response.ok) throw new Error(data.message || 'Failed to reset password.');
                    hideMessageBox();
                    showMessageBox('✓ Password reset successfully! Redirecting to login...', 'success');
                    setTimeout(() => { window.location.href = 'teacherlogin.html'; }, 2000);
                } catch (error) {
                    hideMessageBox();
                    showMessageBox(error.message || 'Failed to reset password. Please try again.', 'error');
                }
            }

            // Event Listeners
            elements.changePasswordBtn.addEventListener('click', changePasswordWithOldPassword);
            elements.verifyEmailBtn.addEventListener('click', handleEmailVerification);

            // Back to login link
            document.querySelector('.back-link a').addEventListener('click', (e) => {
                e.preventDefault();
                window.location.href = 'teacherlogin.html';
            });

            // Enter key support
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        if (elements.passwordForm.style.display !== 'none') {
                            changePasswordWithOldPassword();
                        } else {
                            handleEmailVerification();
                        }
                    }
                });
            });
        });
    </script>
</body>
</html>
