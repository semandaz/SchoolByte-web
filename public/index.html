<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchoolByte: Your Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <!-- Added for Font Awesome icons -->
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-image: linear-gradient(to bottom right, #e0e7ff, #f0f4f8);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem;
    }

    /* Disabled state styles */
    .disabled {
      background-color: #cbd5e1 !important;
      cursor: not-allowed;
    }

    .disabled-label {
      opacity: 0.6;
      cursor: not-allowed;
      pointer-events: none;
    }

    .disabled-label input[type="radio"] {
      cursor: not-allowed;
      accent-color: #94a3b8;
    }

    /* Focus styles */
    :focus-visible {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="w-full max-w-xl bg-white p-8 rounded-3xl shadow-xl space-y-6">
    <h1 class="text-6xl font-extrabold text-blue-900 text-center">SchoolByte</h1> <!-- Changed to text -->

    <div class="flex flex-col items-center">
      <!-- Replaced img tag with a clean SVG icon -->
      <div class="rounded-full mb-2 w-24 h-24 object-cover bg-blue-600 flex items-center justify-center text-white">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-16 h-16">
          <path fill-rule="evenodd" d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z" clip-rule="evenodd" />
        </svg>
      </div>
      <h2 class="text-2xl font-semibold text-blue-600 mb-1">Your Profile</h2>
    </div>

    <p class="text-gray-600 text-center text-base mb-4">Enter your details to personalize your academic experience.</p>

    <!-- School Name -->
    <div>
      <label for="schoolName" class="block text-lg font-semibold mb-1 text-gray-800">School Name:</label>
      <input type="text" id="schoolName" placeholder="e.g., Mengo Senior School" 
             class="w-full p-3 border border-gray-300 rounded-lg text-gray-700 text-base bg-gray-50 
                    focus:outline-none focus:ring-2 focus:ring-blue-500" required>
    </div>

    <!-- Role Selection -->
    <fieldset>
      <legend class="text-lg font-semibold mb-2 text-gray-800">Sign in as:</legend>
      <div class="space-y-2">
        <label class="flex items-center gap-3 cursor-pointer">
          <input type="radio" name="role" value="teacher" class="accent-blue-600 h-5 w-5" id="roleTeacher">
          <span class="text-base text-gray-700">Teacher</span>
        </label>
        <label class="flex items-center gap-3 cursor-pointer">
          <input type="radio" name="role" value="student" class="accent-blue-600 h-5 w-5" id="roleStudent">
          <span class="text-base text-gray-700">Student</span>
        </label>
      </div>
    </fieldset>

    <!-- Login/Signup Selection -->
    <fieldset>
      <legend class="text-lg font-semibold mb-2 text-gray-800">Login or Sign up</legend>
      <div class="space-y-2">
        <label class="flex items-center gap-3 cursor-pointer">
          <input type="radio" name="auth" value="login" class="accent-blue-600 h-5 w-5" id="authLogin">
          <span class="text-base text-gray-700">Log In</span>
        </label>
        <label class="flex items-center gap-3 cursor-pointer" id="signupLabel">
          <input type="radio" name="auth" value="signup" class="accent-blue-600 h-5 w-5" id="authSignup">
          <span class="text-base text-gray-700">Sign Up</span>
        </label>
      </div>
    </fieldset>

    <!-- Error Message Display -->
    <div id="errorMessage" class="text-red-600 text-center text-sm min-h-[1.25rem]" aria-live="polite"></div>

    <!-- Continue Button -->
    <div class="pt-4 text-right">
      <button id="continueBtn" disabled 
              class="disabled text-white font-bold py-3 px-6 rounded-lg transition-all duration-300 bg-blue-600
                     hover:bg-blue-700 focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2">
        Continue
      </button>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Cache DOM elements
      const elements = {
        schoolNameInput: document.getElementById('schoolName'),
        continueBtn: document.getElementById('continueBtn'),
        roleRadios: document.querySelectorAll('input[name="role"]'),
        authRadios: document.querySelectorAll('input[name="auth"]'),
        authLogin: document.getElementById('authLogin'),
        authSignup: document.getElementById('authSignup'),
        signupLabel: document.getElementById('signupLabel'),
        errorMessage: document.getElementById('errorMessage')
      };
      
      const REGISTERED_SCHOOL_NAME = "Mengo Senior School";
      
      // Update UI based on selections
      function updateUI() {
        const schoolNameValue = elements.schoolNameInput.value.trim();
        const schoolNameFilled = schoolNameValue !== '';
        const isSchoolRegistered = schoolNameValue.toLowerCase() === REGISTERED_SCHOOL_NAME.toLowerCase();
        const selectedRole = document.querySelector('input[name="role"]:checked')?.value;
        let selectedAuth = document.querySelector('input[name="auth"]:checked')?.value;
        
        // Teacher sign-up restriction
        if (selectedRole === 'teacher') {
          elements.authSignup.disabled = true;
          elements.signupLabel.classList.add('disabled-label');
          if (selectedAuth === 'signup') {
            elements.authLogin.checked = true;
            selectedAuth = 'login';
          }
        } else {
          elements.authSignup.disabled = false;
          elements.signupLabel.classList.remove('disabled-label');
        }
        
        // Determine button state
        const allFieldsSelected = schoolNameFilled && selectedRole && selectedAuth;
        const isValidCombination = !(selectedRole === 'teacher' && selectedAuth === 'signup');
        
        if (allFieldsSelected && isValidCombination && isSchoolRegistered) {
          elements.continueBtn.disabled = false;
          elements.continueBtn.classList.remove('disabled');
          elements.errorMessage.textContent = '';
        } else {
          elements.continueBtn.disabled = true;
          elements.continueBtn.classList.add('disabled');
          
          // Error messages in priority order
          if (!isSchoolRegistered && schoolNameFilled) {
            elements.errorMessage.textContent = `${schoolNameValue} has not yet registered for SchoolByte.`;
          } else if (!schoolNameFilled) {
            elements.errorMessage.textContent = 'Please enter your school name.';
          } else if (selectedRole === 'teacher' && selectedAuth === 'signup') {
            elements.errorMessage.textContent = 'Teachers can only log in, not sign up.';
          } else if (!selectedRole) {
            elements.errorMessage.textContent = 'Please select your role (Teacher/Student).';
          } else if (!selectedAuth) {
            elements.errorMessage.textContent = 'Please select Login or Sign Up.';
          } else {
            elements.errorMessage.textContent = '';
          }
        }
      }
      
      // Handle continue button click
      function handleContinue() {
        const schoolName = elements.schoolNameInput.value.trim();
        const selectedRole = document.querySelector('input[name="role"]:checked')?.value;
        const selectedAuth = document.querySelector('input[name="auth"]:checked')?.value;
        
        // Safeguard check (button should be disabled if invalid)
        const isSchoolRegistered = schoolName.toLowerCase() === REGISTERED_SCHOOL_NAME.toLowerCase();
        if (!schoolName || !selectedRole || !selectedAuth ||
            (selectedRole === 'teacher' && selectedAuth === 'signup') || !isSchoolRegistered) {
          updateUI();
          return;
        }
        
        const redirectMap = {
          student: {
            login: 'students\'login.html', // Corrected path
            signup: 'students\'signup.html' // Corrected path
          },
          teacher: {
            login: 'teachers\'login.html' // Corrected path
          }
        };
        
        const redirectURL = redirectMap[selectedRole]?.[selectedAuth];
        if (redirectURL) {
          window.location.href = redirectURL;
        } else {
          elements.errorMessage.textContent = 'An unexpected redirection error occurred.';
        }
      }
      
      // Event listeners
      elements.schoolNameInput.addEventListener('input', updateUI);
      elements.roleRadios.forEach(radio => radio.addEventListener('change', updateUI));
      elements.authRadios.forEach(radio => radio.addEventListener('change', updateUI));
      elements.continueBtn.addEventListener('click', handleContinue);
      
      // Initial UI update
      updateUI();
    });
  </script>
</body>
</html>
