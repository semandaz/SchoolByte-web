
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteNexus Chat - SchoolByte</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 350px;
            background: #f8f9fa;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            background: #667eea;
            color: white;
        }

        .sidebar-header h2 {
            margin-bottom: 10px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            background: white;
            border-bottom: 1px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            border-bottom-color: #667eea;
            color: #667eea;
            font-weight: bold;
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 5px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .contact-item:hover {
            background: #e8eaf6;
        }

        .contact-item.active {
            background: #667eea;
            color: white;
        }

        .contact-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            margin-right: 15px;
        }

        .contact-info {
            flex: 1;
        }

        .contact-name {
            font-weight: bold;
            margin-bottom: 3px;
        }

        .contact-details {
            font-size: 12px;
            opacity: 0.7;
        }

        .category-badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 10px;
            background: #4caf50;
            color: white;
            margin-top: 3px;
            display: inline-block;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .message.received .message-bubble {
            background: white;
            border: 1px solid #e0e0e0;
        }

        .message.sent .message-bubble {
            background: #667eea;
            color: white;
        }

        .message-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 5px;
            margin-top: 5px;
            font-size: 11px;
            opacity: 0.8;
        }

        .message.received .message-meta {
            justify-content: flex-start;
        }

        .message-time {
            font-size: 10px;
        }

        .message-status {
            display: inline-flex;
            align-items: center;
        }

        .message-status i {
            font-size: 12px;
        }

        .chat-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
        }

        .chat-input button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        .chat-input button:hover {
            background: #5568d3;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>ByteNexus Chat</h2>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search students...">
                </div>
            </div>
            <div class="tabs">
                <div class="tab active" data-tab="suggestions">Suggestions</div>
                <div class="tab" data-tab="search">Search</div>
            </div>
            <div class="contacts-list" id="contactsList">
                <div class="loading">Loading contacts...</div>
            </div>
        </div>

        <div class="chat-area">
            <div id="emptyState" class="empty-state">
                <h3>Select a contact to start chatting</h3>
                <p>Choose a classmate from the list</p>
            </div>
            <div id="chatContainer" style="display: none; flex-direction: column; height: 100%;">
                <div class="chat-header" id="chatHeader">
                    <img class="contact-avatar" id="chatAvatar" src="">
                    <div class="contact-info">
                        <div class="contact-name" id="chatName"></div>
                        <div class="contact-details" id="chatDetails"></div>
                    </div>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input">
                    <input type="text" id="messageInput" placeholder="Type a message...">
                    <button id="sendButton">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const API_URL = window.location.origin;
        let token = localStorage.getItem('token'); // Use SchoolByte token directly
        let currentUser = null;
        let activeContact = null;
        let currentTab = 'suggestions';
        let socket = null;
        let messages = [];

        // Initialize chat using SchoolByte authentication
        async function initByteNexusSession() {
            const contactsList = document.getElementById('contactsList');
            
            if (!token) {
                contactsList.innerHTML = '<div class="loading" style="color: #f44336;">❌ Please log in to SchoolByte first to use ByteNexus Chat<br><br><a href="/" style="color: #667eea; text-decoration: underline;">Go to Login</a></div>';
                console.error('No authentication token found');
                return;
            }

            try {
                // Get student data from SchoolByte
                contactsList.innerHTML = '<div class="loading">Verifying authentication...</div>';
                const response = await fetch(`${API_URL}/student/dashboard`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Authentication failed:', response.status, errorText);
                    contactsList.innerHTML = '<div class="loading" style="color: #f44336;">❌ Authentication failed. Your session may have expired.<br><br><a href="/" style="color: #667eea; text-decoration: underline;">Please log in again</a></div>';
                    return;
                }

                const data = await response.json();
                currentUser = {
                    id: data.student._id.toString(),
                    username: data.student.studentName,
                    email: data.student.email,
                    class: data.student.class,
                    stream: data.student.stream,
                    avatar_url: `https://api.dicebear.com/7.x/initials/svg?seed=${data.student.studentName}`
                };

                console.log('ByteNexus initialized for:', currentUser.username);

                // Initialize Socket.io connection
                initSocket();
                loadContacts();
            } catch (error) {
                console.error('ByteNexus initialization error:', error);
                contactsList.innerHTML = '<div class="loading" style="color: #f44336;">❌ Failed to initialize chat. Please try again.<br><br><a href="/" style="color: #667eea; text-decoration: underline;">Back to Login</a></div>';
            }
        }

        // Initialize Socket.io connection
        function initSocket() {
            socket = io(API_URL, {
                auth: { token: token }
            });

            socket.on('connect', () => {
                console.log('Connected to ByteNexus chat server');
            });

            socket.on('new_personal_message', (message) => {
                if (activeContact && 
                    (message.sender_id === activeContact.id || message.recipient_id === activeContact.id)) {
                    
                    // If this is our own sent message coming back, update the pending one
                    if (message.sender_id === currentUser.id && message.tempId) {
                        const pendingIndex = messages.findIndex(m => m.tempId === message.tempId);
                        if (pendingIndex !== -1) {
                            messages[pendingIndex] = { ...message, status: 'sent' };
                        } else {
                            messages.push({ ...message, status: 'sent' });
                        }
                    } else {
                        // Received message from other person
                        messages.push(message);
                        
                        // Auto-mark as read when viewing the chat
                        if (message.sender_id === activeContact.id) {
                            socket.emit('mark_message_read', { messageId: message._id });
                        }
                    }
                    
                    displayMessages();
                }
            });

            // Listen for message status updates
            socket.on('message_status_update', (data) => {
                const { messageId, status } = data;
                const msgIndex = messages.findIndex(m => m._id === messageId);
                if (msgIndex !== -1) {
                    messages[msgIndex].status = status;
                    if (status === 'read') {
                        messages[msgIndex].read = true;
                    } else if (status === 'delivered') {
                        messages[msgIndex].delivered = true;
                    }
                    displayMessages();
                }
            });

            // Listen for message sent confirmation
            socket.on('message_sent_confirmation', (data) => {
                const { tempId, messageId, status } = data;
                const msgIndex = messages.findIndex(m => m.tempId === tempId);
                if (msgIndex !== -1) {
                    messages[msgIndex]._id = messageId;
                    messages[msgIndex].status = status || 'sent';
                    delete messages[msgIndex].tempId;
                    displayMessages();
                }
            });

            // Handle delivery confirmations
            socket.on('message_delivered', (data) => {
                const { messageId } = data;
                const msgIndex = messages.findIndex(m => m._id === messageId);
                if (msgIndex !== -1) {
                    messages[msgIndex].delivered = true;
                    messages[msgIndex].status = 'delivered';
                    displayMessages();
                }
            });

            // Handle read receipts
            socket.on('message_read_receipt', (data) => {
                const { messageId } = data;
                const msgIndex = messages.findIndex(m => m._id === messageId);
                if (msgIndex !== -1) {
                    messages[msgIndex].read = true;
                    messages[msgIndex].status = 'read';
                    displayMessages();
                }
            });

            socket.on('disconnect', () => {
                console.log('Disconnected from chat server');
            });

            socket.on('connect_error', (error) => {
                console.error('Connection error:', error);
            });
        }

        async function loadContacts() {
            const contactsList = document.getElementById('contactsList');
            
            if (currentTab === 'suggestions') {
                contactsList.innerHTML = '<div class="loading">Loading suggestions...</div>';
                
                try {
                    const response = await fetch(`${API_URL}/api/students/suggestions`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (!response.ok) {
                        throw new Error('Failed to load contacts');
                    }

                    const data = await response.json();
                    displayContacts(data.suggestions || []);
                } catch (error) {
                    console.error('Error loading contacts:', error);
                    contactsList.innerHTML = '<div class="loading">Failed to load contacts. Please refresh.</div>';
                }
            }
        }

        function displayContacts(contacts) {
            const contactsList = document.getElementById('contactsList');
            
            if (contacts.length === 0) {
                contactsList.innerHTML = '<div class="loading">No contacts found</div>';
                return;
            }

            contactsList.innerHTML = contacts.map(contact => `
                <div class="contact-item" data-contact='${JSON.stringify(contact)}'>
                    <img class="contact-avatar" src="${contact.avatar_url || `https://api.dicebear.com/7.x/initials/svg?seed=${contact.studentName}`}" alt="${contact.studentName}">
                    <div class="contact-info">
                        <div class="contact-name">${contact.studentName}</div>
                        <div class="contact-details">${contact.email}</div>
                        <span class="category-badge">${contact.category}</span>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.contact-item').forEach(item => {
                item.addEventListener('click', () => {
                    const contact = JSON.parse(item.dataset.contact);
                    openChat(contact);
                });
            });
        }

        async function openChat(contact) {
            activeContact = contact;
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('chatContainer').style.display = 'flex';
            document.getElementById('chatName').textContent = contact.studentName;
            document.getElementById('chatDetails').textContent = `${contact.class} - ${contact.stream}`;
            document.getElementById('chatAvatar').src = contact.avatar_url || `https://api.dicebear.com/7.x/initials/svg?seed=${contact.studentName}`;
            
            // Join personal chat room
            const conversationId = [currentUser.id, contact.id].sort().join('_');
            socket.emit('join_personal_room', { conversationId });

            // Load chat history
            await loadMessages(contact.id);

            // Mark all received messages as read
            messages.forEach(msg => {
                if (msg.sender_id === contact.id && !msg.read) {
                    socket.emit('mark_message_read', { messageId: msg._id });
                }
            });
        }

        async function loadMessages(contactId) {
            const conversationId = [currentUser.id, contactId].sort().join('_');
            
            try {
                const response = await fetch(`${API_URL}/api/messages/personal/${conversationId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    messages = await response.json();
                    displayMessages();
                } else {
                    console.error('Failed to load messages');
                    messages = [];
                    displayMessages();
                }
            } catch (error) {
                console.error('Error loading messages:', error);
                messages = [];
                displayMessages();
            }
        }

        function displayMessages() {
            const chatMessages = document.getElementById('chatMessages');
            
            if (messages.length === 0) {
                chatMessages.innerHTML = '<div class="loading">No messages yet. Start the conversation!</div>';
                return;
            }

            chatMessages.innerHTML = messages.map(msg => {
                const isSent = msg.sender_id === currentUser.id;
                const statusIcon = getMessageStatusIcon(msg);
                const timestamp = new Date(msg.created_at || msg.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                return `
                    <div class="message ${isSent ? 'sent' : 'received'}">
                        <div class="message-bubble">
                            ${msg.content}
                            ${isSent ? `
                                <div class="message-meta">
                                    <span class="message-time">${timestamp}</span>
                                    <span class="message-status">${statusIcon}</span>
                                </div>
                            ` : `
                                <div class="message-meta">
                                    <span class="message-time">${timestamp}</span>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            }).join('');

            // Scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function getMessageStatusIcon(msg) {
            // If message has no _id, it's pending (not yet sent to server)
            if (!msg._id && msg.status === 'pending') {
                return '<i class="fas fa-clock" style="color: #999;" title="Sending..."></i>';
            }
            
            // If message is read (double green ticks)
            if (msg.read || msg.status === 'read') {
                return '<i class="fas fa-check-double" style="color: #00d084;" title="Read"></i>';
            }
            
            // If message is delivered but not read (double grey ticks)
            if (msg.delivered || msg.status === 'delivered') {
                return '<i class="fas fa-check-double" style="color: #999;" title="Delivered"></i>';
            }
            
            // If message is sent but not delivered (single grey tick)
            if (msg._id || msg.status === 'sent') {
                return '<i class="fas fa-check" style="color: #999;" title="Sent"></i>';
            }
            
            // Default: pending
            return '<i class="fas fa-clock" style="color: #999;" title="Pending"></i>';
        }

        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const content = messageInput.value.trim();

            if (!content || !activeContact) return;

            // Create temporary pending message
            const tempMessage = {
                sender_id: currentUser.id,
                recipient_id: activeContact.id,
                content: content,
                status: 'pending',
                timestamp: new Date(),
                tempId: Date.now() + Math.random() // Temporary ID
            };

            // Add to messages array immediately for instant UI feedback
            messages.push(tempMessage);
            displayMessages();

            // Emit message via Socket.io
            socket.emit('send_personal_message', {
                recipientId: activeContact.id,
                content: content,
                tempId: tempMessage.tempId
            });

            messageInput.value = '';
        }

        document.getElementById('sendButton').addEventListener('click', sendMessage);

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(async () => {
                const query = e.target.value.trim();
                if (query.length < 2) {
                    loadContacts();
                    return;
                }

                try {
                    const response = await fetch(`${API_URL}/api/students/search?query=${encodeURIComponent(query)}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (!response.ok) throw new Error('Search failed');

                    const data = await response.json();
                    displayContacts(data.students.map(s => ({
                        ...s,
                        category: 'Search Result'
                    })));
                } catch (error) {
                    console.error('Search error:', error);
                }
            }, 300);
        });

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                loadContacts();
            });
        });

        initByteNexusSession();
    </script>
</body>
</html>
