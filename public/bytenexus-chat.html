
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteNexus Chat - SchoolByte</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 350px;
            background: #f8f9fa;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            background: #667eea;
            color: white;
        }

        .sidebar-header h2 {
            margin-bottom: 10px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            background: white;
            border-bottom: 1px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            border-bottom-color: #667eea;
            color: #667eea;
            font-weight: bold;
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 5px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .contact-item:hover {
            background: #e8eaf6;
        }

        .contact-item.active {
            background: #667eea;
            color: white;
        }

        .contact-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            margin-right: 15px;
        }

        .contact-info {
            flex: 1;
        }

        .contact-name {
            font-weight: bold;
            margin-bottom: 3px;
        }

        .contact-details {
            font-size: 12px;
            opacity: 0.7;
        }

        .category-badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 10px;
            background: #4caf50;
            color: white;
            margin-top: 3px;
            display: inline-block;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .message.received .message-bubble {
            background: white;
            border: 1px solid #e0e0e0;
        }

        .message.sent .message-bubble {
            background: #667eea;
            color: white;
        }

        .chat-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
        }

        .chat-input button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        .chat-input button:hover {
            background: #5568d3;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>ByteNexus Chat</h2>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search students...">
                </div>
            </div>
            <div class="tabs">
                <div class="tab active" data-tab="suggestions">Suggestions</div>
                <div class="tab" data-tab="search">Search</div>
            </div>
            <div class="contacts-list" id="contactsList">
                <div class="loading">Loading contacts...</div>
            </div>
        </div>

        <div class="chat-area">
            <div id="emptyState" class="empty-state">
                <h3>Select a contact to start chatting</h3>
                <p>Choose a classmate from the list</p>
            </div>
            <div id="chatContainer" style="display: none; flex-direction: column; height: 100%;">
                <div class="chat-header" id="chatHeader">
                    <img class="contact-avatar" id="chatAvatar" src="">
                    <div class="contact-info">
                        <div class="contact-name" id="chatName"></div>
                        <div class="contact-details" id="chatDetails"></div>
                    </div>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input">
                    <input type="text" id="messageInput" placeholder="Type a message...">
                    <button id="sendButton">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const API_URL = window.location.origin;
        let token = localStorage.getItem('token'); // Use SchoolByte token directly
        let currentUser = null;
        let activeContact = null;
        let currentTab = 'suggestions';

        // Initialize chat using SchoolByte authentication
        async function initByteNexusSession() {
            if (!token) {
                alert('Please log in to use ByteNexus Chat');
                window.parent.postMessage({ type: 'closeChat' }, '*');
                return;
            }

            // Get student data from SchoolByte
            const response = await fetch(`${API_URL}/student/dashboard`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!response.ok) {
                alert('Authentication failed. Please log in again.');
                window.parent.postMessage({ type: 'closeChat' }, '*');
                return;
            }

            const data = await response.json();
            currentUser = {
                id: data.student._id || data.student.studentName,
                username: data.student.studentName,
                email: data.student.email,
                class: data.student.class,
                stream: data.student.stream,
                avatar_url: `https://api.dicebear.com/7.x/initials/svg?seed=${data.student.studentName}`
            };

            loadContacts();
        }

        async function loadContacts() {
            const contactsList = document.getElementById('contactsList');
            
            if (currentTab === 'suggestions') {
                contactsList.innerHTML = '<div class="loading">Loading suggestions...</div>';
                
                try {
                    const response = await fetch(`${API_URL}/api/students/suggestions`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (!response.ok) {
                        throw new Error('Failed to load contacts');
                    }

                    const data = await response.json();
                    displayContacts(data.suggestions || []);
                } catch (error) {
                    console.error('Error loading contacts:', error);
                    contactsList.innerHTML = '<div class="loading">Failed to load contacts. Please refresh.</div>';
                }
            }
        }

        function displayContacts(contacts) {
            const contactsList = document.getElementById('contactsList');
            
            if (contacts.length === 0) {
                contactsList.innerHTML = '<div class="loading">No contacts found</div>';
                return;
            }

            contactsList.innerHTML = contacts.map(contact => `
                <div class="contact-item" data-contact='${JSON.stringify(contact)}'>
                    <img class="contact-avatar" src="${contact.avatar_url || `https://api.dicebear.com/7.x/initials/svg?seed=${contact.studentName}`}" alt="${contact.studentName}">
                    <div class="contact-info">
                        <div class="contact-name">${contact.studentName}</div>
                        <div class="contact-details">${contact.email}</div>
                        <span class="category-badge">${contact.category}</span>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.contact-item').forEach(item => {
                item.addEventListener('click', () => {
                    const contact = JSON.parse(item.dataset.contact);
                    openChat(contact);
                });
            });
        }

        function openChat(contact) {
            activeContact = contact;
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('chatContainer').style.display = 'flex';
            document.getElementById('chatName').textContent = contact.studentName;
            document.getElementById('chatDetails').textContent = `${contact.class} - ${contact.stream}`;
            document.getElementById('chatAvatar').src = contact.avatar_url || `https://api.dicebear.com/7.x/initials/svg?seed=${contact.studentName}`;
            document.getElementById('chatMessages').innerHTML = '<div class="loading">Chat functionality coming soon!</div>';
        }

        document.getElementById('sendButton').addEventListener('click', () => {
            alert('Chat messaging will be available soon!');
        });

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                alert('Chat messaging will be available soon!');
            }
        });

        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(async () => {
                const query = e.target.value.trim();
                if (query.length < 2) {
                    loadContacts();
                    return;
                }

                try {
                    const response = await fetch(`${API_URL}/api/students/search?query=${encodeURIComponent(query)}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (!response.ok) throw new Error('Search failed');

                    const data = await response.json();
                    displayContacts(data.students.map(s => ({
                        ...s,
                        category: 'Search Result'
                    })));
                } catch (error) {
                    console.error('Search error:', error);
                }
            }, 300);
        });

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                loadContacts();
            });
        });

        initByteNexusSession();
    </script>
</body>
</html>
