
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteNexus Chat - SchoolByte</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 350px;
            background: #f8f9fa;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            background: #667eea;
            color: white;
        }

        .sidebar-header h2 {
            margin-bottom: 10px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            background: white;
            border-bottom: 1px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            border-bottom-color: #667eea;
            color: #667eea;
            font-weight: bold;
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 5px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .contact-item:hover {
            background: #e8eaf6;
        }

        .contact-item.active {
            background: #667eea;
            color: white;
        }

        .contact-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            margin-right: 15px;
        }

        .contact-info {
            flex: 1;
        }

        .contact-name {
            font-weight: bold;
            margin-bottom: 3px;
        }

        .contact-details {
            font-size: 12px;
            opacity: 0.7;
        }

        .category-badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 10px;
            background: #4caf50;
            color: white;
            margin-top: 3px;
            display: inline-block;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .message.received .message-bubble {
            background: white;
            border: 1px solid #e0e0e0;
        }

        .message.sent .message-bubble {
            background: #667eea;
            color: white;
        }

        .chat-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
        }

        .chat-input button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        .chat-input button:hover {
            background: #5568d3;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>ByteNexus Chat</h2>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search students...">
                </div>
            </div>
            <div class="tabs">
                <div class="tab active" data-tab="suggestions">Suggestions</div>
                <div class="tab" data-tab="search">Search</div>
            </div>
            <div class="contacts-list" id="contactsList">
                <div class="loading">Loading contacts...</div>
            </div>
        </div>

        <div class="chat-area">
            <div id="emptyState" class="empty-state">
                <h3>Select a contact to start chatting</h3>
                <p>Choose a classmate from the list</p>
            </div>
            <div id="chatContainer" style="display: none; flex-direction: column; height: 100%;">
                <div class="chat-header" id="chatHeader">
                    <img class="contact-avatar" id="chatAvatar" src="">
                    <div class="contact-info">
                        <div class="contact-name" id="chatName"></div>
                        <div class="contact-details" id="chatDetails"></div>
                    </div>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input">
                    <input type="text" id="messageInput" placeholder="Type a message...">
                    <button id="sendButton">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const API_URL = window.location.origin;
        const BYTENEXUS_WS = 'http://localhost:5000'; // ByteNexus server port
        let token = localStorage.getItem('byteNexusToken');
        let currentUser = null;
        let activeContact = null;
        let socket = null;
        let currentTab = 'suggestions';

        // Initialize ByteNexus session from SchoolByte
        async function initByteNexusSession() {
            const schoolByteToken = localStorage.getItem('token');
            if (!schoolByteToken) {
                window.location.href = '/studentlogin.html';
                return;
            }

            // Get student data from SchoolByte
            const response = await fetch(`${API_URL}/student/dashboard`, {
                headers: { 'Authorization': `Bearer ${schoolByteToken}` }
            });

            if (!response.ok) {
                window.location.href = '/studentlogin.html';
                return;
            }

            const data = await response.json();
            const student = data.student;

            // Sync with ByteNexus
            const syncResponse = await fetch(`${API_URL}/api/auth/sync-schoolbyte`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: student.email,
                    studentName: student.studentName,
                    class: student.class,
                    stream: student.stream
                })
            });

            const syncData = await syncResponse.json();
            token = syncData.token;
            localStorage.setItem('byteNexusToken', token);
            currentUser = syncData.user;

            initSocket();
            loadContacts();
        }

        function initSocket() {
            socket = io(BYTENEXUS_WS, {
                auth: { token: token }
            });

            socket.on('connect', () => {
                console.log('Connected to ByteNexus');
            });

            socket.on('new_personal_message', (message) => {
                if (activeContact && 
                    (message.sender_id === activeContact.id || message.recipient_id === activeContact.id)) {
                    displayMessage(message);
                }
            });
        }

        async function loadContacts() {
            const contactsList = document.getElementById('contactsList');
            
            if (currentTab === 'suggestions') {
                contactsList.innerHTML = '<div class="loading">Loading suggestions...</div>';
                
                const response = await fetch(`${API_URL}/api/contacts/suggestions`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();
                displayContacts(data.suggestions);
            }
        }

        function displayContacts(contacts) {
            const contactsList = document.getElementById('contactsList');
            
            if (contacts.length === 0) {
                contactsList.innerHTML = '<div class="loading">No contacts found</div>';
                return;
            }

            contactsList.innerHTML = contacts.map(contact => `
                <div class="contact-item" data-contact='${JSON.stringify(contact)}'>
                    <img class="contact-avatar" src="${contact.avatar_url}" alt="${contact.username}">
                    <div class="contact-info">
                        <div class="contact-name">${contact.username}</div>
                        <div class="contact-details">${contact.email}</div>
                        <span class="category-badge">${contact.category}</span>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.contact-item').forEach(item => {
                item.addEventListener('click', () => {
                    const contact = JSON.parse(item.dataset.contact);
                    openChat(contact);
                });
            });
        }

        function openChat(contact) {
            activeContact = contact;
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('chatContainer').style.display = 'flex';
            document.getElementById('chatName').textContent = contact.username;
            document.getElementById('chatDetails').textContent = `${contact.class} - ${contact.stream}`;
            document.getElementById('chatAvatar').src = contact.avatar_url;
            document.getElementById('chatMessages').innerHTML = '';

            const conversationId = [currentUser.id, contact.id].sort().join('_');
            socket.emit('join_personal_room', { conversationId });

            loadMessages(conversationId);
        }

        async function loadMessages(conversationId) {
            const response = await fetch(`${API_URL}/api/messages/personal/${conversationId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            const messages = await response.json();
            messages.forEach(displayMessage);
        }

        function displayMessage(message) {
            const messagesDiv = document.getElementById('chatMessages');
            const isSent = message.sender_id === currentUser.id;
            
            const messageEl = document.createElement('div');
            messageEl.className = `message ${isSent ? 'sent' : 'received'}`;
            messageEl.innerHTML = `<div class="message-bubble">${message.content}</div>`;
            
            messagesDiv.appendChild(messageEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        document.getElementById('sendButton').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            
            if (!content || !activeContact) return;

            socket.emit('send_personal_message', {
                recipientId: activeContact.id,
                content: content
            });

            input.value = '';
        }

        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(async () => {
                const query = e.target.value.trim();
                if (query.length < 2) return;

                const response = await fetch(`${API_URL}/api/search/users?q=${encodeURIComponent(query)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const users = await response.json();
                displayContacts(users);
            }, 300);
        });

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                loadContacts();
            });
        });

        initByteNexusSession();
    </script>
</body>
</html>
