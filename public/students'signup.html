<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolByte - Student Sign Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Global CSS Variables for Unified Color Palette (copy from index.html) */
        :root {
          /* Brand Colors */
          --color-brand-primary: #1a2a6c;   /* Dark Blue - Main brand color */
          --color-brand-secondary: #b21f1f; /* Deep Red/Maroon - Secondary brand color, accents */
          --color-brand-gold: #FFD700;     /* Gold - Accent for special elements, highlights */
          --color-brand-orange: #FFA500;   /* Orange - Used in gradients with gold */

          /* Neutral Palette */
          --color-neutral-white: #ffffff;
          --color-neutral-lightest: #f0f4f8; /* Very light gray/blue, good for subtle backgrounds */
          --color-neutral-light: #d1d5db;    /* Light gray for disabled elements, input borders */
          --color-neutral-medium: #9ca3af;   /* Medium gray for placeholders, disabled radio accents */
          --color-neutral-dark: #4b5563;     /* Dark gray for most body text, labels */
          --color-neutral-darkest: #333333;  /* Very dark gray for prominent text (e.g., terms.html body) */

          /* Semantic Colors */
          --color-error-red: #e74c3c;        /* Standard error color */
          --color-error-red-dark: #c0392b;   /* Darker error red for hover states */

          /* Background Gradients */
          --gradient-background-primary: linear-gradient(135deg, var(--color-brand-primary), var(--color-brand-secondary));
          --gradient-background-secondary: linear-gradient(135deg, var(--color-brand-primary), var(--color-brand-secondary), var(--color-brand-primary));
          
          /* Text Gradients */
          --gradient-text-gold: linear-gradient(to right, var(--color-brand-gold), var(--color-neutral-white));

          /* Button Gradients */
          --gradient-button-active: linear-gradient(to right, var(--color-brand-gold), var(--color-brand-orange));
          --gradient-button-active-hover: linear-gradient(to right, #FFC800, #FF8C00);

          /* Transparent Overlays (for cards, popups, etc.) */
          --overlay-light: rgba(255, 255, 255, 0.1);
          --overlay-medium: rgba(0, 0, 0, 0.2);
          --overlay-dark: rgba(30, 30, 60, 0.95);
          --overlay-selected-option: rgba(26, 42, 108, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif; /* Standardized font */
        }
        
        body {
            background: var(--gradient-background-primary); /* Consistent background gradient */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            padding: 40px;
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .logo {
            font-size: 4.5rem;
            font-weight: 900;
            background: var(--gradient-background-primary); /* Consistent text gradient */
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -2px;
            margin-bottom: 10px;
        }
        
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--gradient-background-primary); /* Consistent avatar background */
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: var(--color-neutral-white);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .profile-header h2 {
            color: var(--color-brand-primary); /* Consistent heading color */
            font-size: 1.8rem;
            font-weight: 700;
        }
        
        .form-group {
            margin-bottom: 25px;
            position: relative; /* For send-code-btn positioning */
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-brand-primary); /* Consistent label color */
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--color-neutral-light); /* Consistent border color */
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        input:focus {
            outline: none;
            border-color: var(--color-brand-primary); /* Consistent focus border color */
            box-shadow: 0 0 0 3px rgba(26, 42, 108, 0.2);
        }
        
        input::placeholder {
            color: var(--color-neutral-medium); /* Consistent placeholder color */
            font-style: italic;
        }
        
        .send-code-btn {
            position: absolute;
            right: 10px;
            top: 40px;
            background: var(--color-brand-primary); /* Consistent brand primary color */
            color: var(--color-neutral-white);
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .send-code-btn:hover:not(.disabled) {
            background: var(--color-brand-primary); /* Use a slightly darker shade or opacity */
            opacity: 0.9;
        }
        
        .send-code-btn.disabled {
            background: var(--color-neutral-light); /* Consistent disabled background */
            color: var(--color-neutral-dark); /* Consistent disabled text color */
            cursor: not-allowed;
        }
        
        .resend-code {
            text-align: right;
            margin-top: 5px;
            font-size: 0.9rem;
            color: var(--color-brand-primary); /* Consistent link color */
            cursor: pointer;
            display: none;
        }
        
        .resend-code:hover {
            text-decoration: underline;
        }
        
        .verification-code-input { /* Changed from .verification-code for consistency */
            letter-spacing: 10px;
            font-size: 1.2rem;
            text-align: center;
            padding: 15px;
        }

        /* NEW: Styles for password fields, if needed beyond general input styles */
        .password-section {
            display: none; /* Hidden by default, shown after email verification */
        }
        
        /* Password toggle button styles */
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 40px;
            cursor: pointer;
            color: var(--color-neutral-medium);
            transition: color 0.3s ease;
        }
        
        .password-toggle:hover {
            color: var(--color-brand-primary);
        }
        
        .terms {
            display: flex;
            align-items: center;
            margin: 25px 0;
            gap: 12px;
        }
        
        .terms-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid var(--color-neutral-light); /* Consistent border color */
            border-radius: 5px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }
        
        .terms-checkbox:checked {
            background-color: var(--color-brand-secondary); /* Consistent checked checkbox background */
            border-color: var(--color-brand-secondary); /* Consistent checked checkbox border */
        }
        
        .terms-checkbox:checked::before {
            content: '\2713';
            display: block;
            color: var(--color-neutral-white);
            font-size: 14px;
            text-align: center;
            line-height: 20px;
        }
        
        .terms-label {
            font-weight: normal;
            color: var(--color-neutral-dark); /* Consistent label text color */
        }
        
        .terms-label a {
            color: var(--color-brand-primary); /* Consistent link color */
            font-weight: 600;
            text-decoration: underline;
        }
        
        .terms-label a:hover {
            color: var(--color-brand-secondary); /* Consistent link hover color */
        }
        
        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 10px;
        }
        
        .btn {
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-back {
            background: var(--color-brand-secondary); /* Consistent back button color */
            color: var(--color-neutral-white);
            flex: 1;
        }
        
        .btn-back:hover {
            background: var(--color-error-red-dark); /* Consistent hover for back button */
            transform: translateY(-2px);
        }
        
        .btn-next {
            background: var(--color-neutral-light); /* Consistent disabled background */
            color: var(--color-neutral-dark); /* Consistent disabled text */
            flex: 2;
            cursor: not-allowed;
        }
        
        .btn-next.active {
            background: var(--color-brand-primary); /* Consistent active button color */
            color: var(--color-neutral-white);
            cursor: pointer;
        }
        
        .btn-next.active:hover {
            background: var(--color-brand-primary); /* Consider a darker primary shade if available, or just keep primary */
            opacity: 0.9; /* Add slight opacity change for hover if no dark variant */
            transform: translateY(-2px);
        }
        
        .btn i {
            font-size: 1.2rem;
        }

        /* Custom Message Box Styles (copied for consistency) */
        .message-box-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }

        .message-box-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .message-box {
            background: var(--color-neutral-white);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }

        .message-box-overlay.show .message-box {
            transform: translateY(0);
        }

        .message-box h3 {
            color: var(--color-error-red);
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .message-box p {
            color: var(--color-neutral-darkest);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
            white-space: pre-wrap; /* Allows newlines from JS to display */
        }

        .message-box button {
            background: var(--color-brand-primary);
            color: var(--color-neutral-white);
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .message-box button:hover {
            background: var(--color-brand-primary); /* Consistent hover for primary */
        }
        
        @media (max-width: 768px) {
            .card {
                padding: 30px 20px;
            }
            
            .logo {
                font-size: 3.5rem;
            }
            
            .avatar {
                width: 100px;
                height: 100px;
                font-size: 2.5rem;
            }
            
            .buttons {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo-container">
                <div class="logo">SchoolByte</div>
            </div>
            
            <div class="profile-header">
                <div class="avatar">
                    <i class="fas fa-user-graduate"></i>
                </div>
                <h2>Student Sign Up</h2>
            </div>
            
            <form id="studentSignupForm">
                <div class="form-group">
                    <label for="studentName">Student's Name</label>
                    <input type="text" id="studentName" placeholder="e.g., Naluwagga Joy" required>
                </div>
                
                <div class="form-group">
                    <label for="indexNumber">Index Number</label>
                    <input type="text" id="indexNumber" placeholder="e.g., 21m/ms/22" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="schoolbyte@gmail.com" required>
                    <button type="button" id="sendCodeBtn" class="send-code-btn" disabled>Send Code</button>
                    <div id="resendCode" class="resend-code">Didn't receive code? Send code again</div>
                </div>
                
                <div class="form-group">
                    <label for="verificationCode">Verification Code</label>
                    <input type="text" id="verificationCode" placeholder="••••••" maxlength="6" class="verification-code-input" required>
                </div>

                <!-- NEW: Password fields, initially hidden -->
                <div id="passwordSection" class="password-section">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Min 8 chars, incl. uppercase, lowercase, number, special" required>
                        <i class="fas fa-eye password-toggle" id="togglePassword"></i>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>
                        <i class="fas fa-eye password-toggle" id="toggleConfirmPassword"></i>
                    </div>
                </div>
                
                <div class="terms">
                    <input type="checkbox" id="agreeTerms" class="terms-checkbox">
                    <label for="agreeTerms" class="terms-label">
                        I confirm that I have read the <a href="term.html" target="_blank">Terms and Conditions</a> of SchoolByte
                    </label>
                </div>
                
                <div class="buttons">
                    <button type="button" class="btn btn-back" onclick="location.href='index.html'">
                        <i class="fas fa-arrow-left"></i> Back
                    </button>
                    <button type="submit" id="submitButton" class="btn btn-next" disabled>
                        Continue <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom Message Box HTML -->
    <div id="messageBoxOverlay" class="message-box-overlay">
        <div class="message-box">
            <h3 id="messageBoxTitle"></h3>
            <p id="messageBoxContent"></p>
            <button id="messageBoxCloseBtn">OK</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Define your backend URL here! This is the URL Replit gives you.
            const BACKEND_URL = 'https://e6a47e2e-7ff5-4724-be0b-2504fa40eb11-00-2wcx9db4aw73j.spock.replit.dev'; 

            // Cached DOM elements
            const sendCodeBtn = document.getElementById('sendCodeBtn');
            const resendCode = document.getElementById('resendCode');
            const emailInput = document.getElementById('email');
            const verificationCodeInput = document.getElementById('verificationCode');
            const studentSignupForm = document.getElementById('studentSignupForm');
            const studentNameInput = document.getElementById('studentName');
            const indexNumberInput = document.getElementById('indexNumber');
            const passwordInput = document.getElementById('password'); // NEW
            const confirmPasswordInput = document.getElementById('confirmPassword'); // NEW
            const passwordSection = document.getElementById('passwordSection'); // NEW
            const togglePassword = document.getElementById('togglePassword'); // NEW
            const toggleConfirmPassword = document.getElementById('toggleConfirmPassword'); // NEW
            const agreeTermsCheckbox = document.getElementById('agreeTerms');
            const submitButton = document.getElementById('submitButton');
            
            let countdownInterval;
            let emailVerified = false; // Flag to track successful email verification

            // Message Box elements
            const messageBoxOverlay = document.getElementById('messageBoxOverlay');
            const messageBoxTitle = document.getElementById('messageBoxTitle');
            const messageBoxContent = document.getElementById('messageBoxContent');
            const messageBoxCloseBtn = document.getElementById('messageBoxCloseBtn');

            // Function to display custom message box
            function showMessageBox(title, message) {
                messageBoxTitle.textContent = title;
                messageBoxContent.textContent = message;
                messageBoxOverlay.classList.add('show');
            }

            // Close message box
            messageBoxCloseBtn.addEventListener('click', function() {
                messageBoxOverlay.classList.remove('show');
            });
            
            // Validate email format
            function isValidEmail(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }

            // Validate password complexity
            function isValidPassword(password) {
                // Minimum 8 characters, at least one uppercase, one lowercase, one number, one special character
                const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+])[A-Za-z\d!@#$%^&*()_+]{8,}$/;
                return passwordRegex.test(password);
            }
            
            // Toggle password visibility
            function setupPasswordToggle(toggleElement, passwordField) {
                toggleElement.addEventListener('click', function() {
                    const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordField.setAttribute('type', type);
                    toggleElement.classList.toggle('fa-eye');
                    toggleElement.classList.toggle('fa-eye-slash');
                });
            }
            
            // Initialize password toggles
            setupPasswordToggle(togglePassword, passwordInput);
            setupPasswordToggle(toggleConfirmPassword, confirmPasswordInput);
            
            // Start countdown timer for resend
            function startCountdown() {
                let seconds = 60;
                sendCodeBtn.classList.add('disabled');
                sendCodeBtn.textContent = `Resend (${seconds}s)`;
                sendCodeBtn.disabled = true; 
                
                clearInterval(countdownInterval); // Clear any existing interval
                countdownInterval = setInterval(function() {
                    seconds--;
                    sendCodeBtn.textContent = `Resend (${seconds}s)`;
                    
                    if (seconds <= 0) {
                        clearInterval(countdownInterval);
                        sendCodeBtn.classList.remove('disabled');
                        sendCodeBtn.textContent = 'Send Code';
                        sendCodeBtn.disabled = false;
                        resendCode.style.display = 'block'; // Show "send again" message
                        countdownInterval = null; // Reset interval flag
                    }
                }, 1000);
            }
            
            // Send verification code to backend
            sendCodeBtn.addEventListener('click', async function() {
                if (!isValidEmail(emailInput.value)) { 
                     showMessageBox('Input Error', 'Please enter a valid email address to send the code.');
                     return;
                }
                if (sendCodeBtn.classList.contains('disabled') && sendCodeBtn.textContent.includes('Resend')) {
                    return; // Do not allow re-click during countdown
                }
                
                // Show loading state
                sendCodeBtn.textContent = 'Sending...';
                sendCodeBtn.disabled = true;
                sendCodeBtn.classList.add('disabled'); 

                try {
                    const response = await fetch(`${BACKEND_URL}/send-verification-code`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email: emailInput.value })
                    });

                    const data = await response.json(); 

                    if (response.ok) { 
                        showMessageBox('Success', data.message);
                        startCountdown(); 
                        resendCode.style.display = 'none';
                    } else {
                        showMessageBox('Error', data.message || 'Failed to send verification code. Please try again.');
                        sendCodeBtn.textContent = 'Send Code';
                        sendCodeBtn.disabled = false;
                        sendCodeBtn.classList.remove('disabled'); 
                        resendCode.style.display = 'block';
                    }
                } catch (error) {
                    console.error('Error sending verification code:', error);
                    showMessageBox('Network Error', 'Could not connect to the server. Please check your internet connection and try again.');
                    sendCodeBtn.textContent = 'Send Code';
                    sendCodeBtn.disabled = false;
                    sendCodeBtn.classList.remove('disabled'); 
                    resendCode.style.display = 'block';
                }
            });
            
            // Resend verification code (this will trigger the same API call)
            resendCode.addEventListener('click', function() {
                if (isValidEmail(emailInput.value)) {
                    sendCodeBtn.click(); 
                } else {
                    showMessageBox('Input Error', 'Please enter a valid email address to resend the code.');
                }
            });
            
            // Validate form on input changes and control button states
            function validateForm() {
                const isEmailValid = isValidEmail(emailInput.value);
                const isNameFilled = studentNameInput.value.trim() !== '';
                const isIndexNumberFilled = indexNumberInput.value.trim() !== '';
                const isCodeFilled = verificationCodeInput.value.length === 6;
                const isTermsChecked = agreeTermsCheckbox.checked;

                // Control Send Code button
                if (isEmailValid && !countdownInterval) { 
                    sendCodeBtn.disabled = false;
                    sendCodeBtn.classList.remove('disabled');
                } else {
                    sendCodeBtn.disabled = true;
                    sendCodeBtn.classList.add('disabled');
                }

                let isFormValidForSubmission = false;

                if (!emailVerified) {
                    // Before email is verified, submit button depends only on previous fields
                    isFormValidForSubmission = isNameFilled && isIndexNumberFilled && isEmailValid && isCodeFilled && isTermsChecked;
                } else {
                    // After email is verified, submit button also depends on passwords
                    const isPasswordFilled = passwordInput.value.length >= 8; // Basic length check
                    const isConfirmPasswordFilled = confirmPasswordInput.value.length >= 8;
                    const passwordsMatch = passwordInput.value === confirmPasswordInput.value;
                    const isPasswordComplex = isValidPassword(passwordInput.value);


                    isFormValidForSubmission = isNameFilled && isIndexNumberFilled && isEmailValid && 
                                               isCodeFilled && isTermsChecked && isPasswordFilled && 
                                               isConfirmPasswordFilled && passwordsMatch && isPasswordComplex;
                }
                
                // Control Continue (Submit) button
                if (isFormValidForSubmission) {
                    submitButton.classList.remove('btn-disabled'); 
                    submitButton.classList.add('active');
                    submitButton.disabled = false;
                } else {
                    submitButton.classList.add('btn-disabled'); 
                    submitButton.classList.remove('active');
                    submitButton.disabled = true;
                }
            }
            
            // Add event listeners for form validation
            studentNameInput.addEventListener('input', validateForm);
            indexNumberInput.addEventListener('input', validateForm);
            emailInput.addEventListener('input', validateForm);
            verificationCodeInput.addEventListener('input', validateForm);
            passwordInput.addEventListener('input', validateForm); // NEW
            confirmPasswordInput.addEventListener('input', validateForm); // NEW
            agreeTermsCheckbox.addEventListener('change', validateForm);
            
            // Form submission logic (now handles both code verification and registration)
            studentSignupForm.addEventListener('submit', async function(event) {
                event.preventDefault(); 

                const studentName = studentNameInput.value.trim();
                const indexNumber = indexNumberInput.value.trim();
                const email = emailInput.value.trim();
                const verificationCode = verificationCodeInput.value.trim();
                const password = passwordInput.value; // NEW
                const confirmPassword = confirmPasswordInput.value; // NEW

                // Stage 1: Verify Email Code
                if (!emailVerified) {
                    if (verificationCode.length !== 6) {
                        showMessageBox('Validation Error', 'Please enter the 6-digit verification code.');
                        verificationCodeInput.focus();
                        return;
                    }

                    submitButton.textContent = 'Verifying Code...';
                    submitButton.disabled = true;
                    submitButton.classList.remove('active');

                    try {
                        const response = await fetch(`${BACKEND_URL}/verify-code`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: email, code: verificationCode })
                        });

                        const data = await response.json();

                        if (response.ok) {
                            showMessageBox('Success', data.message);
                            emailVerified = true; // Set flag
                            passwordSection.style.display = 'block'; // Show password fields
                            emailInput.readOnly = true; // Prevent changing email after verification
                            verificationCodeInput.readOnly = true; // Prevent changing code after verification
                            sendCodeBtn.disabled = true;
                            sendCodeBtn.classList.add('disabled');
                            resendCode.style.display = 'none'; // Hide resend option
                            submitButton.textContent = 'Continue'; // Change button text for next stage
                            validateForm(); // Re-validate to enable/disable button based on new fields
                            passwordInput.focus(); // Focus on password field
                        } else {
                            showMessageBox('Error', data.message || 'Verification failed. Please try again.');
                            submitButton.textContent = 'Continue';
                            submitButton.disabled = false;
                            validateForm();
                        }
                    } catch (error) {
                        console.error('Error during code verification:', error);
                        showMessageBox('Network Error', 'Could not connect to the server during verification. Please try again.');
                        submitButton.textContent = 'Continue';
                        submitButton.disabled = false;
                        validateForm();
                    }
                } else {
                    // Stage 2: Register Student (Email already verified)
                    if (password.length < 8) {
                        showMessageBox('Validation Error', 'Password must be at least 8 characters long.');
                        passwordInput.focus();
                        return;
                    }
                    if (!isValidPassword(password)) {
                        showMessageBox('Password Requirements', 
                            'Password does not meet the requirements:\n' +
                            '- Minimum 8 characters\n' +
                            '- At least one uppercase letter\n' +
                            '- At least one lowercase letter\n' +
                            '- At least one number\n' +
                            '- At least one special character (!@#$%^&*()_+)');
                        passwordInput.focus();
                        return;
                    }
                    if (password !== confirmPassword) {
                        showMessageBox('Validation Error', 'Passwords do not match.');
                        confirmPasswordInput.focus();
                        return;
                    }

                    submitButton.textContent = 'Registering...';
                    submitButton.disabled = true;
                    submitButton.classList.remove('active');

                    try {
                        const response = await fetch(`${BACKEND_URL}/register-student`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ studentName, indexNumber, email, password })
                        });

                        const data = await response.json();

                        if (response.ok) {
                            showMessageBox('Success', data.message + '\nRedirecting to dashboard.');
                            setTimeout(() => {
                                window.location.href = './studentdashboard.html'; 
                            }, 1500);
                        } else {
                            showMessageBox('Error', data.message || 'Registration failed. Please try again.');
                            submitButton.textContent = 'Continue';
                            submitButton.disabled = false;
                            validateForm();
                        }
                    } catch (error) {
                        console.error('Error during student registration:', error);
                        showMessageBox('Network Error', 'Could not connect to the server during registration. Please try again.');
                        submitButton.textContent = 'Continue';
                        submitButton.disabled = false;
                        validateForm();
                    }
                }
            });

            // Initial validation when page loads
            validateForm();
        });
    </script>
</body>
</html>
