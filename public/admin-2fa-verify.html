<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolByte - Admin 2FA Verification</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2c3e50, #1a2530);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ecf0f1;
            padding: 20px;
        }

        .verify-container {
            width: 100%;
            max-width: 400px;
            background: rgba(30, 40, 56, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            padding: 40px;
            text-align: center;
            border: 1px solid rgba(127, 140, 163, 0.2);
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            color: #3498db;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #ecf0f1;
        }

        .description {
            color: #bdc3c7;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #bdc3c7;
        }

        .code-input {
            width: 100%;
            padding: 15px;
            background: rgba(25, 35, 50, 0.6);
            border: 1px solid rgba(127, 140, 163, 0.3);
            border-radius: 10px;
            color: #ecf0f1;
            font-size: 18px;
            text-align: center;
            letter-spacing: 3px;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
        }

        .code-input:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
            background: rgba(30, 45, 65, 0.7);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, #3498db, #2980b9);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover:not(:disabled) {
            background: linear-gradient(to right, #2980b9, #2573a7);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(41, 128, 185, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #e74c3c;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="verify-container">
        <div class="logo">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h1>Two-Factor Authentication</h1>
        <p class="description">
            We've sent a 6-digit code to your email address. Please enter it below to complete your admin login.
        </p>

        <form id="verify-form">
            <div class="form-group">
                <label for="verification-code">Verification Code</label>
                <input 
                    type="text" 
                    id="verification-code" 
                    class="code-input" 
                    placeholder="000000"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    autocomplete="one-time-code"
                    required
                >
            </div>

            <div class="error-message" id="error-message"></div>

            <button type="submit" class="btn" id="verify-btn">
                Verify and Login
            </button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const verifyForm = document.getElementById('verify-form');
            const codeInput = document.getElementById('verification-code');
            const verifyBtn = document.getElementById('verify-btn');
            const errorMessage = document.getElementById('error-message');

            const adminEmail = localStorage.getItem('adminEmail');

            // Redirect if no email stored
            if (!adminEmail) {
                window.location.href = 'teacherlogin.html';
                return;
            }

            // Auto-format code input
            codeInput.addEventListener('input', function(e) {
                // Only allow numbers
                this.value = this.value.replace(/[^0-9]/g, '');
            });

            // Show/hide error message
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.classList.add('show');
            }

            function hideError() {
                errorMessage.classList.remove('show');
            }

            // Handle form submission
            verifyForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                hideError();

                const code = codeInput.value.trim();

                if (code.length !== 6) {
                    showError('Please enter a valid 6-digit code.');
                    return;
                }

                verifyBtn.disabled = true;
                verifyBtn.innerHTML = '<span class="loading"></span> Verifying...';

                try {
                    const response = await fetch('/admin/verify-2fa', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            email: adminEmail,
                            code: code
                        }),
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.message || 'Verification failed');
                    }

                    // Store admin token and data
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('adminName', data.admin.adminName);
                    localStorage.setItem('adminEmail', data.admin.email);

                    // Redirect to admin dashboard
                    window.location.href = 'admin.html';

                } catch (error) {
                    console.error('2FA verification error:', error);
                    showError(error.message || 'Verification failed. Please try again.');
                } finally {
                    verifyBtn.disabled = false;
                    verifyBtn.textContent = 'Verify and Login';
                }
            });
        });
    </script>
</body>
</html>
